<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Decks Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .deck-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .deck-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .deck-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .deck-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .deck-file {
            font-size: 0.9em;
            color: #666;
            font-family: 'Monaco', 'Menlo', monospace;
            overflow-wrap: break-word;
        }

        .button-text {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border-radius: 6px;
            font-weight: 500;
            text-align: center;
            transition: background 0.2s;
        }

        .deck-card:hover .button-text {
            background: #764ba2;
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 60px;
            font-size: 0.95em;
        }

        .last-updated {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Study Decks</h1>
        <p class="subtitle">Your personal learning library for spaced repetition</p>

        <div class="deck-grid" id="deckGrid"></div>

        <div class="last-updated">
            <p>📝 Edit this list: Update the <code>files</code> array in the HTML</p>
        </div>

        <div class="footer">
            <p>💡 Tip: Add new decks by uploading them to GitHub and adding their names to this index</p>
        </div>
    </div>

    <script>
        // YOUR FILES - Edit this array to match your actual HTML files
        const files = [
            "7107 1.1-2 lungs, thoracic wall.html",
            "7107 1.3heart_deck_1.html",
            "7107 1.4 heart_deck_2.html",
            "7107 1.5 abdominal_deck.html",
            "7107 1.6foregut_midgut_hindgut_deck.html",
            "7107 1.7 vascular_urinary_final_deck.html",
            "7111 1.3 pharyngeal.html",
            "7111 1.4 clefts_pouches.html",
            "7111 1.5 bone.html",
            "7111 1.6 .html",
            "7111- 1.1 cell attachments.html",
            "7111- 1.2.html",
            "7111-exam 1 overview.html"
        ];

        // Generate clean names from filenames
        function cleanFileName(filename) {
            return filename
                .replace(/\.html$/, '')
                .replace(/-/g, ' ')
                .replace(/_/g, ' ')
                .replace(/\b\w/g, l => l.toUpperCase());
        }

        // Populate the grid
        const grid = document.getElementById('deckGrid');
        files.forEach(file => {
            const card = document.createElement('a');
            card.href = file;
            card.className = 'deck-card';
            card.innerHTML = `
                <div class="deck-name">${cleanFileName(file)}</div>
                <div class="deck-file">${file}</div>
                <div class="button-text">Open Deck →</div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
