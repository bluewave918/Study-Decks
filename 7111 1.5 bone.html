    <script>
        function shuffleQuestions(questionsArray) {
            return questionsArray.map(q => {
                const options = [...q.options];
                const correctAnswer = options[q.correct];

                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }

                const newCorrect = options.indexOf(correctAnswer);

                return {
                    q: q.q,
                    options: options,
                    correct: newCorrect
                };
            });
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];

            return shuffled;

            { q: "What are Sharpey's fibers and what do they connect?", options: ["Collagen fibers within bone matrix", "Fibrous connections from periosteum to outer circumferential lamellae of compact bone", "Proteins linking osteocytes to lacunar walls", "Blood vessel walls to bone matrix"], correct: 1 },
            { q: "How do osteoblasts become osteocytes?", options: ["They undergo apoptosis", "They become embedded in the bone matrix that they have produced", "They fuse together", "They are phagocytosed by immune cells"], correct: 1 },
            { q: "What is bone remodeling and why is it important?", options: ["Formation of new bone tissue only", "The continuous process of osteoclast-mediated resorption followed by osteoblast-mediated formation, allowing repair and adaptation", "Resorption only", "Only occurs during development"], correct: 1 },
            { q: "What structural organization allows compact bone to be both strong and relatively light?", options: ["Solid mineral structure", "Osteons arranged in parallel providing strength with internal canal systems for vasculature and reduced weight", "Only cortical bone without inner spaces", "No organized structure"], correct: 1 },
            { q: "How does the composition of bone compare to dentin in terms of mineral content?", options: ["Bone has more mineral than dentin", "Similar mineral composition with hydroxyapatite on organic matrix", "Dentin has no mineral", "Dentin is purely organic"], correct: 1 },
            { q: "What is the significance of bone being a reservoir for growth factors?", options: ["Growth factors are inactive in bone", "Sequestered growth factors can be released during resorption and remodeling to promote healing and adaptation", "Growth factors are only found in blood", "This has no physiological importance"], correct: 1 },
            { q: "How do inflammatory cytokines affect bone homeostasis?", options: ["They have no effect", "They activate osteoclasts and promote bone resorption, particularly IL-1β and TNF-α", "They inhibit all bone remodeling", "They only affect osteoblasts"], correct: 1 },
            { q: "What is the role of vitamin D in calcium homeostasis and bone?", options: ["It has no role", "Activated by PTH, it increases intestinal calcium absorption and promotes osteoblast differentiation", "It only affects kidney function", "It inhibits osteoclast activity"], correct: 1 },
            { q: "How is cancellous bone organized to maximize strength with minimal weight?", options: ["Solid throughout", "Trabecular lattice follows stress lines, providing support where needed with marrow-filled spaces elsewhere", "Random arrangement", "Only found in small quantities"], correct: 1 },
            { q: "What is the relationship between bone density and mechanical strength?", options: ["Not related", "Higher density generally increases strength, but trabecular organization and quality of mineralization are also critical", "Density alone determines strength completely", "Strength is independent of structure"], correct: 1 },
            { q: "How does ageing affect bone cells and remodeling?", options: ["No changes occur", "Osteoblast activity decreases, osteoclast activity remains high, leading to net bone loss", "Only osteoclasts are affected", "Bone is not affected by age"], correct: 1 },
            { q: "What is the role of growth factors sequestered in bone matrix?", options: ["They are permanently inactive", "Released during resorption to signal osteoblasts, promote angiogenesis, and regulate bone formation", "They prevent bone remodeling", "They are only functional in blood"], correct: 1 },
            { q: "How do canaliculi relate to osteocyte function?", options: ["They are lacunae", "Small channels connecting lacunae, allowing osteocytes to communicate and sense mechanical signals", "They contain blood vessels", "They are sites of bone resorption"], correct: 1 },
            { q: "What determines whether mesenchymal cells differentiate into osteoblasts versus chondrocytes?", options: ["Random selection", "Signaling environment, local growth factors (BMP, FGF), and mechanical factors", "Age of the embryo only", "Location in the body alone"], correct: 1 },
            { q: "How do bisphosphonates work therapeutically in bone disease?", options: ["They promote osteoclast activity", "They inhibit osteoclast activity and resorption, used to prevent bone loss in osteoporosis", "They stimulate osteoblasts only", "They have no mechanism"], correct: 1 },
            { q: "What is the origin of bone marrow cells and their relationship to bone?", options: ["Bone marrow is only in cancellous bone", "Mesenchymal progenitors in marrow can differentiate into osteoblasts or other connective tissues", "Hematopoietic cells originate from bone", "Marrow and bone are unrelated"], correct: 1 }
        ];

        let questionsOrdered = shuffleQuestions(questionsBase);
        let questionsShuffled = shuffleQuestions(shuffleArray(questionsBase));
        let questions = [...questionsOrdered];
        let currentMode = 'ordered';

        let currentQ = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let answered = new Array(questions.length).fill(false);
        let userAnswers = new Array(questions.length).fill(-1);
        let originalQuestionsLength = questions.length;
        let retryQueue = [];

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnOrdered').classList.toggle('active', mode === 'ordered');
            document.getElementById('btnShuffled').classList.toggle('active', mode === 'shuffled');

            if (mode === 'ordered') {
                document.getElementById('modeInfo').innerHTML = '📖 LEARNING MODE: Questions in original order (content builds logically)';
                questions = [...questionsOrdered];
            } else {
                document.getElementById('modeInfo').innerHTML = '🔀 TESTING MODE: Questions randomized (check understanding independently)';
                questions = [...questionsShuffled];
            }

            resetQuiz();
        }

        function displayQuestion() {
            const q = questions[currentQ];
            const isRetry = currentQ >= originalQuestionsLength;

            document.getElementById('qNumber').textContent = `Question ${currentQ + 1}${isRetry ? ' 🔄' : ''}`;
            document.getElementById('questionText').textContent = q.q;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
                div.onclick = () => selectAnswer(index);
                container.appendChild(div);
            });

            document.getElementById('progressText').textContent = `Question ${currentQ + 1} of ${questions.length}`;
            const progress = ((currentQ + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            updateButtons();
            updateStats();

            if (answered[currentQ]) {
                showAnswer();
            } else {
                document.getElementById('feedback').classList.remove('show');
            }
        }

        function selectAnswer(index) {
            if (answered[currentQ]) return;

            userAnswers[currentQ] = index;
            answered[currentQ] = true;

            const q = questions[currentQ];
            const options = document.querySelectorAll('.option');

            if (index === q.correct) {
                correctCount++;
                options[index].classList.add('correct');
                showFeedback(true, "✓ Correct!");
            } else {
                incorrectCount++;
                options[index].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                showFeedback(false, `✗ Incorrect`);
                retryQueue.push(currentQ);
            }

            options.forEach(opt => opt.classList.add('disabled'));
            updateButtons();
            updateStats();
        }

        function showFeedback(isCorrect, message) {
            const fb = document.getElementById('feedback');
            fb.classList.add('show');
            fb.classList.toggle('correct', isCorrect);
            fb.classList.toggle('incorrect', !isCorrect);
            fb.innerHTML = `<div>${message}</div>`;
        }

        function showAnswer() {
            const q = questions[currentQ];
            const userAns = userAnswers[currentQ];
            const options = document.querySelectorAll('.option');

            options.forEach(opt => opt.classList.add('disabled'));

            if (userAns === q.correct) {
                options[userAns].classList.add('correct');
                showFeedback(true, "✓ Correct!");
            } else {
                options[userAns].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                showFeedback(false, `✗ Incorrect`);
            }
        }

        function nextQuestion() {
            if (currentQ < questions.length - 1) {
                currentQ++;
                displayQuestion();
            } else if (retryQueue.length > 0) {
                const nextRetryIndex = retryQueue.shift();
                questions.push(questions[nextRetryIndex]);
                answered.push(false);
                userAnswers.push(-1);
                currentQ++;
                displayQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQ > 0) {
                currentQ--;
                displayQuestion();
            }
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentQ === 0;
            document.getElementById('nextBtn').disabled = !answered[currentQ];
            document.getElementById('nextBtn').textContent = (currentQ === questions.length - 1 && answered[currentQ]) ? 'Results →' : 'Next →';
        }

        function updateStats() {
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('incorrect').textContent = incorrectCount;
            const perc = (correctCount + incorrectCount) > 0 ? Math.round((correctCount / (correctCount + incorrectCount)) * 100) : 0;
            document.getElementById('percentage').textContent = perc;
        }

        function showResults() {
            const percentage = Math.round((correctCount / questions.length) * 100);
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('resultScreen').classList.add('show');
            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalIncorrect').textContent = incorrectCount;

            let message = '';
            if (percentage === 100) message = '🌟 Perfect!';
            else if (percentage >= 90) message = '🎉 Excellent!';
            else if (percentage >= 80) message = '👍 Great!';
            else if (percentage >= 70) message = '📚 Good effort';
            else if (percentage >= 60) message = '💪 Keep studying';
            else message = '📖 Review more';

            document.getElementById('resultMessage').textContent = message;
        }

        function resetQuiz() {
            currentQ = 0;
            correctCount = 0;
            incorrectCount = 0;
            retryQueue = [];
            answered = new Array(originalQuestionsLength).fill(false);
            userAnswers = new Array(originalQuestionsLength).fill(-1);

            // Reset questions array based on current mode
            if (currentMode === 'ordered') {
                questions = [...questionsOrdered];
            } else {
                questions = [...questionsShuffled];
            }

            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('resultScreen').classList.remove('show');
            displayQuestion();
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (document.getElementById('resultScreen').classList.contains('show')) {
                if (/[0-9]/.test(key)) resetQuiz();
                return;
            }

            if (answered[currentQ]) {
                if (/[0-9]/.test(key)) nextQuestion();
                return;
            }

            if (key === '1' || key === '2' || key === '3' || key === '4') {
                selectAnswer(parseInt(key) - 1);
            }
        });

        displayQuestion();
    </script>
</body>
</html>
