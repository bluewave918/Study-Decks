        function shuffleQuestions(questionsArray) {
            return questionsArray.map(q => {
                const options = [...q.options];
                const correctAnswer = options[q.correct];

                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }

                const newCorrect = options.indexOf(correctAnswer);

                return {
                    q: q.q,
                    options: options,
                    correct: newCorrect
                };
            });
        }

            { q: "Is collagen the most abundant protein in the body?", options: ["No, keratin is most abundant", "Yes, collagen is the most abundant protein", "Actin is more abundant", "Myosin is most abundant"], correct: 1 },
            { q: "What amino acids are collagen particularly rich in?", options: ["Leucine and isoleucine", "Proline and lysine (for hydrogen bonding in triple helix)", "Aspartate and glutamate", "Serine and threonine"], correct: 1 },
            { q: "What is the major synthetic product of mesenchyme-derived cells?", options: ["Elastin primarily", "Collagen as a key extracellular matrix component", "Hyaluronic acid only", "Proteoglycans exclusively"], correct: 1 },
            { q: "What is the primary collagen type in dentin?", options: ["Type II collagen", "Type III collagen", "Type I collagen (providing structure and strength)", "Type IV collagen"], correct: 2 },
            { q: "What collagen types are found in dental pulp?", options: ["Type II and IV", "Type I and III collagen", "Type IV only", "Type V and VI"], correct: 1 },
            { q: "What is the primary collagen type in cartilage?", options: ["Type I collagen", "Type III collagen", "Type II collagen", "Type IV collagen"], correct: 2 },
            { q: "What type of collagen is found in the basement membrane?", options: ["Type I", "Type II", "Type III", "Type IV"], correct: 3 },
            { q: "What is the characteristic structure formed by Type IV collagen in the basement membrane?", options: ["Parallel fibrils", "A 'chicken-wire' meshwork", "Random fibers", "A triple helix only"], correct: 1 },
            { q: "What produces the characteristic banded appearance of collagen fibrils?", options: ["Enzymatic modification", "The 1/4 stagger of microfibrils that creates a banded structure", "Mineral deposition", "Cross-linking between molecules"], correct: 1 },
            { q: "Why is the staggered organization of collagen important in bone and dentin?", options: ["For protein folding", "Creates gap regions where mineral can be deposited", "For enzyme binding", "For cell attachment only"], correct: 1 },
            { q: "What vitamin is essential for stable collagen assembly?", options: ["Vitamin A", "Vitamin B12", "Vitamin C (which leads to scurvy if deficient)", "Vitamin D"], correct: 2 },
            { q: "What happens to collagen when vitamin C is deficient?", options: ["Excessive collagen production", "Proper hydroxylation is impaired, leading to less stability", "Collagen becomes stronger", "No effect on collagen"], correct: 1 },
            { q: "What cell primarily produces elastin?", options: ["Adipocytes", "Chondrocytes", "Fibroblasts in connective tissue", "Osteocytes"], correct: 2 },
            { q: "What forms the scaffold for elastin fiber assembly?", options: ["Collagen triple helix", "Fibrillin-1 and fibrillin-2 form a microfibril scaffold", "Proteoglycans", "Glycoproteins alone"], correct: 1 },
            { q: "What is the basic structure of a mature elastin fiber?", options: ["Collagen-based core", "An elastin core supported by a glycoprotein microfibril scaffold", "Purely elastin without support", "Random protein aggregates"], correct: 1 },
            { q: "What is the key molecular defect in Marfan syndrome?", options: ["Collagen mutation", "Mutation in fibrillin-1 (FBN1)", "Elastin deficiency", "Integrin malfunction"], correct: 1 },
            { q: "What is the characteristic structure of an adipocyte?", options: ["Multiple small lipid droplets", "A single large lipid droplet surrounded by thin rim of cytoplasm", "Extensive rough endoplasmic reticulum", "Large nucleus occupying most of cell"], correct: 1 },
            { q: "Where is the nucleus located in a typical adipocyte?", options: ["Centrally located", "Flattened nucleus pushed toward periphery by lipid droplet", "On the cell surface", "Multiple nuclei scattered throughout"], correct: 1 },
            { q: "What surrounds each adipocyte?", options: ["Collagen fibers only", "Basal lamina", "No surrounding structure", "Epithelial cells"], correct: 1 },
            { q: "What is connective tissue ground substance?", options: ["Mineral deposits in bone", "Gel-like component of ECM made of proteoglycans and glycoproteins", "Adipose tissue", "Collagen fibrils"], correct: 1 },
            { q: "What is the main function of ground substance?", options: ["Provide tensile strength", "Sequester fluid and give compressive strength to tissues (cartilage)", "Generate contractile forces", "Support blood vessels only"], correct: 1 },
            { q: "What are proteoglycans composed of?", options: ["Proteins with lipid side chains", "Protein core with glycosaminoglycan chains (GAGs)", "Only carbohydrates", "Collagen and elastin"], correct: 1 },
            { q: "What is a characteristic behavior of proteoglycans in ground substance?", options: ["Hydrophobic and repel water", "Relatively strong negative charge and are hydrophilic", "Contractile proteins", "Provide mechanical strength only"], correct: 1 },
            { q: "What is the main function of proteoglycans in ground substance?", options: ["Provide tensile strength", "Serve to sequester growth factors in ECM and facilitate water storage", "Form the collagen backbone", "Generate electrical signals"], correct: 1 },
            { q: "What are glycoproteins and where are they found?", options: ["Proteins with lipid attachments", "Proteins with carbohydrate side chains attached, found everywhere including ground substance", "Only structural proteins", "Only in the nucleus"], correct: 1 },
            { q: "How do proteoglycans compare to glycoproteins in terms of carbohydrate content?", options: ["Same amount of carbohydrate", "Proteoglycans have larger carbohydrate component than glycoproteins", "Glycoproteins have more carbohydrate", "Proteoglycans have no carbohydrate"], correct: 1 },
            { q: "What is the most abundant connective tissue type?", options: ["Dense irregular connective tissue", "Dense regular connective tissue", "Loose connective tissue", "Specialized connective tissue"], correct: 2 },
            { q: "How does loose connective tissue differ from dense connective tissue?", options: ["More fibers and fewer cells in loose", "More cells and ground substance, fewer fibers in loose", "Denser ground substance in loose", "No structural difference"], correct: 1 },
            { q: "What is the general function of loose connective tissue?", options: ["Only support", "Provides support and form, but less structural strength than dense connective tissue", "Only storage", "Only immune defense"], correct: 1 },
            { q: "How does dense irregular connective tissue differ from loose connective tissue?", options: ["Fewer cells and less ground substance", "Has more fibers, fewer cells, and less ground substance", "More ground substance and fewer fibers", "No structural differences"], correct: 1 },
            { q: "How are the fibers arranged in dense irregular connective tissue?", options: ["Parallel to each other", "Randomly in multiple directions", "Perpendicular layers", "Concentric rings"], correct: 1 },
            { q: "What is the primary function of dense irregular connective tissue?", options: ["Directional support", "Multidirectional structural support and resists forces from multiple directions", "Only shock absorption", "Only fluid storage"], correct: 1 },
            { q: "Where is dense irregular connective tissue commonly found?", options: ["Only in tendons", "Deep dermis, organ capsules, and intestinal submucosa", "Only in ligaments", "Only around bones"], correct: 1 },
            { q: "How are fibers arranged in dense regular connective tissue?", options: ["Random directions", "In the same direction (parallel alignment)", "Perpendicular layers only", "Concentric patterns"], correct: 1 },
            { q: "What is the function of dense regular connective tissue?", options: ["Multidirectional resistance", "Unidirectional structure and resistance", "Fluid absorption", "Energy storage"], correct: 1 },
            { q: "Where is dense regular connective tissue commonly located?", options: ["In the dermis randomly", "In tendons and ligaments", "In organ capsules", "In the submucosa"], correct: 1 }
        ];

        let questionsOrdered = shuffleQuestions(questionsBase);
        let questionsShuffled = shuffleQuestions(shuffleArray(questionsBase));
        let questions = [...questionsOrdered];
        let currentMode = 'ordered';

        let currentQ = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let answered = new Array(questions.length).fill(false);
        let userAnswers = new Array(questions.length).fill(-1);
        let originalQuestionsLength = questions.length;
        let retryQueue = [];

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnOrdered').classList.toggle('active', mode === 'ordered');
            document.getElementById('btnShuffled').classList.toggle('active', mode === 'shuffled');

            if (mode === 'ordered') {
                document.getElementById('modeInfo').innerHTML = '📖 LEARNING MODE: Questions in original order (content builds logically)';
                questions = [...questionsOrdered];
            } else {
                document.getElementById('modeInfo').innerHTML = '🔀 TESTING MODE: Questions randomized (check understanding independently)';
                questions = [...questionsShuffled];
            }

            resetQuiz();
        }

        function displayQuestion() {
            const q = questions[currentQ];
            const isRetry = currentQ >= originalQuestionsLength;

            document.getElementById('qNumber').textContent = `Question ${currentQ + 1}${isRetry ? ' 🔄' : ''}`;
            document.getElementById('questionText').textContent = q.q;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
                div.onclick = () => selectAnswer(index);
                container.appendChild(div);
            });

            document.getElementById('progressText').textContent = `Question ${currentQ + 1} of ${questions.length}`;
            const progress = ((currentQ + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            updateButtons();
            updateStats();

            if (answered[currentQ]) {
                showAnswer();
            } else {
                document.getElementById('feedback').classList.remove('show');
            }
        }

        function selectAnswer(index) {
            if (answered[currentQ]) return;

            userAnswers[currentQ] = index;
            answered[currentQ] = true;

            const q = questions[currentQ];
            const options = document.querySelectorAll('.option');

            if (index === q.correct) {
                correctCount++;
                options[index].classList.add('correct');
                showFeedback(true, "✓ Correct!");
            } else {
                incorrectCount++;
                options[index].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                showFeedback(false, `✗ Incorrect`);
                retryQueue.push(currentQ);
            }

            options.forEach(opt => opt.classList.add('disabled'));
            updateButtons();
            updateStats();
        }

        function showFeedback(isCorrect, message) {
            const fb = document.getElementById('feedback');
            fb.classList.add('show');
            fb.classList.toggle('correct', isCorrect);
            fb.classList.toggle('incorrect', !isCorrect);
            fb.innerHTML = `<div>${message}</div>`;
        }

        function showAnswer() {
            const q = questions[currentQ];
            const userAns = userAnswers[currentQ];
            const options = document.querySelectorAll('.option');

            options.forEach(opt => opt.classList.add('disabled'));

            if (userAns === q.correct) {
                options[userAns].classList.add('correct');
                showFeedback(true, "✓ Correct!");
            } else {
                options[userAns].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                showFeedback(false, `✗ Incorrect`);
            }
        }

        function nextQuestion() {
            if (currentQ < questions.length - 1) {
                currentQ++;
                displayQuestion();
            } else if (retryQueue.length > 0) {
                const nextRetryIndex = retryQueue.shift();
                questions.push(questions[nextRetryIndex]);
                answered.push(false);
                userAnswers.push(-1);
                currentQ++;
                displayQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQ > 0) {
                currentQ--;
                displayQuestion();
            }
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentQ === 0;
            document.getElementById('nextBtn').disabled = !answered[currentQ];
            document.getElementById('nextBtn').textContent = (currentQ === questions.length - 1 && answered[currentQ]) ? 'Results →' : 'Next →';
        }

        function updateStats() {
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('incorrect').textContent = incorrectCount;
            const perc = (correctCount + incorrectCount) > 0 ? Math.round((correctCount / (correctCount + incorrectCount)) * 100) : 0;
            document.getElementById('percentage').textContent = perc;
        }

        function showResults() {
            const percentage = Math.round((correctCount / questions.length) * 100);
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('resultScreen').classList.add('show');
            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalIncorrect').textContent = incorrectCount;

            let message = '';
            if (percentage === 100) message = '🌟 Perfect!';
            else if (percentage >= 90) message = '🎉 Excellent!';
            else if (percentage >= 80) message = '👍 Great!';
            else if (percentage >= 70) message = '📚 Good effort';
            else if (percentage >= 60) message = '💪 Keep studying';
            else message = '📖 Review more';

            document.getElementById('resultMessage').textContent = message;
        }

        function resetQuiz() {
            currentQ = 0;
            correctCount = 0;
            incorrectCount = 0;
            retryQueue = [];
            answered = new Array(originalQuestionsLength).fill(false);
            userAnswers = new Array(originalQuestionsLength).fill(-1);

            // Reset questions array based on current mode
            if (currentMode === 'ordered') {
                questions = [...questionsOrdered];
            } else {
                questions = [...questionsShuffled];
            }

            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('resultScreen').classList.remove('show');
            displayQuestion();
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (document.getElementById('resultScreen').classList.contains('show')) {
                if (/[0-9]/.test(key)) resetQuiz();
                return;
            }

            if (answered[currentQ]) {
                if (/[0-9]/.test(key)) nextQuestion();
                return;
            }

            if (key === '1' || key === '2' || key === '3' || key === '4') {
                selectAnswer(parseInt(key) - 1);
            }
        });

        displayQuestion();
    </script>
