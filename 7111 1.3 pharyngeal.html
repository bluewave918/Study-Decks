    <script>
        function shuffleQuestions(questionsArray) {
            return questionsArray.map(q => {
                const options = [...q.options];
                const correctAnswer = options[q.correct];

                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }

                const newCorrect = options.indexOf(correctAnswer);

                return {
                    q: q.q,
                    options: options,
                    correct: newCorrect
                };
            });
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

            { q: "What is the embryological reason why cleft palate occurs along the midline?", options: ["Failure of pharyngeal arch muscle development", "The area where the maxillary processes and medial nasal processes meet and fuse; improper fusion of arch derivatives", "Defective endodermal cell migration", "Excessive neural crest cell apoptosis"], correct: 1 },
            { q: "How do different neural crest cell populations within rhombomeres produce different arch structures?", options: ["All neural crest cells are identical regardless of origin", "Different rhombomeric origins and different Hox gene expression patterns lead to different cell identities", "The surrounding mesoderm determines all neural crest cell fate", "Neural crest cells randomly differentiate into available arch structures"], correct: 1 },
            { q: "What is the relationship between Meckel's cartilage position and mandibular nerve anatomy?", options: ["Meckel's cartilage develops around the maxillary nerve", "The inferior alveolar nerve (from CN V-3) branches around Meckel's cartilage, and bone forms around this nerve pathway", "Meckel's cartilage contains the inferior alveolar nerve", "The nerve pathway is independent of Meckel's cartilage position"], correct: 1 },
            { q: "How do the bilateral arch components eventually create a unified structure like the mandible?", options: ["The mandible forms as a single midline structure from the start", "Bilateral components develop, fuse along the midline, and are integrated through growth and remodeling", "Only the right-side arch component ossifies fully", "The mandible forms through endodermal folding"], correct: 1 },
            { q: "What would be the expected result of complete neural crest cell absence from pharyngeal arches?", options: ["Only skeletal structures would be missing", "Absence of ectomesenchymal-derived structures like dentin, pulp, and connective tissues", "Only muscle structures would fail to develop", "The arches would be entirely absent"], correct: 1 },
            { q: "How does the segmental organization of rhombomeres relate to cranial nerve organization?", options: ["Cranial nerves are organized randomly throughout the pharynx", "Rhombomeric segmentation creates neural crest populations that form arch-associated nerves", "Each rhombomere contains all cranial nerve components", "Cranial nerves develop independently of rhombomeric organization"], correct: 1 },
            { q: "What is the significance of the 2 Meckel's cartilages being connected by mesenchymal tissue?", options: ["They remain separate throughout development", "They form a connected bilateral structure that guides mandibular development before ossifying laterally", "They eventually fuse into a single cartilage", "They have no developmental significance"], correct: 1 },
            { q: "How does improper Hox gene regulation lead to congenital arch abnormalities?", options: ["It only affects muscles derived from arches", "Altered Hox expression changes anterior-posterior identity, leading to transformation of arch structures and craniofacial abnormalities", "It primarily affects endodermal derivatives", "It causes general developmental delay rather than specific arch abnormalities"], correct: 1 }
        ];

        let questionsOrdered = shuffleQuestions(questionsBase);
        let questionsShuffled = shuffleQuestions(shuffleArray(questionsBase));
        let questions = [...questionsOrdered];
        let currentMode = 'ordered';

        let currentQ = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let answered = new Array(questions.length).fill(false);
        let userAnswers = new Array(questions.length).fill(-1);
        let originalQuestionsLength = questions.length;
        let retryQueue = [];

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnOrdered').classList.toggle('active', mode === 'ordered');
            document.getElementById('btnShuffled').classList.toggle('active', mode === 'shuffled');

            if (mode === 'ordered') {
                document.getElementById('modeInfo').innerHTML = '📖 LEARNING MODE: Questions in original order (content builds logically)';
                questions = [...questionsOrdered];
            } else {
                document.getElementById('modeInfo').innerHTML = '🔀 TESTING MODE: Questions randomized (check understanding independently)';
                questions = [...questionsShuffled];
            }

            resetQuiz();
        }

        function displayQuestion() {
            const q = questions[currentQ];
            const isRetry = currentQ >= originalQuestionsLength;

            document.getElementById('qNumber').textContent = `Question ${currentQ + 1}${isRetry ? ' 🔄' : ''}`;
            document.getElementById('questionText').textContent = q.q;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
                div.onclick = () => selectAnswer(index);
                container.appendChild(div);
            });

            document.getElementById('progressText').textContent = `Question ${currentQ + 1} of ${questions.length}`;
            const progress = ((currentQ + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            updateButtons();
            updateStats();

            if (answered[currentQ]) {
                showAnswer();
            } else {
                document.getElementById('feedback').classList.remove('show');
            }
        }

        function selectAnswer(index) {
            if (answered[currentQ]) return;

            userAnswers[currentQ] = index;
            answered[currentQ] = true;

            const q = questions[currentQ];
            const options = document.querySelectorAll('.option');

            if (index === q.correct) {
                correctCount++;
                options[index].classList.add('correct');
                showFeedback(true, "✓ Correct!");
            } else {
                incorrectCount++;
                options[index].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                showFeedback(false, `✗ Incorrect`);
                retryQueue.push(currentQ);
            }

            options.forEach(opt => opt.classList.add('disabled'));
            updateButtons();
            updateStats();
        }

        function showFeedback(isCorrect, message) {
            const fb = document.getElementById('feedback');
            fb.classList.add('show');
            fb.classList.toggle('correct', isCorrect);
            fb.classList.toggle('incorrect', !isCorrect);
            fb.innerHTML = `<div>${message}</div>`;
        }

        function showAnswer() {
            const q = questions[currentQ];
            const userAns = userAnswers[currentQ];
            const options = document.querySelectorAll('.option');

            options.forEach(opt => opt.classList.add('disabled'));

            if (userAns === q.correct) {
                options[userAns].classList.add('correct');
                showFeedback(true, "✓ Correct!");
            } else {
                options[userAns].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                showFeedback(false, `✗ Incorrect`);
            }
        }

        function nextQuestion() {
            if (currentQ < questions.length - 1) {
                currentQ++;
                displayQuestion();
            } else if (retryQueue.length > 0) {
                const nextRetryIndex = retryQueue.shift();
                questions.push(questions[nextRetryIndex]);
                answered.push(false);
                userAnswers.push(-1);
                currentQ++;
                displayQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQ > 0) {
                currentQ--;
                displayQuestion();
            }
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentQ === 0;
            document.getElementById('nextBtn').disabled = !answered[currentQ];
            document.getElementById('nextBtn').textContent = (currentQ === questions.length - 1 && answered[currentQ]) ? 'Results →' : 'Next →';
        }

        function updateStats() {
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('incorrect').textContent = incorrectCount;
            const perc = (correctCount + incorrectCount) > 0 ? Math.round((correctCount / (correctCount + incorrectCount)) * 100) : 0;
            document.getElementById('percentage').textContent = perc;
        }

        function showResults() {
            const percentage = Math.round((correctCount / questions.length) * 100);
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('resultScreen').classList.add('show');
            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalIncorrect').textContent = incorrectCount;

            let message = '';
            if (percentage === 100) message = '🌟 Perfect!';
            else if (percentage >= 90) message = '🎉 Excellent!';
            else if (percentage >= 80) message = '👍 Great!';
            else if (percentage >= 70) message = '📚 Good effort';
            else if (percentage >= 60) message = '💪 Keep studying';
            else message = '📖 Review more';

            document.getElementById('resultMessage').textContent = message;
        }

        function resetQuiz() {
            currentQ = 0;
            correctCount = 0;
            incorrectCount = 0;
            retryQueue = [];
            answered = new Array(originalQuestionsLength).fill(false);
            userAnswers = new Array(originalQuestionsLength).fill(-1);

            // Reset questions array based on current mode
            if (currentMode === 'ordered') {
                questions = [...questionsOrdered];
            } else {
                questions = [...questionsShuffled];
            }

            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('resultScreen').classList.remove('show');
            displayQuestion();
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (document.getElementById('resultScreen').classList.contains('show')) {
                if (/[0-9]/.test(key)) resetQuiz();
                return;
            }

            if (answered[currentQ]) {
                if (/[0-9]/.test(key)) nextQuestion();
                return;
            }

            if (key === '1' || key === '2' || key === '3' || key === '4') {
                selectAnswer(parseInt(key) - 1);
            }
        });

        displayQuestion();
    </script>
</body>
</html>
