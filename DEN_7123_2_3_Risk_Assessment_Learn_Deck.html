hecked according to the lecture?", "opts": ["Only when symptoms are reported", "Only when medication is changed", "At every appointment", "At the annual comprehensive exam"], "correct": 2, "why": "Treatment with medication does not eliminate the need to measure BP each appointment."}, {"topic": "History and systemic risk", "q": "Which management considerations were specifically taught for hypertensive dental patients?", "opts": ["Avoid all local anesthetic and position the chair rapidly", "Provide only surgical treatment without referral", "Use unrestricted epinephrine and skip BP monitoring", "Reduce anxiety, avoid rapid chair-position changes, and use moderate epinephrine-containing local anesthetic when appropriate"], "correct": 3, "why": "Most patients with hypertension can be treated, with stress reduction, chair-position attention, and possible medical referral."}, {"topic": "BP referral table", "q": "According to the lecture BP follow-up table, what is the recommendation for 118/76 mm Hg?", "opts": ["No physician referral necessary", "Automatic hospitalization regardless of symptoms", "Routine dental prophylaxis is the only action", "No referral and no follow-up"], "correct": 0, "why": "The table places BP at or below 120/80 in the no-referral group."}, {"topic": "BP referral table", "q": "According to the lecture BP follow-up table, what is the recommendation for 132/86 mm Hg?", "opts": ["Routine dental prophylaxis is the only action", "Encourage the patient to see a physician", "Automatic hospitalization regardless of symptoms", "No referral and no follow-up"], "correct": 1, "why": "The 120/80 to below 140/90 band prompts encouragement to see a physician."}, {"topic": "BP referral table", "q": "According to the lecture BP follow-up table, what is the recommendation for 148/94 mm Hg?", "opts": ["Routine dental prophylaxis is the only action", "No referral and no follow-up", "Encourage the patient to see a physician", "Automatic hospitalization regardless of y before extractions", "Measure BP only at initial intake", "Measure BP for every patient at every clinic session"], "correct": 3, "why": "This is the explicit clinic policy, in addition to establishing baseline BP at intake."}, {"topic": "UNLV BP policy", "q": "A patient has diastolic BP of 104 mm Hg. What is the lecture-specific student protocol?", "opts": ["Repeat at least three times with time to relax; if still at least 100, contact covering faculty before dismissal", "Only document the first reading and continue", "Give epinephrine and proceed without rechecking", "Immediately dismiss after the first reading"], "correct": 0, "why": "The UNLV slide directs repeat measurements and faculty contact if the third diastolic remains at least 100 mm Hg."}, {"topic": "UNLV BP policy", "q": "Which BP change from baseline is considered troubling in the lecture?", "opts": ["Only an increase in pulse pressure", "A change of 20% or more", "Any change of 2%", "Only a change of 50% or more"], "correct": 1, "why": "The baseline table illustrates 20% higher and lower systolic values; a low pressure risks underperfusion, high pressure hypertensive crisis."}, {"topic": "BP 20% calculation", "q": "Using the slide’s example for baseline 100/50, what are the 20%-lower and 20%-higher readings?", "opts": ["100/50 and 120/50", "120/50 and 80/50", "80/50 and 120/50", "80/50 and 100/50"], "correct": 2, "why": "The examples calculate 20% of the systolic baseline while retaining the displayed diastolic value."}, {"topic": "BP 20% calculation", "q": "Using the slide’s example for baseline 120/65, what are the 20%-lower and 20%-higher readings?", "opts": ["96/65 and 120/65", "120/65 and 144/65", "144/65 and 96/65", "96/65 and 144/65"], "correct": 3, "why": "The examples calculate 20% of the systolic baseline while retaining the displayed diastolic value."}, {"topic": "BP 20% calculation", "q": "Using the slide’s example for baseline 140/72, what are the 20%-lower and 20%-higher readings?", "o ry table."}, {"topic": "Selected procedures summary table", "q": "In the slide titled “Risk Categories for Selected Dental Procedures,” single implant placement is listed under which ORA level?", "opts": ["ORA I", "ORA IV", "ORA III", "ORA II"], "correct": 2, "why": "The selected-procedures table places single implant placement at ORA III. Note that some examples differ from the separate ORA I–V descriptions; this question explicitly tests the summary table."}, {"topic": "Selected procedures summary table", "q": "In the slide titled “Risk Categories for Selected Dental Procedures,” deep scaling and root planing is listed under which ORA level?", "opts": ["ORA II", "ORA IV", "ORA I", "ORA III"], "correct": 3, "why": "The selected-procedures table places deep scaling and root planing at ORA III. Note that some examples differ from the separate ORA I–V descriptions; this question explicitly tests the summary table."}, {"topic": "Selected procedures summary table", "q": "In the slide titled “Risk Categories for Selected Dental Procedures,” extensive surgical procedures is listed under which ORA level?", "opts": ["ORA IV", "ORA III", "ORA II", "ORA I"], "correct": 0, "why": "The selected-procedures table places extensive surgical procedures at ORA IV. Note that some examples differ from the separate ORA I–V descriptions; this question explicitly tests the summary table."}, {"topic": "Selected procedures summary table", "q": "In the slide titled “Risk Categories for Selected Dental Procedures,” multiple implant placement is listed under which ORA level?", "opts": ["ORA I", "ORA IV", "ORA III", "ORA II"], "correct": 1, "why": "The selected-procedures table places multiple implant placement at ORA IV. Note that some examples differ from the separate ORA I–V descriptions; this question explicitly tests the summary table."}, {"topic": "Selected procedures summary table", "q": "In the slide titled “Risk Categories for Selected Dental Procedures,” general anesthesia is listed u
