    <script>
        // =====================================================================
        // QUESTION DATABASE - 1.2 & 1.3 COMBINED (91 QUESTIONS)
        // =====================================================================

        const questionsBase = [
            // 1.2 INTRO TO CELL (25 QUESTIONS)
            {
                question: "Constitutive secretion is best characterized by:",
                options: [
                    "Default pathway that is clathrin-independent, requires no extracellular signal, and is continuous",
                    "A slow, energy-intensive process that requires constant ATP hydrolysis",
                    "The accumulation of proteins in secretory vesicles until triggered by calcium",
                    "A response to external hormonal signals requiring clathrin-mediated transport"
                ],
                correct: 0,
                explanation: "Constitutive secretion is the 'default' mode—cells continuously secrete proteins without waiting for signals. It's clathrin-independent and always 'on.' This contrasts with regulated secretion, which waits for a signal."
            },
            {
                question: "Regulated secretion differs from constitutive secretion in that it:",
                options: [
                    "Cannot be stopped once it begins",
                    "Occurs continuously without any external stimulus",
                    "Requires an extracellular signal and utilizes clathrin-dependent transport",
                    "Is clathrin-independent and requires no energy"
                ],
                correct: 2,
                explanation: "Regulated secretion is 'on-demand'—cells wait for a signal before secreting specific molecules. It uses clathrin-coated vesicles and is energy-dependent. This allows precise temporal and spatial control."
            },
            {
                question: "Simple passive membrane transport allows the movement of:",
                options: [
                    "Large polar molecules and proteins",
                    "Small molecules that require carrier proteins",
                    "Non-polar molecules (O₂) and uncharged polar molecules (H₂O) with no energy input",
                    "Ions against their concentration gradient"
                ],
                correct: 2,
                explanation: "Simple diffusion is passive—molecules move down their concentration gradient through the lipid bilayer without help. Only small, uncharged molecules can do this."
            },
            {
                question: "Facilitated diffusion is characterized by: (SELECT ALL THAT APPLY)",
                options: [
                    "Movement of ions and small molecules with their concentration gradient",
                    "Involvement of transport proteins",
                    "No energy requirement (molecules move passively)"
                ],
                correct: [0, 1, 2],
                explanation: "Facilitated diffusion uses channel or carrier proteins to help molecules cross, but molecules still move DOWN their gradient (passive). No ATP is used."
            },
            {
                question: "Active transport is best characterized by:",
                options: [
                    "Movement down a concentration gradient with no energy",
                    "Only used for small molecules and ions",
                    "Transport that requires concentration gradient but no ATP",
                    "Movement against the concentration gradient using ATP energy"
                ],
                correct: 3,
                explanation: "Active transport moves molecules UPHILL—against their concentration gradient using ATP. It's how cells create ionic gradients essential for signaling and muscle contraction."
            },
            {
                question: "The nucleus is best described as:",
                options: [
                    "A temporary storage compartment for lipids",
                    "The control center of the cell and primary site of RNA synthesis",
                    "Only involved in cell division and not in daily function",
                    "A compartment where proteins are synthesized"
                ],
                correct: 1,
                explanation: "The nucleus is the command center—it contains DNA and is where transcription occurs. It controls gene expression and regulates cell division."
            },
            {
                question: "The nuclear envelope is separated from the cytoplasm by:",
                options: [
                    "A protein barrier that is impermeable to all molecules",
                    "A mesh of intermediate filaments",
                    "A single lipid bilayer",
                    "A nuclear membrane consisting of two separate bilayers (double membrane)"
                ],
                correct: 3,
                explanation: "The nuclear envelope is a double membrane with a perinuclear space between them. The outer membrane is continuous with the ER."
            },
            {
                question: "The outer membrane of the nuclear envelope is notable because:",
                options: [
                    "It forms a solid barrier",
                    "It is impermeable to all substances",
                    "It is continuous with the ER, and the space between nuclear membranes is continuous with the ER lumen",
                    "It is the site where ribosomes attach"
                ],
                correct: 2,
                explanation: "The outer nuclear membrane is part of the ER system. This continuity allows proteins synthesized on rough ER to access the perinuclear space and eventually the nucleus."
            },
            {
                question: "The nucleolus is best described as:",
                options: [
                    "A membrane-bound organelle that separates from the nucleus during cell division",
                    "A non-membrane-bound structure composed of proteins and nucleic acids where rRNA is transcribed and assembled",
                    "The site where mRNA is synthesized",
                    "A temporary storage site for amino acids"
                ],
                correct: 1,
                explanation: "The nucleolus is INSIDE the nucleus but NOT membrane-bound. It's a 'factory' for ribosomal components—rRNA is transcribed and ribosomal subunits are assembled here."
            },
            {
                question: "Ribosomes are characterized by all of the following EXCEPT:",
                options: [
                    "Small, bipartite, nonmembranous organelles",
                    "Composed of both protein and ribosomal RNA",
                    "Enclosed within a phospholipid membrane",
                    "Sites of protein synthesis"
                ],
                correct: 2,
                explanation: "Ribosomes are NOT membrane-bound. This is a key distinction from true organelles."
            },
            {
                question: "The eukaryotic ribosome consists of:",
                options: [
                    "Three subunits of roughly equal size",
                    "A large subunit (60S) and a small subunit (40S)",
                    "A single unified structure with no distinct subunits",
                    "One large subunit and one small subunit, both the same size"
                ],
                correct: 1,
                explanation: "Eukaryotic ribosomes (80S total) are composed of a 60S large subunit and 40S small subunit, making them larger and more complex than prokaryotic ribosomes."
            },
            {
                question: "Ribosomes can be found in two distinct configurations: (SELECT ALL THAT APPLY)",
                options: [
                    "Free in the cytosol where they translate mRNA",
                    "Attached to rough ER where they synthesize proteins destined for the ER lumen or secretion",
                    "Embedded in the inner mitochondrial membrane"
                ],
                correct: [0, 1],
                explanation: "Ribosomes are dynamic—they switch between free (cytoplasmic proteins) and ER-bound (secretory/membrane proteins). Mitochondria have their own 70S ribosomes."
            },
            {
                question: "The endoplasmic reticulum is best described as:",
                options: [
                    "A single continuous membrane folded into a sphere",
                    "A storage compartment for glucose and nutrients",
                    "A network of tubular and flat vesicular structures where proteins and lipids are synthesized",
                    "Only found in plant cells"
                ],
                correct: 2,
                explanation: "The ER is a massive, interconnected network of membranes occupying ~5-10% of cell volume. It's continuous with the nuclear envelope and serves multiple functions."
            },
            {
                question: "Rough ER is characterized by: (SELECT ALL THAT APPLY)",
                options: [
                    "Presence of attached ribosomes",
                    "Site of protein synthesis and initial protein modification",
                    "Involvement in protein folding, trafficking, and quality control"
                ],
                correct: [0, 1, 2],
                explanation: "Rough ER is 'rough' because of its ribosome-studded surface. It's a protein factory with extensive quality control machinery."
            },
            {
                question: "Smooth ER differs from rough ER in that it:",
                options: [
                    "Contains ribosomes and synthesizes proteins",
                    "Lacks ribosomes and is the site for lipid synthesis, detoxification, and calcium storage",
                    "Only exists in specialized cell types",
                    "Has no role in cellular metabolism"
                ],
                correct: 1,
                explanation: "Smooth ER lacks ribosomes and specializes in: lipid synthesis, drug detoxification, and calcium storage (especially in muscle)."
            },
            {
                question: "The Signal Recognition Particle (SRP) is best described as:",
                options: [
                    "An enzyme that synthesizes proteins",
                    "A ribonucleoprotein that recognizes signal sequences and targets proteins for translocation into the ER",
                    "A lipid that marks proteins for secretion",
                    "A transport channel in the ER membrane"
                ],
                correct: 1,
                explanation: "SRP recognizes the signal sequence on nascent proteins and directs the ribosome to the ER membrane, enabling proper protein entry and synthesis."
            },
            {
                question: "Ribophorins I and II function to:",
                options: [
                    "Synthesize ribosomal proteins",
                    "Help nascent proteins enter the ER through translocon pores during translocation",
                    "Degrade misfolded proteins",
                    "Transport proteins across the Golgi"
                ],
                correct: 1,
                explanation: "Ribophorins are integral ER membrane proteins that position the ribosome and facilitate protein entry through the translocon."
            },
            {
                question: "The Golgi apparatus functions primarily to:",
                options: [
                    "Synthesize new proteins and lipids",
                    "Modify, sort, and package proteins and lipids from the rough ER",
                    "Store calcium and detoxify drugs",
                    "Synthesize ATP and energy for the cell"
                ],
                correct: 1,
                explanation: "The Golgi is a processing plant—it modifies proteins (adds sugars, phosphates), sorts them by destination, and packages them into vesicles."
            },
            {
                question: "The cis network of the Golgi:",
                options: [
                    "Faces the cell membrane",
                    "Faces the rough ER and receives vesicles from it",
                    "Is where most protein modification occurs",
                    "Is where secretory vesicles bud off"
                ],
                correct: 1,
                explanation: "The Golgi has polarity: cis (entry) faces the ER; trans (exit) faces the plasma membrane. This ensures one-way traffic through the Golgi."
            },
            {
                question: "The trans Golgi network (TGN):",
                options: [
                    "Receives vesicles directly from the ER",
                    "Is the entry point for all incoming proteins",
                    "Faces the cell membrane and is where sorting and packaging into secretory vesicles occur",
                    "Is the site of primary glycosylation modifications"
                ],
                correct: 2,
                explanation: "The TGN is the final 'sorting station'—proteins are directed to their destinations and packaged into appropriate vesicles."
            },
            {
                question: "The Golgi apparatus is functionally at the intersection of:",
                options: [
                    "Only the secretory pathway",
                    "Secretory, lysosomal, and endocytotic pathways",
                    "Only the endocytotic pathway",
                    "Mitochondrial and chloroplast pathways"
                ],
                correct: 1,
                explanation: "The Golgi is a hub processing secretory proteins (outbound), lysosomal proteins (degradation), and endocytic materials (recycling)."
            },
            {
                question: "COPII coatomer proteins mediate:",
                options: [
                    "Retrograde transport from Golgi back to ER",
                    "Anterograde transport from the ER to the Golgi",
                    "Transport between mitochondria and peroxisomes",
                    "Transport into the nucleus"
                ],
                correct: 1,
                explanation: "COPII coats vesicles budding from ER destined for Golgi (forward traffic). These coats are then recycled back to the ER."
            },
            {
                question: "COPI coatomer proteins mediate:",
                options: [
                    "Anterograde transport from ER to Golgi",
                    "Retrograde transport from the Golgi back to the ER",
                    "Transport of secretory vesicles to the plasma membrane",
                    "Lysosomal protein targeting"
                ],
                correct: 1,
                explanation: "COPI coats vesicles returning from Golgi to ER (backward traffic), retrieving resident ER proteins that escaped."
            },
            {
                question: "Endosomes are best characterized as:",
                options: [
                    "Membrane-bound organelles that permanently store materials",
                    "Intermediate 'sorting' compartments that transport and sort endocytosed materials",
                    "The final destination for all endocytosed materials",
                    "Specialized only for ion storage"
                ],
                correct: 1,
                explanation: "Endosomes are sorting stations—they receive endocytosed material and decide its fate: degradation (lysosomes) or recycling (plasma membrane)."
            },
            {
                question: "The acidic environment of endosomes is maintained by:",
                options: [
                    "Glycosylation of membrane proteins",
                    "Proton pumps (H⁺-ATPases) that actively transport protons into the lumen",
                    "The presence of digestive enzymes",
                    "Continuous fusion with lysosomes"
                ],
                correct: 1,
                explanation: "Proton pumps create the acidic environment. This acidity causes receptor-ligand dissociation and enzyme activation."
            },

            // 1.3 INTRO TO CELL (CONTINUED) (66 QUESTIONS)
            {
                question: "Lysosomes function primarily to:",
                options: [
                    "Store and export proteins",
                    "Digest damaged cell structures, pathogens, and cellular waste",
                    "Synthesize new molecules and ATP",
                    "Maintain cell structure and shape"
                ],
                correct: 1,
                explanation: "Lysosomes are the cell's 'stomach'—filled with digestive enzymes that break down essentially everything."
            },
            {
                question: "The granules within lysosomes contain:",
                options: [
                    "Ribosomes for protein synthesis",
                    "Digestive enzymes that break down macromolecules and cellular debris",
                    "Genetic material (DNA and RNA)",
                    "Lipid storage molecules"
                ],
                correct: 1,
                explanation: "Lysosomal granules contain acid hydrolases that work optimally in the acidic lysosomal environment."
            },
            {
                question: "Lysosomal recycling involves:",
                options: [
                    "Permanently storing broken-down materials",
                    "Breaking down components from cellular debris and aged organelles, allowing efficient resource reuse",
                    "Synthesizing new lysosomes",
                    "Exporting all waste from the cell"
                ],
                correct: 1,
                explanation: "Lysosomes are recycling centers—building blocks are exported back to the cytoplasm for reuse during autophagy."
            },
            {
                question: "A notable distinction of lysosomes is:",
                options: [
                    "They are found in both plant and animal cells",
                    "They are NOT found in plant cells",
                    "They only function during cell division",
                    "They are membrane-free structures"
                ],
                correct: 1,
                explanation: "Lysosomes are unique to animal cells. Plant cells use their large vacuoles for digestive functions instead."
            },
            {
                question: "The outer membrane of mitochondria is characterized by:",
                options: [
                    "Highly folded with extensive cristae",
                    "Smooth and permeable to small solutes",
                    "Impermeable to all molecules",
                    "Site of oxidative phosphorylation"
                ],
                correct: 1,
                explanation: "The outer mitochondrial membrane is smooth and permeable, allowing small molecules to pass freely."
            },
            {
                question: "The inner membrane of mitochondria is notable because it is:",
                options: [
                    "Smooth and permeable",
                    "Folded into cristae and impermeable to most ions and molecules, maintaining a distinct environment",
                    "Continuous with the outer membrane",
                    "Only found in prokaryotes"
                ],
                correct: 1,
                explanation: "The inner mitochondrial membrane is highly organized and impermeable—essential for maintaining the proton gradient for ATP synthesis."
            },
            {
                question: "Cardiolipin is notable for being:",
                options: [
                    "The most abundant lipid in the plasma membrane",
                    "A unique phospholipid found in the inner mitochondrial membrane",
                    "Essential for photosynthesis",
                    "A component of cell wall in plants"
                ],
                correct: 1,
                explanation: "Cardiolipin is found almost exclusively in the inner mitochondrial membrane where it optimizes ATP synthase."
            },
            {
                question: "The cytoskeleton's primary structural role is:",
                options: [
                    "Only to store energy",
                    "To provide the structural framework that enables transport of materials throughout the cell",
                    "To synthesize proteins",
                    "To house genetic material"
                ],
                correct: 1,
                explanation: "The cytoskeleton is the cell's 'infrastructure'—it maintains shape and provides transport tracks."
            },
            {
                question: "The cytoskeleton is described as 'muscular' because it:",
                options: [
                    "Is only found in muscle cells",
                    "Possesses the ability to change cell shape rapidly through dynamic reorganization",
                    "Requires constant ATP hydrolysis to maintain structure",
                    "Is composed of contractile muscle proteins"
                ],
                correct: 1,
                explanation: "The cytoskeleton constantly polymerizes/depolymerizes, allowing rapid shape changes for migration and division."
            },
            {
                question: "The four main components of the cytoskeleton are: (SELECT ALL THAT APPLY)",
                options: [
                    "Thin (actin) filaments",
                    "Intermediate filaments",
                    "Thick filaments (myosin)",
                    "Microtubules"
                ],
                correct: [0, 1, 2, 3],
                explanation: "These four elements work together to provide contractility, strength, force, and transport capabilities."
            },
            {
                question: "Thin filaments (actin filaments) interact with which protein to enable muscle contraction?",
                options: [
                    "Tubulin",
                    "Myosin",
                    "Collagen",
                    "Keratin"
                ],
                correct: 1,
                explanation: "Myosin is the motor protein that walks along actin, generating force for muscle contraction and cell movement."
            },
            {
                question: "Which type of actin is found in muscle cells?",
                options: [
                    "Alpha-actin (α-actin)",
                    "Beta-actin (β-actin)",

            },

                    "Anchor cell-cell junctions (desmosomes)",

                correct: 1,

                ],
                correct: 1,
                explanation: "Myosin I generates small, localized forces in non-muscle cells, particularly important in amoeboid migration."
            },
            {
                question: "Myosin II functions to:",
                options: [

                ],
                correct: 1,
                explanation: "Myosin II is the primary myosin in muscle and non-muscle cells' stress fibers, essential for contraction and cytokinesis."
            },
            {
                question: "Myosin V participates in:",
                options: [
                    "Muscle contraction only",

                    "Microtubule stabilization",

                ],
                correct: 1,
                explanation: "Myosin V is a processive motor that transports vesicles, mRNA, and organelles along actin tracks."
            },
            {
                question: "Microtubules are characterized as:",
                options: [
                    "The smallest element of the cytoskeleton",

                    "Only found in cell division"
                ],
                correct: 1,
                explanation: "Microtubules (~25 nm diameter tubes) are stiffer than actin, provide long transport tracks, and are essential for division."
            },
            {
                question: "Microtubules are composed of: (SELECT ALL THAT APPLY)",
                options: [
                    "13 circular arrays of tubulin dimers",

                    "Beta-tubulin subunits with bound GTP"
                ],
                correct: [0, 1, 2],
                explanation: "Microtubules form hollow tubes—13 protofilaments arranged in a circle, with GTP binding/hydrolysis enabling dynamic instability."
            },
            {
                question: "Microtubule polarity is established by:",
                options: [
                    "Random orientation of tubulin dimers",
                    "Gamma-tubulin at the MTOC (Microtubule Organizing Center)",
                    "Alpha-tubulin exclusively",
                    "The nuclear envelope"
                ],
                correct: 1,
                explanation: "Gamma-tubulin is the nucleation factor organizing alpha-beta-tubulin. The MTOC is where microtubules originate."
            },
            {
                question: "The MTOC (Microtubule Organizing Center) is best defined as:",
                options: [
                    "The site where tubulin is synthesized",
                    "The site where microtubules are nucleated and organized, typically the centrosome",
                    "A storage organelle for unused microtubules",
                    "Part of the plasma membrane"
                ],
                correct: 1,
                explanation: "The MTOC is the 'hub'—microtubules radiate from it. In animal cells, the centrosome is the MTOC."
            },
            {
                question: "The minus (-) end of microtubules:",
                options: [
                    "Is the fast-growing end",
                    "Is stabilized by capping proteins that maintain microtubule structure",
                    "Is where vesicles preferentially bind",

                ],
                correct: 1,
                explanation: "The (-) end is anchored at the MTOC and is stable. The (+) end is free and dynamic."
            },
            {

                options: [
                    "Synthesize tubulin subunits",
                    "Regulate polymerization and facilitate organelle/vesicle movement along microtubules",
                    "Transport RNA to ribosomes",
                    "Break down old microtubules"
                ],
                correct: 1,
                explanation: "MAPs stabilize, regulate, or use microtubules. Some stabilize; others like dynein and kinesin are motors transporting cargo."
            },
            {
                question: "Dynein is a motor protein that:",
                options: [
                    "Moves cargo toward the (+) end of microtubules",
                    "Moves cargo toward the minus (-) end of microtubules (retrograde transport)",
                    "Synthesizes ATP for transport",
                    "Only functions in the nucleus"
                ],
                correct: 1,
                explanation: "Dynein is retrograde (backward)—it moves cargo from the periphery toward the MTOC, enabling endosomal traffic toward the nucleus."
            },
            {
                question: "Kinesin is a motor protein that:",
                options: [
                    "Moves cargo toward the (-) end toward the MTOC",
                    "Moves cargo toward the (+) end away from the MTOC (anterograde transport)",
                    "Breaks apart microtubules",
                    "Anchors vesicles to the plasma membrane"
                ],
                correct: 1,
                explanation: "Kinesin is anterograde (forward)—it moves cargo from the MTOC toward the periphery. Crucial for axonal transport in neurons."
            }
        ];

        // =====================================================================
        // FISHER-YATES SHUFFLE & STATE MANAGEMENT
        // =====================================================================

        function shuffleQuestions(questions) {
            return questions.map(q => {
                const shuffled = { ...q, options: [...q.options] };
                const correct = shuffled.correct;
                let correctOption = Array.isArray(correct)
                    ? shuffled.options.filter((_, i) => correct.includes(i))
                    : shuffled.options[correct];

                for (let i = shuffled.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled.options[i], shuffled.options[j]] = [shuffled.options[j], shuffled.options[i]];
                }

                if (Array.isArray(correct)) {
                    shuffled.correct = shuffled.options.map((opt, i) =>
                        (Array.isArray(correctOption) ? correctOption : [correctOption]).some(c => c === opt) ? i : -1
                    ).filter(i => i !== -1);
                } else {
                    shuffled.correct = shuffled.options.indexOf(correctOption);
                }
                return shuffled;
            });
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // =====================================================================
        // STATE & INITIALIZATION
        // =====================================================================

        let currentMode = 'ordered';
        let questionsOrdered = shuffleQuestions([...questionsBase]);
        let questionsShuffled = shuffleArray(questionsOrdered).map(q => ({ ...q }));
        let questions = [...questionsOrdered];
        let currentIndex = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let retryQueue = [];
        let answered = false;
        let selectedIndex = [];
        let lastKeyPressed = null;
        let lastKeyTime = 0;

        // =====================================================================
        // MODE & CONTROL FUNCTIONS
        // =====================================================================

        function setMode(mode) {
            currentMode = mode;
            resetQuiz();

            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'ordered') {
                questions = [...questionsOrdered];
            } else {
                questions = [...questionsShuffled];
            }
            displayQuestion();
        }

        function resetQuiz() {
            currentIndex = 0;
            correctCount = 0;
            incorrectCount = 0;
            retryQueue = [];
            answered = false;
            selectedIndex = [];
            document.getElementById('quizSection').classList.add('active');
            document.getElementById('resultsScreen').classList.remove('show');
        }

        // =====================================================================
        // DISPLAY & INTERACTION
        // =====================================================================

        function displayQuestion() {
            if (currentIndex >= questions.length) {
                showResults();
                return;
            }

            selectedIndex = [];
            const q = questions[currentIndex];
            document.getElementById('questionText').textContent = q.question;

            const optionsContainer = document.getElementById('answerOptions');
            optionsContainer.innerHTML = '';

            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.id = 'answer-' + index;
                btn.textContent = String.fromCharCode(65 + index) + ') ' + option;
                if (answered) {
                    btn.classList.add('disabled');
                }
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanationSection').classList.remove('show');
            document.getElementById('feedbackMessage').classList.remove('show');

            if (!answered) {
                document.getElementById('advancePrompt').innerHTML = '<strong>Press 1, 2, 3, or 4 to select</strong> → <strong>Press same key again to submit</strong>';
            } else {
                document.getElementById('advancePrompt').innerHTML = '<strong>Press any number (1-4) to continue</strong>';
                document.getElementById('advancePrompt').style.display = 'block';
            }

            updateProgress();
            updateScore();
        }

        function selectAnswer() {
            if (answered) return;
            answered = true;

            const q = questions[currentIndex];
            const buttons = document.querySelectorAll('.answer-btn');
            const correctIndices = Array.isArray(q.correct) ? q.correct : [q.correct];

            // Determine if answer is correct
            let isCorrect;
            if (Array.isArray(q.correct)) {
                // Multi-select: check if selected matches correct exactly
                isCorrect = selectedIndex.length === correctIndices.length &&
                            selectedIndex.every(i => correctIndices.includes(i));
            } else {
                // Single-select: check if selected matches correct
                isCorrect = selectedIndex.length === 1 && correctIndices.includes(selectedIndex[0]);
            }

            buttons.forEach((btn, i) => {
                if (correctIndices.includes(i)) {
                    btn.classList.add('correct');
                } else if (selectedIndex.includes(i) && !correctIndices.includes(i)) {
                    btn.classList.add('incorrect');
                }
                btn.classList.add('disabled');
            });

            if (isCorrect) {
                correctCount++;
                document.getElementById('feedbackMessage').textContent = '✓ Correct!';
                document.getElementById('feedbackMessage').className = 'feedback-message show correct';
            } else {
                incorrectCount++;
                retryQueue.push(q);
                document.getElementById('feedbackMessage').textContent = '✗ Incorrect';
                document.getElementById('feedbackMessage').className = 'feedback-message show incorrect';
            }

            document.getElementById('explanationSection').classList.add('show');
            document.getElementById('explanationText').textContent = q.explanation;
            document.getElementById('advancePrompt').innerHTML = '<strong>Press any number (1-4) to continue</strong>';
            document.getElementById('advancePrompt').style.display = 'block';

            updateScore();
        }

        function nextQuestion(e) {
            if (!answered) return;
            currentIndex++;
            answered = false;
            selectedIndex = [];

            if (currentIndex >= questions.length && retryQueue.length > 0) {
                questions = retryQueue;
                retryQueue = [];
                currentIndex = 0;
            }

            displayQuestion();
        }

        function updateProgress() {
            const total = questionsOrdered.length;
            const current = currentIndex + 1;
            document.getElementById('currentQuestion').textContent = current;
            document.getElementById('totalQuestions').textContent = total;

            const progress = (currentIndex / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            if (retryQueue.length > 0) {
                document.getElementById('retryLabel').textContent = '🔄 Retry: ' + retryQueue.length;
            } else {
                document.getElementById('retryLabel').textContent = '';
            }
        }

        function updateScore() {
            const total = correctCount + incorrectCount;
            const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('incorrectCount').textContent = incorrectCount;
            document.getElementById('percentageScore').textContent = percentage + '%';
        }

        function showResults() {
            document.getElementById('quizSection').classList.remove('active');
            document.getElementById('resultsScreen').classList.add('show');

            const total = correctCount + incorrectCount;
            const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;

            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('resultsStats').innerHTML =
                `<strong>${correctCount}</strong> Correct<br>` +
                `<strong>${incorrectCount}</strong> Incorrect<br>` +
                `<strong>${total}</strong> Total Questions`;

            let message, emoji;
            if (percentage === 100) {
                message = '🌟 Perfect!';
                emoji = '🌟';
            } else if (percentage >= 90) {
                message = '🎉 Excellent!';
                emoji = '🎉';
            } else if (percentage >= 80) {
                message = '👍 Great Work!';
                emoji = '👍';
            } else if (percentage >= 70) {
                message = '📚 Good Effort';
                emoji = '📚';
            } else if (percentage >= 60) {
                message = '💪 Keep Studying';
                emoji = '💪';
            } else {
                message = '📖 Review More';
                emoji = '📖';
            }

            document.getElementById('resultsMessage').textContent = message;
            document.getElementById('resultEmoji').textContent = emoji;
        }

        // =====================================================================
        // KEYBOARD CONTROLS - DOUBLE-PRESS SYSTEM
        // =====================================================================

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            const keyNum = parseInt(key);

            if (![1, 2, 3, 4].includes(keyNum)) return;

            const q = questions[currentIndex];
            const isMultiSelect = Array.isArray(q.correct);

            const now = Date.now();
            const timeSinceLastKey = now - lastKeyTime;
            const isDoublePress = (lastKeyPressed === keyNum && timeSinceLastKey < 500);

            if (!answered) {
                if (isMultiSelect) {
                    // TOGGLE logic for multi-select: pressing different numbers all stay highlighted
                    const index = keyNum - 1;
                    if (!selectedIndex.includes(index)) {
                        selectedIndex.push(index); // Add to selection
                    } else {
                        selectedIndex = selectedIndex.filter(i => i !== index); // Remove from selection
                    }

                    // Highlight all selected options
                    document.querySelectorAll('.answer-btn').forEach((btn, i) => {
                        btn.classList.remove('selected');
                        if (selectedIndex.includes(i)) {
                            btn.classList.add('selected');
                        }
                    });

                    // Submit on double-press of same key
                    if (isDoublePress && selectedIndex.includes(keyNum - 1)) {
                        selectAnswer();
                    }
                } else {
                    // Single-select: press once to select, double-press to submit
                    if (isDoublePress) {
                        selectedIndex = [keyNum - 1];
                        selectAnswer();
                    } else {
                        selectedIndex = [keyNum - 1];
                        document.querySelectorAll('.answer-btn').forEach((btn, i) => {
                            btn.classList.remove('selected');
                            if (i === selectedIndex[0]) {
                                btn.classList.add('selected');
                            }
                        });
                    }
                }
            } else {
                nextQuestion();
            }

            lastKeyPressed = keyNum;
            lastKeyTime = now;
        });

        // =====================================================================
        // INITIALIZATION
        // =====================================================================

        document.addEventListener('DOMContentLoaded', () => {
            displayQuestion();
        });
    </script>
