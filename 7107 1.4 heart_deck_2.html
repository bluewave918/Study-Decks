        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}.container{max-width:900px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:40px}.header{text-align:center;margin-bottom:30px}.header h1{color:#333;font-size:28px;margin-bottom:5px}.deck-label{color:#999;font-size:14px;margin-bottom:15px}.progress-bar{width:100%;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-bottom:20px}.progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);transition:width .3s ease}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:30px}.stat-box{background:#f5f5f5;padding:15px;border-radius:8px;text-align:center}.stat-label{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.5px}.stat-value{font-size:24px;font-weight:bold;color:#333;margin-top:5px}.question-section{margin-bottom:30px}.question-number{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}.question-text{font-size:18px;font-weight:600;color:#333;margin-bottom:20px;line-height:1.4}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.option{padding:15px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;transition:all .2s ease;background:#fff;font-size:14px;line-height:1.5;text-align:left;font-family:inherit}.option:hover:not(:disabled){border-color:#667eea;background:#f8f9ff}.option.selected{border-color:#667eea;background:#f0f4ff}.option.correct{border-color:#4caf50;background:#e8f5e9}.option.incorrect{border-color:#f44336;background:#ffebee}.option:disabled{cursor:default}.option-label{font-weight:bold;color:#667eea;margin-right:10px}.feedback{padding:15px;border-radius:8px;margin-bottom:20px;display:none}.feedback.show{display:block}.feedback.correct{background:#e8f     <script>
const QUESTIONS=[{q:137,text:"The mediastinum is defined as:",options:["The space between the lungs in the thoracic cavity","The space between the heart and ribs","The anterior surface of the esophagus","The muscular partition separating chest from abdomen"],correct:0,explanation:"The mediastinum is the central compartment in the thoracic cavity between the two lungs."},
{q:138,text:"The mediastinum is further subdivided into how many distinct regions?",options:["2 regions (superior and inferior)","3 regions (anterior, middle, posterior)","4 regions (superior mediastinum plus 3 regions of inferior mediastinum)","5 regions (superior plus 4 lower regions)"],correct:2,explanation:"Superior mediastinum + 3 inferior regions (anterior, middle, posterior) = 4 total regions."},
{q:139,text:"Which of the following structures is located SUPERIOR to the pericardial sac and therefore in the superior mediastinum?",options:["Ascending aorta","Pulmonary trunk","Internal jugular vein","Inferior vena cava"],correct:2,explanation:"The internal jugular vein is in the superior mediastinum draining the head/neck region."},
{q:140,text:"The superior mediastinum contains major veins that drain the head and neck region. Which of the following is NOT one of these veins?",options:["Internal jugular vein","Superior vena cava","Subclavian vein","Azygos vein"],correct:3,explanation:"Azygos vein drains the posterior side of the SVC. IJV, SVC, and subclavian drain the head/neck/upper extremity."},
{q:141,text:"The internal jugular vein is clinically important because:",options:["It is the sole source of venous drainage from the brain","It drains venous return from the head and neck into the brachiocephalic vein","It receives direct drainage from coronary vessels","It bypasses the superior vena cava"],correct:1,explanation:"Internal jugular vein drains the head/neck and joins the subclavian to form the brachiocephalic vein."},
{q:142,text:"The junction where subclavian veins meet internal jugular veins to form the brachiocephalic veins is clinically significant for:",options:["Direct lymphatic drainage of lymph from the upper extremity and head/neck","Arterial distribution to the arms","Pulmonary vein convergence","Coronary sinus drainage"],correct:0,explanation:"This junction (venous angle) is a major lymphatic drainage site for the upper body."},
{q:143,text:"How many brachiocephalic veins are present in the normal anatomy?",options:["1 (single midline vein)","2 (one on each side)","3 (2 lateral + 1 midline)","Variable, depending on body size"],correct:1,explanation:"There are two brachiocephalic veins: left and right, formed by the convergence of internal jugular and subclavian veins."},
{q:144,text:"The subclavian veins primarily drain blood from:",options:["The head and neck","The upper extremity (main site of upper extremity venous return)","The thoracic wall","The pulmonary circulation"],correct:1,explanation:"Subclavian veins are the main venous drainage from the upper extremities (arms)."},
{q:145,text:"The brachiocephalic veins are clinically important because they are:",options:["Prone to thrombosis","The main site of coronary artery origin","Commonly targeted for central line placement","The primary site of pacemaker lead insertion"],correct:2,explanation:"Central lines and pacemakers often use brachiocephalic vein access."},
{q:146,text:"The azygos vein drains into which vessel?",options:["Superior vena cava (specifically the posterior side)","Right brachiocephalic vein","Right atrium","Inferior vena cava"],correct:0,explanation:"The azygos vein drains into the posterior aspect of the superior vena cava."},
{q:147,text:"How many brachiocephalic arteries originate from the aorta?",options:["1 single trunk","2 (one on each side)","3 (one midline, two lateral)","Variable, with 1 being dominant"],correct:0,explanation:"There is only ONE brachiocephalic artery trunk that then branches to supply the right side."},
{q:148,text:"Why is there only a single brachiocephalic arterial trunk even though there are two brachiocephalic veins?",options:["The heart is positioned more to the left side of the body","The single brachiocephalic artery trunk lengthens the arterial circulation pathway to the right side of the body, compensating for the heart's leftward position","Venous and arterial anatomy do not follow the same patterns","The right side requires less blood flow than the left"],correct:1,explanation:"The single brachiocephalic trunk compensates for the leftward heart position by lengthening circulation to the right."},
{q:149,text:"The brachiocephalic artery gives rise to which two major branches?",options:["Left common carotid and left subclavian","Right common carotid and right subclavian","Right and left vertebral arteries","Right axillary and right internal mammary arteries"],correct:1,explanation:"Brachiocephalic artery branches into right common carotid and right subclavian arteries."},
{q:150,text:"In the superior mediastinum, which artery arises directly from the aortic arch on the LEFT side?",options:["Brachiocephalic artery (which then branches)","Left common carotid artery","Right subclavian artery","Celiac trunk"],correct:1,explanation:"Left common carotid artery arises directly from the left side of the aortic arch."},
{q:151,text:"The left subclavian artery in the superior mediastinum arises:",options:["From the brachiocephalic artery","From the left common carotid artery","Directly from the aortic arch","From the internal mammary artery"],correct:2,explanation:"Left subclavian artery arises directly from the aortic arch on the left side."},
{q:152,text:"Bronchiole arteries in the superior mediastinum primarily function to:",options:["Participate in gas exchange within the lungs","Vascularize the lung tissue itself (nutritive function), not for gas exchange","Drain deoxygenated blood from the pulmonary circulation","Supply the bronchi smooth muscle only"],correct:1,explanation:"Bronchiole arteries are systemic nutritive blood supply to lung tissue, not involved in gas exchange."},
{q:153,text:"Why is it significant that bronchiole arteries vascularize lung tissue rather than participate in gas exchange?",options:["They represent the systemic circulation's nutritive function for lung parenchyma","This distinguishes them from pulmonary arteries, which carry deoxygenated blood for oxygenation","They are the only arterial supply to the lungs","They originate from the pulmonary artery directly"],correct:1,explanation:"Bronchiole arteries provide nutrition; pulmonary arteries provide oxygenation. This is a key distinction."},
{q:154,text:"The sympathetic trunk in the superior mediastinum:",options:["Provides only motor innervation to cardiac muscle","Gives rise to peripheral sympathetic nerves and contains segmental ganglia","Runs anterior to the esophagus","Merges with parasympathetic fibers to form the deep cardiac plexus"],correct:1,explanation:"Sympathetic trunk contains ganglia and gives rise to splanchnic nerves and other sympathetic fibers."},
{q:155,text:"The left recurrent laryngeal nerve is a branch of which cranial nerve?",options:["Trigeminal nerve (CN V)","Glossopharyngeal nerve (CN IX)","Vagus nerve (CN X)","Accessory nerve (CN XI)"],correct:2,explanation:"Recurrent laryngeal nerve is a branch of the vagus nerve (CN X)."},
{q:156,text:"The left recurrent laryngeal nerve has clinical significance because:",options:["It supplies parasympathetic fibers to the heart","It innervates the left vocal cords, and damage during thoracic surgery causes voice changes","It provides sensory innervation to the esophagus","It carries sympathetic preganglionic fibers"],correct:1,explanation:"Damage to recurrent laryngeal nerve during cardiac/thoracic surgery causes vocal cord paralysis and hoarseness."},
{q:157,text:"The left vagus nerve in the superior mediastinum is important because:",options:["It is the primary source of sympathetic innervation to the heart","It provides parasympathetic innervation and contains the left recurrent laryngeal nerve","It is strictly sensory","It innervates only the pulmonary vessels"],correct:1,explanation:"Vagus nerve provides parasympathetic innervation and contains the recurrent laryngeal nerve branch."},
{q:158,text:"The anterior pulmonary plexus in the superior mediastinum is formed by:",options:["Branches of the sympathetic trunk and vagus nerve","Only sympathetic nerve fibers","Only parasympathetic fibers","Somatic spinal nerves exclusively"],correct:0,explanation:"Pulmonary plexuses are formed by sympathetic and parasympathetic (vagal) nerve branches."},
{q:159,text:"The posterior pulmonary plexus is located:",options:["Anterior to the pulmonary vessels","In the anterior mediastinum","Behind the pulmonary vessels","At the cardiac base"],correct:2,explanation:"Posterior pulmonary plexus is located posterior to the pulmonary vessels."},
{q:160,text:"The deep cardiac plexus in the superior mediastinum is primarily formed by:",options:["Vagal parasympathetic fibers and sympathetic fibers from the sympathetic trunk","Somatic sensory fibers from intercostal nerves","Phrenic nerve fibers","Recurrent laryngeal nerve branches only"],correct:0,explanation:"Deep cardiac plexus is formed by sympathetic and parasympathetic fibers that innervate the heart."},
{q:161,text:"The phrenic nerve in the superior mediastinum is positioned:",options:["Posterior to the esophagus","Anterior compared to other major structures in the region","Along the posterior mediastinal border","Within the cardiac plexus"],correct:1,explanation:"Phrenic nerve is anterior to most mediastinal structures, running anteriorly along the pericardium."},
{q:162,text:"Which of the following structures passes through the superior mediastinum?",options:["Trachea","Main bronchi","Lung tissue","Diaphragm"],correct:0,explanation:"Trachea passes through superior mediastinum; main bronchi branch in the lungs."},
{q:163,text:"The esophagus in the superior mediastinum:",options:["Receives its blood supply from the superior mesenteric artery","Is located posterior to the trachea and anterior to the vertebral column","Has the aorta running anterior to it","Is completely surrounded by the mediastinal pleura"],correct:1,explanation:"Esophagus is posterior to trachea and anterior to the thoracic vertebral column."},
{q:164,text:"The thoracic duct in the superior mediastinum represents:",options:["A venous return pathway from the lower body","The main lymphatic vessel draining lymph from most of the body (except upper right quadrant)","A branch of the esophageal venous plexus","An autonomic nerve trunk"],correct:1,explanation:"Thoracic duct is the largest lymphatic vessel, draining most of the body except right upper quadrant."},
{q:165,text:"The thymus gland (superior portions) in the superior mediastinum:",options:["Reaches maximum size in infants and regresses with age","Is located primarily in the anterior superior mediastinum","Contains predominantly parasympathetic ganglia","Is responsible for hormone production in adults only"],correct:1,explanation:"Thymus is largest in infants/children and is located in anterior mediastinum."},
{q:166,text:"The inferior mediastinum is subdivided into which regions?",options:["Left and right","Anterior, middle, and posterior","Superior and inferior","Upper, middle, lower"],correct:1,explanation:"Inferior mediastinum has 3 regions: anterior, middle (defined by parietal pleura), and posterior."},
{q:167,text:"The boundary separating the middle mediastinum from the lateral thorax is:",options:["The visceral pleura of the lungs","The parietal pleura","The fibrous pericardium","The mediastinal septum"],correct:1,explanation:"Parietal pleura forms the boundary between middle mediastinum and lateral thorax."},
{q:168,text:"The anterior region of the inferior mediastinum primarily contains:",options:["The heart and pericardium","The majority of the thymus gland","The esophagus","All major coronary vessels"],correct:1,explanation:"Anterior inferior mediastinum contains mostly thymus gland with minimal other structures."},
{q:169,text:"A clinical feature of the anterior region of the inferior mediastinum is:",options:["It contains extensive neurovascular structures","It contains NO nerves and only small veins and arteries","It is the primary site of cardiac arrhythmia generation","It contains the entire thoracic aorta"],correct:1,explanation:"Anterior mediastinum is relatively avascular and contains few nerves."},
{q:170,text:"The middle region of the inferior mediastinum is clinically defined by:",options:["The location of the esophagus","The boundary of the parietal pleura","The anterior margin of the aorta","The position of the sympathetic trunk"],correct:1,explanation:"Parietal pleura boundary defines the middle from anterior/posterior mediastinum."},
{q:171,text:"Which of the following structures is located in the middle mediastinum?",options:["Majority of the thymus","Esophagus","Heart (pericardium), ascending aorta, pulmonary trunk and branches, pulmonary veins","Thoracic duct"],correct:2,explanation:"Middle mediastinum contains heart, great vessels, and pulmonary vessels."},
{q:172,text:"The phrenic nerve courses through the middle mediastinum in which position relative to the lung hilum?",options:["Posterior to the hilum","Anterior to the hilum","Within the hilum","Deep within the pulmonary vessels"],correct:1,explanation:"Phrenic nerve is anterior to the lung hilum, running along the pericardium."},
{q:173,text:"The vagus nerve courses through the middle mediastinum in which position relative to the lung hilum?",options:["Anterior to the hilum","Posterior to the hilum","Lateral to the hilum","At the level of the pulmonary artery"],correct:1,explanation:"Vagus nerve is posterior to the lung hilum."},
{q:174,text:"The pericardiophrenic vessels (veins and arteries) in the middle mediastinum:",options:["Supply blood to the thymus only","Accompany the phrenic nerve and supply the pericardium","Drain blood from the lungs","Supply parasympathetic innervation"],correct:1,explanation:"Pericardiophrenic vessels accompany phrenic nerve and supply pericardium."},
{q:175,text:"The azygos vein in the middle mediastinum drains into:",options:["The inferior vena cava","The left brachiocephalic vein","The right atrium","The posterior surface of the superior vena cava"],correct:3,explanation:"Azygos drains into posterior SVC."},
{q:176,text:"The pulmonary trunk in the middle mediastinum carries:",options:["Oxygenated blood to the lungs","Deoxygenated blood from the right ventricle to the lungs for oxygenation","Oxygenated blood from the lungs to the body","Blood from the coronary circulation"],correct:1,explanation:"Pulmonary trunk carries deoxygenated blood from right ventricle to lungs."},
{q:177,text:"Aortic and pulmonary semilunar valve sounds are best heard at which intercostal spaces?",options:["1st and 2nd ICS","2nd ICS (right for aortic, left for pulmonary)","3rd and 4th ICS","4th and 5th ICS"],correct:1,explanation:"Semilunar valves are best heard at 2nd intercostal space (aortic right, pulmonary left)."},
{q:178,text:"The aortic valve is the ONLY semilunar valve auscultated at the:",options:["Right 2nd intercostal space","Left 2nd intercostal space","Left 3rd intercostal space","Right 4th intercostal space"],correct:0,explanation:"Aortic valve is uniquely heard at right 2nd ICS."},
{q:179,text:"The pulmonary valve is auscultated at the:",options:["Right 2nd intercostal space","Left 2nd intercostal space","Right 4th intercostal space","Left 5th intercostal space"],correct:1,explanation:"Pulmonary valve is heard at left 2nd ICS."},
{q:180,text:"Atrioventricular (mitral and tricuspid) valve sounds are best heard at the:",options:["2nd intercostal space bilaterally","3rd intercostal space left and right","4th-5th intercostal space, left side","5th-6th intercostal space, right side"],correct:2,explanation:"AV valves are best heard at 4th-5th left ICS (apical area)."},
{q:181,text:"During cardiac auscultation, the apical impulse (point of maximal impulse/PMI) is located at approximately:",options:["2nd intercostal space, left midclavicular line","5th intercostal space, left midclavicular line","3rd intercostal space, midsternal line","4th intercostal space, anterior axillary line"],correct:1,explanation:"PMI is at 5th intercostal space, left midclavicular line."},
{q:182,text:"Situs inversus refers to:",options:["Reversal of all organs in the body","Partial reversal where the heart points to the right instead of left","Duplication of mediastinal structures","Absence of pericardium"],correct:1,explanation:"Situs inversus is partial reversal with heart on right; totalis is complete organ reversal."},
{q:183,text:"Situs inversus totalis involves:",options:["Only reversal of cardiac position","Reversal of the heart and some thoracic structures","Reversal of ALL abdominal and thoracic viscera to opposite sides","Reversal of only abdominal organs"],correct:2,explanation:"Situs inversus totalis is complete reversal of all thoracic and abdominal organs."},
{q:184,text:"A patient with situs inversus totalis would have which clinical implication for cardiac auscultation?",options:["Heart sounds remain in the normal left 5th ICS location","Heart sounds would be heard on the right side of the chest","Heart sounds are inaudible","No change in auscultation findings"],correct:1,explanation:"With reversed anatomy, heart is on right, so sounds are heard on right side."},
{q:185,text:"Which of the following is NOT a primary function of the pericardium?",options:["Lubrication of the heart surface","Holding the heart in the mediastinum","Preventing overfilling of the heart","Generation of cardiac contraction force"],correct:3,explanation:"Pericardium lubricates, supports, and protects; myocardium generates contractions."},
{q:186,text:"The pericardium can be described as having what primary function in terms of heart containment?",options:["It entirely surrounds and anchors the heart in the mediastinum","It only covers the anterior surface of the heart","It prevents all cardiac movement","It generates electrical signals"],correct:0,explanation:"Pericardium completely surrounds the heart, anchoring it in place."},
{q:187,text:"Infection protection by the pericardium is primarily achieved through:",options:["Antimicrobial peptides in the pericardial fluid","Physical barrier function of the pericardial sac","Immune cells uniquely present in the pericardium","Antibiotic properties of pericardial serous fluid"],correct:1,explanation:"Physical barrier of pericardial sac provides protection against infection spread."},
{q:188,text:"The fibrous pericardium is best described as:",options:["A fluid-filled membrane","The most external layer, often visible as thick fascia","The innermost layer in contact with the myocardium","The site of serous fluid production"],correct:1,explanation:"Fibrous pericardium is the tough outer layer, visible as thick connective tissue."},
{q:189,text:"The serous pericardium is characterized by:",options:["Thick fibrous tissue","Being lubricated and containing parietal and visceral layers","Direct contact only with the fibrous pericardium","Absence of fluid between layers"],correct:1,explanation:"Serous pericardium has parietal/visceral layers with lubricating fluid."},
{q:190,text:"The parietal layer of the serous pericardium:",options:["Is in direct contact with the myocardium","Adheres to the fibrous pericardium","Forms the epicardium exclusively","Produces the majority of pericardial serous fluid"],correct:1,explanation:"Parietal layer adheres to the inner fibrous pericardium."},
{q:191,text:"The visceral layer of the serous pericardium:",options:["Adheres to the fibrous pericardium","Is synonymous with the epicardium","Forms the external fibrous coat","Lines the mediastinal space"],correct:1,explanation:"Visceral pericardium is also called epicardium, attached to heart."},
{q:192,text:"The pericardial cavity is best described as:",options:["A true space always containing significant fluid","A potential space between parietal and visceral layers of serous pericardium (not actually a space unless pathology)","The space between fibrous and serous pericardium","The space within the myocardium"],correct:1,explanation:"Pericardial cavity is potential space; usually it's just a thin film unless effusion develops."},
{q:193,text:"The epicardium in cardiac anatomy is:",options:["Synonymous with the endocardium","The part of the pericardium physically in contact with the heart and great vessels; includes both layers of serous pericardium","The muscular layer of the heart","The fibrous external covering only"],correct:1,explanation:"Epicardium (visceral pericardium) contacts the heart; includes both serous layers."},
{q:194,text:"From external to internal, the layers of the heart wall are:",options:["Epicardium, myocardium, endocardium","Pericardium, myocardium, epicardium","Fibrous pericardium, serous pericardium, myocardium","Endocardium, myocardium, epicardium"],correct:0,explanation:"Heart wall layers: epicardium → myocardium → endocardium (external to internal)."},
{q:195,text:"The myocardium is composed of:",options:["Serous tissue","Cardiac muscle","Connective tissue only","Nervous tissue"],correct:1,explanation:"Myocardium is cardiac muscle, the contractile layer of the heart."},
{q:196,text:"The endocardium is:",options:["The external fibrous layer","The muscular layer","The internal lining of the heart, including trabeculae carneae","The serous membrane external to the heart"],correct:2,explanation:"Endocardium is inner lining; trabeculae carneae are irregular ridges of endocardium."},
{q:197,text:"Pericardial effusion is defined as:",options:["Inflammation of the pericardium","Fluid in the pericardial sac caused by disequilibrium in serous fluid absorption/production or anatomical defect","Thickening of the pericardial wall","Scarring of the pericardium"],correct:1,explanation:"Effusion is excess fluid in pericardial cavity from production/absorption imbalance."},
{q:198,text:"Which of the following is a common cause of pericardial effusion?",options:["Normal cardiac function","Viral infection (especially HIV/AIDS), cancer, tuberculosis, or radiation","Excessive exercise","High altitude exposure"],correct:1,explanation:"Viral infections (HIV), malignancy, TB, and radiation are common effusion causes."},
{q:199,text:"Pericarditis is best defined as:",options:["A pericardial effusion due to inflammation","Infection of the myocardium","Thickening of the fibrous pericardium","Adhesions between pericardial layers"],correct:0,explanation:"Pericarditis is pericardial inflammation, often with accompanying effusion."},
{q:200,text:"Viral pericarditis is particularly associated with which viral infection in the modern era?",options:["Influenza alone","COVID-19","HIV/AIDS","Measles"],correct:2,explanation:"HIV/AIDS-associated viral pericarditis is particularly common."},
{q:201,text:"Other risk factors for pericarditis include all EXCEPT:",options:["Cancer metastases to the pericardium","Tuberculosis","Radiation therapy to the chest","Coronary artery disease alone"],correct:3,explanation:"CAD doesn't cause pericarditis; TB, cancer, and radiation do."},
{q:202,text:"The transverse pericardial sinus is clinically significant because:",options:["It is the most common site of fluid accumulation","If fluid reaches this space, the lower space is full, indicating very serious pericardial effusion","It communicates with the coronary sinus","It is the site where the phrenic nerve passes"],correct:1,explanation:"Transverse sinus fluid means the lower oblique sinus is full = massive effusion."},
{q:203,text:"The oblique pericardial sinus is the location where pericardial effusion would collect if:",options:["The heart is in normal position","The heart is flipped upward (as might occur during cardiac surgery)","The pericardium ruptures","Pericarditis develops"],correct:1,explanation:"Oblique sinus would collect effusion if heart is lifted during surgery."},
{q:204,text:"Cardiac tamponade is a medical emergency in which:",options:["The pericardium becomes inflamed","The heart is 'strangled' by fluid in the pericardial cavity, preventing adequate venous return and reducing cardiac output","The heart ruptures through the pericardium","Pericardial adhesions form"],correct:1,explanation:"Tamponade: fluid compresses heart, preventing filling and output."},
{q:205,text:"In cardiac tamponade, the primary hemodynamic problem is:",options:["Excessive cardiac output","The heart cannot accept venous return fully, and cardiac output is severely reduced","Increased systolic blood pressure","Coronary artery occlusion"],correct:1,explanation:"Tamponade prevents ventricular filling and output reduction."},
{q:206,text:"A patient in cardiac tamponade would clinically present with:",options:["Hypertension and tachycardia only","Cyanosis (blue lips/skin) due to severe hypoxia and reduced cardiac output","Hyperventilation and confusion only","Bradycardia and hypertension"],correct:1,explanation:"Tamponade causes severe low output → hypoxia → cyanosis."},
{q:207,text:"The definitive emergency treatment for cardiac tamponade is:",options:["Diuretics to reduce fluid","High-flow oxygen","Pericardiocentesis (needle aspiration of pericardial fluid)","Antibiotics"],correct:2,explanation:"Pericardiocentesis removes fluid to relieve tamponade emergently."},
{q:208,text:"The phrenic nerve in relation to pericardial innervation:",options:["Provides motor fibers only","Is the PRIMARY SOURCE OF SENSORY FIBERS FOR PAIN to the fibrous pericardium","Is purely autonomic","Has no sensory function"],correct:1,explanation:"Phrenic nerve provides pain sensation to pericardium; vagus provides parasympathetic."},
{q:209,text:"Clinically, phrenic nerve innervation of the pericardium is important because:",options:["It explains chest pain associated with pericarditis","It prevents pericardial inflammation","It generates the pericardial fluid","It controls pericardial contractility"],correct:0,explanation:"Phrenic nerve mediates pericardial pain, explaining pericarditis chest pain."},
{q:210,text:"The serous pericardium (visceral and parietal layers) is:",options:["Highly sensitive to pain","NOT sensitive to pain, but IS sensitive to stretch and chemical stimuli","Insensate to all stimuli","Only sensitive to temperature changes"],correct:1,explanation:"Serous pericardium senses stretch/chemicals but not pain (unlike fibrous)."},
{q:211,text:"The vagus nerve innervation of the pericardium has:",options:["Well-characterized motor functions","Unclear/uncertain function","Primarily sensory roles","Purely parasympathetic motor effects"],correct:1,explanation:"Vagal pericardial function is not well understood."},
{q:212,text:"Sympathetic trunk innervation to the pericardiophrenic vessels is primarily:",options:["Motor to cardiac muscle","Sensory from the pericardium","Vasomotor (controls vasodilation of pericardiophrenic vessels)","Parasympathetic"],correct:2,explanation:"Sympathetic innervation causes vasodilation of pericardiophrenic vessels."},
{q:213,text:"The lymphatic system includes all EXCEPT:",options:["Lymph vessels","Lymph nodes","Lymph organs (spleen, thymus)","Arteries"],correct:3,explanation:"Lymphatic system has vessels, nodes, organs; arteries are separate cardiovascular."},
{q:214,text:"Lymph is best described as:",options:["Blood that has been oxygenated by the lungs","Tissue fluid that has entered lymphatic vessels; contains white blood cells, proteins, and nutrients","Cerebrospinal fluid","Blood plasma filtered by the kidneys"],correct:1,explanation:"Lymph is tissue fluid with cells, proteins, nutrients."},
{q:215,text:"The primary function of lymphatic vessels is:",options:["Oxygenate tissues","Drain tissue fluid (lymph) back to the venous circulation","Store immune cells","Produce antibodies"],correct:1,explanation:"Lymphatics drain interstitial fluid back to blood."},
{q:216,text:"Lymphatic vessels drain lymph into which vascular system?",options:["Arterial circulation","Pulmonary circulation","Venous circulation","Portal circulation"],correct:2,explanation:"Lymph drains into veins at the venous angles."},
{q:217,text:"The thoracic duct is the largest lymphatic vessel. It drains lymph from:",options:["Only the lower extremities","Only the upper body","Most of the body EXCEPT the upper right quadrant (right arm, right upper thorax, right head/neck)","Only thoracic organs"],correct:2,explanation:"Thoracic duct drains everything except right upper quadrant."},
{q:218,text:"The thoracic duct ultimately drains into:",options:["The right atrium","The junction of the left subclavian and internal jugular veins (left venous angle)","The right lymphatic duct","The superior vena cava directly"],correct:1,explanation:"Thoracic duct drains into left venous angle."},
{q:219,text:"The right lymphatic duct drains lymph from:",options:["The entire right side of the body","The upper right quadrant (right arm, right upper thorax, right head/neck)","Only the lungs","The right ventricle and coronary vessels"],correct:1,explanation:"Right lymphatic duct drains right upper quadrant only."},
{q:220,text:"The right lymphatic duct drains into:",options:["The left venous angle","The right atrium","The junction of the right subclavian and internal jugular veins (right venous angle)","The azygos vein"],correct:2,explanation:"Right lymphatic duct drains into right venous angle."},
{q:221,text:"The junction of subclavian and internal jugular veins is clinically important for lymphatic drainage because:",options:["It is where the brachiocephalic artery branches","It is a major site of lymph drainage from the head, neck, and upper extremity","It is the origin of the coronary sinus","It is where the thoracic aorta begins"],correct:1,explanation:"Venous angles are major lymphatic drainage junctions."},
{q:222,text:"Lymph nodes are best described as:",options:["Fluid-filled vesicles","Sites of immune cell filtration and immune response activation; lymph passes through to be filtered and screened","Vascular structures that produce blood cells","Endocrine glands"],correct:1,explanation:"Lymph nodes filter lymph and house immune cells."},
{q:223,text:"Lymph nodes draining the heart and mediastinum are clinically important because:",options:["They are always enlarged","Metastatic cancer from thoracic tumors can involve these nodes, affecting prognosis and staging","They produce cardiac hormones","They are the sole source of cardiac immune protection"],correct:1,explanation:"Mediastinal node involvement affects cancer staging."},
{q:224,text:"Mediastinal lymph nodes include which groups?",options:["Anterior mediastinal nodes","Posterior mediastinal nodes","Tracheobronchial nodes","All of the above"],correct:3,explanation:"Multiple mediastinal lymph node groups exist."},
{q:225,text:"An enlarged mediastinal lymph node can clinically cause:",options:["Compression of the esophagus (dysphagia)","Compression of the trachea (dyspnea)","Compression of great vessels (superior vena cava syndrome)","All of the above"],correct:3,explanation:"Enlarged mediastinal nodes can compress multiple structures."},
{q:226,text:"Lymphedema is caused by:",options:["Excessive lymphatic fluid production","Lymphatic vessel obstruction or removal (e.g., lymph node dissection in cancer treatment) preventing normal lymph drainage","Increased venous pressure","Dehydration"],correct:1,explanation:"Lymphedema results from impaired lymphatic drainage."},
{q:227,text:"Lymphatic obstruction in the mediastinum can result in:",options:["Ascites (abdominal fluid accumulation)","Thoracic duct obstruction → chylothorax (chyle in pleural space)","Cerebral edema","Pulmonary embolism"],correct:1,explanation:"Thoracic duct obstruction causes chylothorax (milky fluid in chest)."},
{q:228,text:"Chylothorax is characterized by:",options:["Purulent fluid in the pleural space","Milky fluid (chyle) in the pleural space due to thoracic duct injury or obstruction","Serous fluid accumulation","Blood in the pleural space"],correct:1,explanation:"Chylothorax is milky pleural fluid from thoracic duct injury."},
{q:229,text:"Clinical causes of chylothorax include:",options:["Thoracic duct injury during cardiac surgery","Mediastinal lymphoma obstructing the thoracic duct","Trauma to the superior mediastinum","All of the above"],correct:3,explanation:"Multiple causes of chylothorax exist."},
{q:230,text:"Lymph node involvement in mediastinal lymphoma is particularly concerning because:",options:["It affects taste and smell","Enlarged nodes can compress the superior vena cava, trachea, and esophagus, causing vascular compromise and airway obstruction","It directly destroys cardiac tissue","It always results in immediate cardiac arrhythmia"],correct:1,explanation:"Mediastinal lymphoma causes life-threatening compressions."},
{q:231,text:"The cardiac lymphatic system is important because:",options:["Lymphatic channels drain fluid from the myocardium and pericardium into mediastinal lymph nodes","The heart produces lymph","Lymph nodes generate cardiac contractions","Lymphatic fluid serves as the sole immune defense for the heart"],correct:0,explanation:"Cardiac lymphatics drain myocardial/pericardial fluid."},
{q:232,text:"Cardiac inflammation or edema can be detected through:",options:["Enlarged mediastinal lymph nodes reflecting increased lymphatic drainage","Changes in heart sounds alone","ECG findings exclusively","Reduced cardiac output only"],correct:0,explanation:"Cardiac inflammation causes enlarged mediastinal nodes."},
{q:233,text:"Lymphatic obstruction affecting cardiac function can result in:",options:["Myocardial edema reducing contractility","Pericardial effusion from impaired lymphatic drainage","Both myocardial and pericardial fluid accumulation","All of the above"],correct:3,explanation:"Lymphatic obstruction affects heart function through fluid accumulation."},
{q:234,text:"The posterior region of the inferior mediastinum contains which of the following?",options:["Majority of the thymus and few vessels","Heart and pulmonary vessels","Esophagus, thoracic aorta, posterior intercostals, azygos vein, thoracic duct, vagus nerve, and sympathetic trunk","Only lymph nodes and lymphatic vessels"],correct:2,explanation:"Posterior mediastinum contains major visceral and neural structures."},
{q:235,text:"In the posterior mediastinum, the anatomical order from anterior to posterior is:",options:["Esophagus, trachea, great vessels","Great vessels, trachea, esophagus","Trachea, esophagus, great vessels","Esophagus, great vessels, trachea"],correct:1,explanation:"Order is: great vessels → trachea → esophagus (anterior to posterior)."},
{q:236,text:"The thoracic duct in the posterior mediastinum is characterized as:",options:["A major artery","A venous return pathway","A major lymphatic highway draining lymph from most of the body","A sympathetic nerve trunk"],correct:2,explanation:"Thoracic duct is largest lymphatic vessel."},
{q:237,text:"The thoracic aorta in the posterior mediastinum:",options:["Originates from the right ventricle","Is a branch of the ascending aorta","Descends through the posterior mediastinum, giving branches to posterior intercostal vessels and viscera","Curves anteriorly to form the aortic arch"],correct:2,explanation:"Thoracic aorta descends posteriorly, giving intercostal and visceral branches."},
{q:238,text:"Posterior intercostal vessels in the posterior mediastinum:",options:["Supply only skeletal muscle","Supply each intercostal space with arteries, veins, and nerves","Drain only venous blood from the lungs","Are exclusively sympathetic nerve pathways"],correct:1,explanation:"Posterior intercostal vessels supply intercostal spaces with A-V-N."},
{q:239,text:"The azygos vein in the posterior mediastinum drains into:",options:["The left brachiocephalic vein","The inferior vena cava","The superior vena cava (SVC)","The right atrium directly"],correct:2,explanation:"Azygos drains into posterior SVC."},
{q:240,text:"The vagus nerve in the posterior mediastium:",options:["Provides primarily sympathetic innervation","Is strictly sensory","Provides parasympathetic innervation and is involved in autonomic functions","Supplies only skeletal muscle"],correct:2,explanation:"Vagus provides parasympathetic innervation."},
{q:241,text:"The sympathetic trunk in the posterior mediastinum:",options:["Originates from the thoracic spinal cord segments","Contains segmental ganglia along its length","Is a single midline structure","Only provides motor innervation to smooth muscle"],correct:1,explanation:"Sympathetic trunk has thoracic ganglia."},
{q:242,text:"A key anatomical difference between the vagus and phrenic nerves is their position in the mediastinum:",options:["Both are anterior to the lung hilum","Both are posterior to the lung hilum","Phrenic nerve is anterior to hilum; vagus is posterior to hilum","Their positions vary with respiration"],correct:2,explanation:"Phrenic anterior, vagus posterior to lung hilum."},
{q:243,text:"The asymmetry of the vagus and phrenic nerves in the mediastinum has clinical significance because:",options:["It explains why the left side differs from the right in innervation patterns","Both nerves have identical functions","Only one nerve functions at a time","They merge into a single trunk"],correct:0,explanation:"The asymmetry explains different innervation patterns."},
{q:244,text:"On a RIGHT view of the posterior mediastium, you would see:",options:["The thoracic aorta and left vagus nerve","The superior vena cava with the azygos vein draining into it and the right phrenic nerve","The esophagus and left recurrent laryngeal nerve","Only lymphatic vessels"],correct:1,explanation:"Right view shows SVC with azygos drain and right phrenic."},
{q:245,text:"On a LEFT view of the posterior mediastium, you would see:",options:["The azygos vein draining into the SVC","The right phrenic nerve","The thoracic aorta and vagus nerve","The superior vena cava"],correct:2,explanation:"Left view shows thoracic aorta and vagus nerve."},
{q:246,text:"Emergency cricothyrotomy is a procedure used to establish an airway after:",options:["Elective intubation","Anaphylaxis, neck/facial trauma, or fascial space infections","Routine endoscopy","Sleep apnea diagnosis"],correct:1,explanation:"Cricothyrotomy is emergency airway for anaphylaxis/trauma."},
{q:247,text:"Why would an emergency cricothyrotomy NOT be anatomically possible if the esophagus were anterior (instead of posterior) in the mediastinum?",options:["The esophagus would not interfere","The esophagus would block access to the cricothyroid membrane, making the procedure impossible","The trachea would be too deep","There would be no difference"],correct:1,explanation:"Anterior esophagus would block cricothyroid membrane access."},
{q:248,text:"The cricothyroid membrane is located between:",options:["Thyroid cartilage and epiglottis","Cricoid cartilage and trachea","Thyroid cartilage and cricoid cartilage","Larynx and esophagus"],correct:2,explanation:"Cricothyroid membrane is between thyroid and cricoid cartilages."},
{q:249,text:"The lymphatic system serves primarily as:",options:["The sole source of oxygen delivery","An accessory route for fluid from the interstitial space to reach the bloodstream","A immune system replacement for antibodies","The primary route for nutrient absorption from the GI tract only"],correct:1,explanation:"Lymphatics drain interstitial fluid back to blood."},
{q:250,text:"Which of the following is NOT a function of the lymphatic system?",options:["Carrying large proteins away from tissues","Carrying particulate matter away from tissues","Generating red blood cells","Destroying bacteria via lymph nodes"],correct:2,explanation:"Lymphatics don't produce RBCs (bone marrow does)."},
{q:251,text:"Approximately how much lymph is pumped per day through the lymphatic system?",options:["0.5-1 liter per day","2-3 liters per day","5-10 liters per day","15-20 liters per day"],correct:1,explanation:"Approximately 2-3 liters of lymph are produced daily."},
{q:252,text:"Which tissues DO have lymphatic drainage?",options:["Almost all tissues (with few exceptions)","Only organs","Only deep structures","Only endocrine tissues"],correct:0,explanation:"Most tissues have lymphatics except brain, cartilage, bone marrow."},
{q:253,text:"Tissues that DO NOT have lymphatic drainage include:",options:["Brain, bone marrow, cartilage, cornea, and epithelium","Liver, spleen, and kidneys","Heart, lungs, and diaphragm","All connective tissues"],correct:0,explanation:"Brain, marrow, cartilage, cornea, epithelium lack lymphatics."},
{q:254,text:"The lymphatic system plays a critical role in controlling interstitial fluid by maintaining:",options:["Positive pressure to push fluids into tissues","Negative pressure (partial vacuum) that holds tissues together and prevents edema","Equal pressure between interstitial and vascular spaces","High osmotic pressure"],correct:1,explanation:"Lymphatic drainage maintains negative pressure in interstitium."},
{q:255,text:"Previously, it was thought that _______ provided tissue support and prevented edema, but this tissue is actually weak and sometimes absent. The lymphatic system's NEGATIVE PRESSURE is the primary mechanism.",options:["Elastic fibers","Connective tissue","Muscle fascia","Scar tissue"],correct:1,explanation:"CT was thought to provide support; lymphatic negative pressure is key."},
{q:256,text:"The pressure in interstitial fluid is:",options:["Above atmospheric pressure","Equal to atmospheric pressure","Well below atmospheric pressure (negative)","Fluctuating with body position"],correct:2,explanation:"Interstitial pressure is negative (below atmospheric)."},
{q:257,text:"The thoracic duct collects lymph from:",options:["Only the lower extremities","Only the thorax","Esophagus, pericardium, intercostal spaces, diaphragm, and everything except the right upper quadrant","Only abdominal organs"],correct:2,explanation:"Thoracic duct drains most of body except right upper quadrant."},
{q:258,text:"The thoracic duct is also known as:",options:["The right lymphatic trunk","The left lymphatic trunk","The mediastinal lymphatic trunk","The cisterna chyli"],correct:1,explanation:"Thoracic duct is also called left lymphatic trunk."},
{q:259,text:"The thoracic duct empties into:",options:["The right atrium directly","The superior vena cava","The junction where the left subclavian and left internal jugular veins meet the SVC","The azygos vein"],correct:2,explanation:"Thoracic duct empties into left venous angle."},
{q:260,text:"The right lymphatic trunk drains lymph from:",options:["The entire right side of the body","The upper right quadrant (right arm, right head/neck, some right trunk)","Only the right lower extremity","The right side of the thorax only"],correct:1,explanation:"Right lymphatic duct drains right upper quadrant only."},
{q:261,text:"The right lymphatic trunk empties into:",options:["The left venous angle","The superior vena cava","The right atrium","The junction of the right subclavian and internal jugular veins (right venous angle)"],correct:3,explanation:"Right lymphatic duct empties into right venous angle."},
{q:262,text:"The cisterna chyli is best described as:",options:["A lymph node group","A large dilated sac of the inferior thoracic duct found in the abdominal cavity","The upper end of the thoracic duct","A valve within the thoracic duct"],correct:1,explanation:"Cisterna chyli is dilated thoracic duct sac in abdomen."},
{q:263,text:"The cisterna chyli collects lymph from:",options:["Only the thorax","The gastrointestinal tract and pelvic cavity","Only the liver","The kidneys and adrenal glands exclusively"],correct:1,explanation:"Cisterna chyli collects lymph from GIT and pelvis."},
{q:264,text:"Embryologically, the cisterna chyli is clinically significant because:",options:["It is prone to malignancy","Surgical damage during abdominal procedures can cause chylothorax if the thoracic duct is involved","It produces lymphocytes","It is the origin of the portal vein"],correct:1,explanation:"Abdominal surgery can damage cisterna chyli → chylothorax."},
{q:265,text:"Terminal lymph capillaries are compared to blood capillaries as:",options:["Less permeable than blood capillaries","Equally permeable to blood capillaries","MORE permeable than blood capillaries","Impermeable to large molecules"],correct:2,explanation:"Lymph capillaries are more permeable than blood capillaries."},
{q:266,text:"Of the blood attempting to enter the venous system, what fraction instead enters lymphatic capillaries?",options:["1/2 (50%)","1/5 (20%)","1/10 (10%)","1/20 (5%)"],correct:2,explanation:"About 10% of filtered fluid enters lymphatics instead of venules."},
{q:267,text:"Anchoring filaments in terminal lymph capillaries:",options:["Prevent fluid from entering the capillary","Attach endothelial cells to the surrounding extracellular matrix, helping to maintain the capillary structure","Produce lymphatic fluid","Filter large proteins"],correct:1,explanation:"Anchoring filaments attach capillary to ECM."},
{q:268,text:"The overlapping edges of endothelial cells in terminal lymph capillaries function as:",options:["A filtration barrier","One-way valves that allow interstitial fluid entry but prevent backflow","A pump for lymph propulsion","Anchoring sites for connective tissue"],correct:1,explanation:"Cell overlaps form one-way valves in lymph capillaries."},
{q:269,text:"Lymph valves ensure that:",options:["Lymph flows in only one direction (from interstitial space into lymphatic, not backward)","Lymph does not enter the blood","Lymph only flows during exercise","Bacteria cannot enter lymphatics"],correct:0,explanation:"Lymph valves ensure unidirectional flow."},
{q:270,text:"The valve mechanism in terminal lymph capillaries is provided by:",options:["Muscular sphincters","Overlapping endothelial cell edges that create one-way valves","Fibrous tissue barriers","Lymph node filtration"],correct:1,explanation:"Overlapping cell edges create lymph capillary valves."},
{q:271,text:"Lymphatic valves prevent backflow because:",options:["They are one-way structures","When interstitial pressure increases, the valve opens; when lymphatic pressure exceeds interstitial pressure, the valve closes","They actively pump lymph forward","They trap bacteria"],correct:1,explanation:"Pressure gradient differences drive valve opening/closing."},
{q:272,text:"In a resting human, lymph flows at approximately:",options:["12 mL/hr","120 mL/hr","1200 mL/hr","2400 mL/hr"],correct:1,explanation:"Resting lymph flow is about 120 mL/hr."},
{q:273,text:"During exercise, lymph flow can increase by:",options:["2-3 fold","5-7 fold","10-30 fold (due to intrinsic lymph pump and muscle contraction)","50+ fold"],correct:2,explanation:"Exercise increases lymph flow 10-30 fold."},
{q:274,text:"The intrinsic lymph pump is activated during:",options:["Sleep","Rest and relaxation","Exercise, when skeletal muscle contractions help propel lymph","Fasting"],correct:2,explanation:"Exercise activates intrinsic lymph pump."},
{q:275,text:"Extrinsic pressures that can increase lymph flow include ALL of the following EXCEPT:",options:["Compression socks","Skeletal muscle contraction","Arterial pulses","Decreased body movement"],correct:3,explanation:"Decreased movement reduces lymph flow (not increases it)."},
{q:276,text:"Post-exercise, the body benefits from increased lymphatic flow because:",options:["Increased lymph absorption allows better nutrient uptake for anabolism (muscle building)","It prevents muscle soreness","It reduces caloric expenditure","It eliminates the need for protein synthesis"],correct:0,explanation:"Post-exercise lymph flow aids nutrient absorption for muscle building."},
{q:277,text:"Approximately what fraction of lymph is derived from the intestines?",options:["1/4 (25%)","1/2 (50%)","2/3 (67%)","9/10 (90%)"],correct:2,explanation:"About 2/3 of lymph comes from the intestines."},
{q:278,text:"The lymphatic system is the major route for absorption of which nutrient from the gastrointestinal tract?",options:["Glucose","Amino acids","Fats (lipids)","Water and electrolytes"],correct:2,explanation:"Lymphatics are major route for fat absorption."},
{q:279,text:"Why do fats preferentially enter the lymphatic system rather than blood capillaries?",options:["Fats are too large and hydrophobic to enter blood capillaries directly; they are absorbed into chylomicrons and transported via lacteals (lymphatic capillaries)","The intestinal blood supply is insufficient","Fats are toxic to blood","The liver cannot process fats from blood"],correct:0,explanation:"Large, hydrophobic fats enter lymphatics as chylomicrons."},
{q:280,text:"Lacteals are:",options:["Specialized lymphatic capillaries in intestinal villi that absorb dietary fats","Bacterial colonization sites","Intestinal glands","Fat-degrading enzymes"],correct:0,explanation:"Lacteals are lymphatic capillaries in intestinal villi."},
{q:281,text:"Edema results from:",options:["Excessive blood pressure alone","Loss of negative pressure in interstitial fluid, leading to excess fluid accumulation","Excessive protein intake","Lymph overproduction"],correct:1,explanation:"Edema = loss of negative pressure in interstitium."},
{q:282,text:"Which of the following causes loss of negative pressure in interstitial fluid leading to edema?",options:["Prolonged sitting","Dehydration","Excessive salt intake","Pregnancy and certain medications","All of the above"],correct:4,explanation:"All these can disrupt negative pressure → edema."},
{q:283,text:"In a patient who sits for an extended period, interstitial fluid negative pressure is lost because:",options:["The lymphatic system stops working","Lack of muscle contractions reduces lymph flow and interstitial fluid clearance","Blood pressure increases dramatically","Gravity pulls fluid upward"],correct:1,explanation:"Immobility reduces lymph pump activity."},
{q:284,text:"Pregnancy-related edema is caused by:",options:["Excessive water retention alone","Hormonal changes and increased blood volume that can disrupt interstitial fluid pressure homeostasis","Kidney failure","Heart disease"],correct:1,explanation:"Pregnancy hormones/volume disrupts interstitial pressure balance."},
{q:285,text:"Certain medications can cause edema by:",options:["Directly destroying lymph nodes","Causing vasodilation that increases capillary filtration and disrupts interstitial fluid pressure balance","Preventing all lymph flow","Increasing plasma protein concentration"],correct:1,explanation:"Medications cause vasodilation → increased filtration → edema."},
{q:286,text:"Dehydration-induced edema seems paradoxical but occurs because:",options:["Dehydration has no effect on edema","Severe dehydration activates compensatory mechanisms (increased aldosterone) that cause salt/water retention and disrupt interstitial fluid pressure","The kidneys stop filtering","Lymph production increases"],correct:1,explanation:"Severe dehydration activates aldosterone → fluid retention."},
{q:287,text:"Lymphedema is characterized by:",options:["Decreased interstitial fluid volume","Chronic swelling due to lymphatic vessel obstruction or lymph node removal/damage preventing normal drainage","Temporary swelling that resolves quickly","Only affects the lower extremities"],correct:1,explanation:"Lymphedema = chronic swelling from impaired drainage."},
{q:288,text:"Causes of lymphedema include:",options:["Cancer treatment (lymph node dissection/removal)","Lymph node damage from infection or trauma","Congenital lymphatic abnormalities","All of the above"],correct:3,explanation:"Multiple causes of lymphedema exist."},
{q:289,text:"Elephantiasis is a severe form of lymphedema caused by:",options:["Genetic factors alone","Minor lymphatic obstruction","Severely damaged or dysfunctional lymph nodes causing massive edema, fibrosis, and skin thickening","Excessive exercise"],correct:2,explanation:"Elephantiasis = severe lymphedema with massive swelling/fibrosis."},
{q:290,text:"Elephantiasis is endemic in certain regions worldwide due to:",options:["Genetic predisposition","Parasitic infection (filarial nematodes) that damages lymphatic vessels and nodes","High altitude","Salt deficiency"],correct:1,explanation:"Filarial parasites cause endemic elephantiasis."},
{q:291,text:"The pathophysiology of elephantiasis involves:",options:["Loss of interstitial fluid negative pressure","Chronic inflammation and fibrosis from impaired lymphatic drainage","Thickening and hardening of skin and subcutaneous tissue","All of the above"],correct:3,explanation:"Elephantiasis involves all these pathophysiologic changes."},
{q:292,text:"Patients with elephantiasis can develop secondary complications including:",options:["Skin infections (cellulitis) due to impaired immune function from reduced lymph flow","Lymphangitis (inflammation of lymphatic vessels)","Functional disability from severe swelling","All of the above"],correct:3,explanation:"Elephantiasis causes multiple complications."},
{q:293,text:"Large bacteria entering the lymphatic system are:",options:["Carried directly to the bloodstream","Destroyed by tissue macrophages and lymphoid cells within lymph nodes","Encapsulated and become harmless","Not affected by lymph flow"],correct:1,explanation:"Lymph nodes trap and destroy pathogens."},
{q:294,text:"The role of lymph nodes in bacterial clearance is to:",options:["Physically filter bacteria","House tissue macrophages and immune cells that destroy pathogens","Produce antibiotics","Seal off infection sites"],correct:1,explanation:"Nodes house immune cells that destroy pathogens."},
{q:295,text:"If lymph nodes are overwhelmed or damaged, the consequence is:",options:["Increased systemic infection risk due to reduced pathogen filtering","Enhanced immune function","Automatic bacterial clearance by blood","No significant consequence"],correct:0,explanation:"Damaged nodes = increased infection risk."},
{q:296,text:"The lymphatic system controls interstitial fluid protein concentration by:",options:["Preventing all proteins from entering interstitial space","Draining excess protein-rich fluid back to the bloodstream, maintaining proper protein balance","Producing proteins locally","Filtering proteins in lymph nodes permanently"],correct:1,explanation:"Lymphatics drain excess protein to maintain balance."},
{q:297,text:"If interstitial fluid protein concentration becomes too high:",options:["Water is drawn into interstitial space by osmotic pressure, causing edema","The fluid becomes too viscous to move","Proteins crystallize","The lymphatic system ceases to function"],correct:0,explanation:"High protein = osmotic edema."},
{q:298,text:"Malnutrition or liver disease (decreased plasma protein production) can cause edema because:",options:["Lymph nodes stop working","Lower plasma protein concentration reduces osmotic pressure, allowing fluid to accumulate in interstitial space despite normal lymphatic function","Lymph production increases","Capillary permeability increases"],correct:1,explanation:"Low plasma protein = loss of osmotic pressure → edema."},
{q:299,text:"The lymphatic system maintains tissue health by:",options:["Keeping interstitial fluid volume controlled through the negative pressure mechanism","Removing excess protein and particulate matter","Providing immune surveillance via lymph nodes","All of the above"],correct:3,explanation:"Lymphatics maintain health through multiple mechanisms."},
{q:300,text:"A patient develops lower extremity edema after prolonged air travel. The primary mechanism is:",options:["Dehydration","Immobility → reduced skeletal muscle contraction → decreased intrinsic lymph pump activity → fluid accumulation in tissues","Decreased blood pressure","Kidney dysfunction"],correct:1,explanation:"Immobility impairs lymph pump → edema."},
{q:301,text:"The interdependence of blood and lymphatic systems is demonstrated by:",options:["Lymph drains back into venous circulation at specific sites (venous angles)","The lymphatic system is essential for maintaining proper interstitial fluid environment for blood exchange","Failure of either system affects tissue perfusion and health","All of the above"],correct:3,explanation:"Blood and lymphatic systems are interdependent."}
