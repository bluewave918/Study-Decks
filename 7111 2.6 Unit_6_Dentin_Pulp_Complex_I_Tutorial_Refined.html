const DATA=[{"section":"Anatomy and composition","q":"Which tissue is the mineralized protective component of a tooth?","options":["Enamel","Dentin","Pulp","Cementum"],"correct":[0],"explanation":"Enamel protects the crown; dentin provides structural support and pulp is the principal cellular component.","type":"single"},{"section":"Anatomy and composition","q":"Which tissue is the main mineralized structural component of a tooth?","options":["Dentin","Enamel","Pulp","Reduced enamel epithelium"],"correct":[0],"explanation":"Dentin makes up most of the tooth and supports functional loading.","type":"single"},{"section":"Anatomy and composition","q":"Which tissue is the main cellular component of the dentin–pulp complex?","options":["Pulp","Enamel","Cementum","Mantle dentin"],"correct":[0],"explanation":"The pulp contains the cells and vascular support of the complex.","type":"single"},{"section":"Anatomy and composition","q":"Which tooth component is avital, unlike dentin with cellular projections?","options":["Enamel","Dentin","Pulp","Odontoblast layer"],"correct":[0],"explanation":"Enamel is avital; dentin contains odontoblast processes in tubules.","type":"single"},{"section":"Anatomy and composition","q":"Which tissue is dentin most analogous to in composition?","options":["Bone","Enamel","Epidermis","Cartilage"],"correct":[0],"explanation":"Both dentin and bone have collagen-rich organic matrices and hydroxyapatite mineral.","type":"single"},{"section":"Anatomy and composition","q":"What covers coronal dentin?","options":["Enamel","Cementum","Pulp","Periodontal ligament"],"correct":[0],"explanation":"Enamel covers the crown; cementum covers root dentin.","type":"single"},{"section":"Anatomy and composition","q":"What covers root dentin?","options":["Cementum","Enamel","Pulp","Reduced enamel epithelium"],"correct":[0],"explanation":"Cementum is the external covering of root dentin.","type":"single"},{"section":"Anatomy and composition","q":"What is dentin composition by weight?","options":["70% inorganic, 20% organic, 10% water","45% inorganic, 33% organic, 22% water","96% inorganic, 1% organic, 3% water","50% inorganic, 30% organic, 20% water"],"correct":[0],"explanation":"The lecture gives 70/20/10 by weight; 45/33/22 is the volume breakdown.","type":"single"},{"section":"Anatomy and composition","q":"What is dentin composition by volume, according to the lecture?","options":["45% inorganic, 33% organic, 22% water","70% inorganic, 20% organic, 10% water","85% inorganic, 12% water, 3% organic","60% inorganic, 20% organic, 20% water"],"correct":[0],"explanation":"The slide distinguishes percentages by volume from percentages by weight.","type":"single"},{"section":"Anatomy and composition","q":"Where is much of the physiological fluid in dentin located?","options":["Within dentinal tubules","Inside enamel rods","Inside cementocytes","Within ameloblast nuclei"],"correct":[0],"explanation":"Dentin water is physiological fluid, largely within the tubule system.","type":"single"},{"section":"Anatomy and composition","q":"Which mineral makes up most of the inorganic portion of dentin?","options":["Hydroxyapatite","Collagen type I","Amelogenin","Osteocalcin"],"correct":[0],"explanation":"Dentin and enamel both contain hydroxyapatite, although their organic matrices differ.","type":"single"},{"section":"Anatomy and composition","q":"Which formula represents the hydroxyapatite unit given in lecture?","options":["Ca₅(PO₄)₃(OH), multiplied by 2","CaCO₃, multiplied by 2","Ca₃(PO₄)₂ without hydroxyl","Ca₅(PO₄)₃F without substitution"],"correct":[0],"explanation":"The lecture writes Ca5(PO4)3(OH) × 2 per unit cell.","type":"single"},{"section":"Anatomy and composition","q":"Fluoride incorporation into hydroxyapatite primarily replaces which ion?","options":["Hydroxyl (OH⁻)","Phosphate (PO₄³⁻)","Calcium (Ca²⁺)","Magnesium (Mg²⁺)"],"correct":[0],"explanation":"Fluoride can substitute for hydroxyl, yielding fluorapatite.","type":"single"},{"section":"Anatomy and composition","q":"What are the approximate dimensions of dentin hydroxyapatite plate crystals?","options":["60–70 nm long, 20–30 nm wide, 3–4 nm thick","60–70 nm wide, 25–30 nm thick, millimeters long","20 µm long, 3 µm wide, 4 µm thick","4–5 nm long, 60–70 nm wide, 20–30 nm thick"],"correct":[0],"explanation":"Dentin crystals are small rectangular plates, unlike the long ribbon-like enamel crystals.","type":"single"},{"section":"Anatomy and composition","q":"Which is the correct order of increasing hardness?","options":["Cortical bone → dentin → enamel","Enamel → dentin → cortical bone","Dentin → cortical bone → enamel","Cortical bone → enamel → dentin"],"correct":[0],"explanation":"The lecture gives Knoop hardness values of approximately 50, 68, and 343 respectively.","type":"single"},{"section":"Anatomy and composition","q":"Which approximate Knoop hardness value belongs to dentin?","options":["68","343","50","15"],"correct":[0],"explanation":"The slide compares dentin 68, enamel 343, and cortical bone 50.","type":"single"},{"section":"Anatomy and composition","q":"What structural characteristic is particularly important to dentin mechanics?","options":["Its dentinal tubule organization","Enamel prism sheaths","Ameloblast terminal bars","Pulpal keratin layers"],"correct":[0],"explanation":"Dentin tubule organization contributes to distribution of loading stresses.","type":"single"},{"section":"Organic matrix and DSPP","q":"Approximately what percentage of dentin organic material is collagen?","options":["90%","10%","50%","20%"],"correct":[0],"explanation":"Most dentin organic matrix is fibrillar collagen, especially type I.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which collagen predominates in dentin?","options":["Type I","Type IV","Type II","Type VII"],"correct":[0],"explanation":"Type I predominates, with some type III and type V.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which minor collagen types also occur in dentin?","options":["Types III and V","Types II and IV","Types IV and VII","Types VI and X"],"correct":[0],"explanation":"The lecture specifies mainly type I collagen, with smaller amounts of III and V.","type":"single"},{"section":"Organic matrix and DSPP","q":"What is the main structural function of dentin collagen?","options":["Scaffold for hydroxyapatite deposition","Prevents all tubule mineralization","Produces enamel rod sheaths","Seals the oral epithelium"],"correct":[0],"explanation":"Collagen fibrils form a matrix on which mineral crystals are laid down.","type":"single"},{"section":"Organic matrix and DSPP","q":"Approximately how much of the organic component is noncollagenous protein?","options":["10%","90%","70%","45%"],"correct":[0],"explanation":"The organic fraction is about 90% collagen and 10% noncollagenous proteins.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which protein is shared with bone rather than categorized as dentin-specific in the lecture?","options":["Osteopontin","Dentin sialophosphoprotein","Dentin matrix protein-1","Dentin phosphoprotein"],"correct":[0],"explanation":"Osteopontin is among the bone-associated noncollagenous matrix proteins.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which group contains only bone-associated proteins listed for dentin?","options":["Osteopontin, osteocalcin, osteonectin","Amelogenin, enamelin, ameloblastin","DSP, DPP, DG","KLK4, MMP20, amelotin"],"correct":[0],"explanation":"The lecture lists several osteo-named proteins among shared bone/dentin components.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which two proteins are presented as relatively dentin-specific?","options":["DMP-1 and DSPP","Amelogenin and enamelin","Osteopontin and osteocalcin","Amelotin and ODAM"],"correct":[0],"explanation":"DMP-1 and DSPP are enriched in dentin, though also present in bone at much lower levels.","type":"single"},{"section":"Organic matrix and DSPP","q":"How does the lecture compare dentin-specific protein abundance in bone?","options":["Approximately 1/400 as abundant in bone","Approximately equal in bone and dentin","Approximately 400 times greater in bone","Entirely absent from bone"],"correct":[0],"explanation":"These proteins are not absolutely exclusive to dentin.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which enzyme rapidly cleaves DSPP?","options":["BMP-1","MMP20","KLK4","Alkaline phosphatase"],"correct":[0],"explanation":"The lecture identifies BMP-1 as responsible for rapid DSPP cleavage.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which products result from DSPP cleavage?","options":["DSP, DG, and DPP","DSP, enamelin, and amelotin","DMP-1, osteocalcin, and collagen","BMP-1, KLK4, and MMP20"],"correct":[0],"explanation":"DSPP yields dentin sialoprotein, dentin glycoprotein, and dentin phosphoprotein.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which DSPP fragment comes from the N-terminus?","options":["Dentin sialoprotein (DSP)","Dentin phosphoprotein (DPP)","Dentin glycoprotein (DG)","Dentin matrix protein-1 (DMP-1)"],"correct":[0],"explanation":"DSP corresponds to the N-terminal part of DSPP.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which DSPP fragment corresponds to the middle region?","options":["Dentin glycoprotein (DG)","Dentin phosphoprotein (DPP)","Dentin sialoprotein (DSP)","Bone sialoprotein (BSP)"],"correct":[0],"explanation":"The lecture diagram places DG between DSP and DPP.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which DSPP fragment comes from the C-terminus?","options":["Dentin phosphoprotein (DPP)","Dentin sialoprotein (DSP)","Dentin glycoprotein (DG)","Dentin matrix protein-1 (DMP-1)"],"correct":[0],"explanation":"DPP derives from the C-terminal region of DSPP.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which DSPP product attaches to collagen and binds Ca²⁺ to initiate hydroxyapatite?","options":["Dentin phosphoprotein (DPP)","Dentin sialoprotein (DSP)","Dentin glycoprotein (DG)","Osteonectin (ON)"],"correct":[0],"explanation":"DPP binds abundant calcium and promotes mineral initiation on collagen.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which DSPP fragment is a proteoglycan in dentinal tubules that may inhibit mineralization?","options":["Dentin sialoprotein (DSP)","Dentin phosphoprotein (DPP)","Dentin glycoprotein (DG)","Osteocalcin (OC)"],"correct":[0],"explanation":"DSP is expressed in tubules and may prevent mineralization there.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which DSPP fragment has a poorly understood potential role in biomineralization?","options":["Dentin glycoprotein (DG)","Dentin phosphoprotein (DPP)","Dentin sialoprotein (DSP)","Collagen type III"],"correct":[0],"explanation":"The lecture describes DG as a glycoprotein with uncertain function.","type":"single"},{"section":"Organic matrix and DSPP","q":"DSP is described as similar to which other matrix protein?","options":["DMP-1","Amelogenin","Enamelin","KLK4"],"correct":[0],"explanation":"The lecture notes DSP resembles dentin matrix protein-1.","type":"single"},{"section":"Organic matrix and DSPP","q":"Which 3 of these are DSPP cleavage products?","options":["Dentin sialoprotein","Dentin phosphoprotein","Dentin glycoprotein","Ameloblastin"],"correct":[0,1,2],"explanation":"DSP, DPP, and DG are DSPP fragments; ameloblastin is an enamel protein.","type":"sata"},{"section":"Organic matrix and DSPP","q":"Which 2 are characteristic of dentin rather than enamel?","options":["Type I collagen scaffold","Odontoblast processes in tubules","Ameloblast-derived rod sheaths","Mature enamel without collagen"],"correct":[0,1],"explanation":"Dentin contains collagen and odontoblast processes; enamel rods and acellularity are enamel properties.","type":"sata"},{"section":"Organic matrix and DSPP","q":"A DSPP processing defect reduces DPP activity in developing dentin. Which downstream change best explains impaired dentin mineralization?","options":["Reduced calcium binding and hydroxyapatite initiation along collagen","Excess enamel rod secretion by mature ameloblasts","Loss of the periodontal ligament's principal collagen bundles","Premature closure of all dentinal tubules by peritubular dentin"],"correct":[0],"explanation":"In the lecture, BMP-1 cleaves DSPP into DSP, DGP, and DPP. DPP associates with collagen and binds calcium to promote hydroxyapatite formation in dentin.","type":"single"},{"section":"Dentinogenesis imperfecta","q":"Which dentinogenesis imperfecta type is associated with osteogenesis imperfecta?","options":["Type I","Type II","Type III","All types equally"],"correct":[0],"explanation":"Type I is associated with defective type I collagen and osteogenesis imperfecta.","type":"single"},{"section":"Dentinogenesis imperfecta","q":"What is the underlying defect linked to dentinogenesis imperfecta type I?","options":["Type I collagen defect","DSPP defect without OI","Failure of amelogenin expression","Defective enamelin secretion"],"correct":[0],"explanation":"Type I occurs in the setting of osteogenesis imperfecta, a collagen I disorder.","type":"single"},{"section":"Dentinogenesis imperfecta","q":"Which type has abnormal dentin filling pulp chambers but is NOT associated with osteogenesis imperfecta?","options":["Type II","Type I","Type III","None of the types"],"correct":[0],"explanation":"Type II is linked to defective DSPP, with abnormal dentin filling pulp spaces.","type":"single"},{"section":"Dentinogenesis imperfecta","q":"Which type is characterized by enlarged pulp chambers and hypomineralization?","options":["Type III","Type I","Type II","Type I and II equally"],"correct":[0],"explanation":"Type III is associated with enlarged pulps and possible failure of DSPP expression.","type":"single"},{"section":"Dentinogenesis imperfecta","q":"Which dentinogenesis imperfecta types are associated with DSPP defects?","options":["Types II and III","Types I and II","Types I and III","Type I only"],"correct":[0],"explanation":"The lecture distinguishes DSPP-related types II and III from collagen I-related type I.","type":"single"},{"section":"Dentinogenesis imperfecta","q":"A patient has fragile bones and abnormal dentin filling pulp chambers. Which lecture association fits?","options":["Dentinogenesis imperfecta type I","Dentinogenesis imperfecta type III","DSPP defect without osteogenesis imperfecta","Enamel hypoplasia from ameloblast detachment"],"correct":[0],"explanation":"Fragile bones suggest osteogenesis imperfecta, associated with type I dentinogenesis imperfecta.","type":"single"},{"section":"Dentinogenesis imperfecta","q":"A tooth has enlarged pulp chambers and poorly mineralized dentin. Which type is most consistent?","options":["Dentinogenesis imperfecta type III","Dentinogenesis imperfecta type II","Dentinogenesis imperfecta type I","Normal secondary dentin"],"correct":[0],"explanation":"Type III is distinguished by enlarged pulp chambers and hypomineralization.","type":"single"},{"section":"Odontoblasts and development","q":"Which cells synthesize dentin?","options":["Odontoblasts","Ameloblasts","Cementoblasts","Osteoclasts"],"correct":[0],"explanation":"Odontoblasts line the pulp and secrete the dentin matrix.","type":"single"},{"section":"Odontoblasts and development","q":"Where are odontoblast cell bodies found?","options":["Along the pulp chamber periphery","Inside enamel prisms","In the oral epithelium","Throughout the enamel layer"],"correct":[0],"explanation":"Odontoblasts form a polarized layer at the pulp–dentin boundary.","type":"single"},{"section":"Odontoblasts and development","q":"What embryologic tissue gives rise to the dentin–pulp complex?","options":["Dental papilla","Dental follicle","Outer enamel epithelium","Reduced enamel epithelium"],"correct":[0],"explanation":"The dental papilla differentiates into pulp and odontoblasts.","type":"single"},{"section":"Odontoblasts and development","q":"What is the embryologic origin of odontoblasts?","options":["Neural crest-derived mesenchyme","Oral ectodermal epithelium","Endodermal epithelium","Mesodermal skeletal muscle"],"correct":[0],"explanation":"Odontoblasts derive from ectomesenchyme of neural crest origin.","type":"single"},{"section":"Odontoblasts and development","q":"What initiates early coronal odontoblast differentiation?","options":["Interaction with the inner enamel epithelium","Interaction with oral keratinocytes","Stimulation by mature cementum","Fusion with reduced enamel epithelium"],"correct":[0],"explanation":"IEE–dental papilla interaction is critical for initial odontoblast differentiation.","type":"single"},{"section":"Odontoblasts and development","q":"Where do differentiating odontoblasts develop relative to the IEE?","options":["In the intervening acellular zone","Inside the stratum intermedium","Within mature enamel rods","Within the oral sulcular epithelium"],"correct":[0],"explanation":"Odontoblasts differentiate in the region between the IEE and dental papilla.","type":"single"},{"section":"Odontoblasts and development","q":"Where does vascular support for developing dentin originate?","options":["Dental papilla","Mature enamel","Stratum intermedium","Outer enamel epithelium"],"correct":[0],"explanation":"The dental papilla supplies the vascular support.","type":"single"},{"section":"Odontoblasts and development","q":"What characterizes odontoblast polarity?","options":["A cell body at pulp edge with a projection extending into dentin","A nucleus embedded in enamel and no projections","Multiple nuclei inside the enamel organ","A cell body located in cementum"],"correct":[0],"explanation":"Odontoblasts retain processes within dentinal tubules.","type":"single"},{"section":"Odontoblasts and development","q":"What is an odontoblast process called in this lecture?","options":["Tomes’ fiber","Ameloblast Tomes’ process","Von Korff’s fiber","Hunter–Schreger band"],"correct":[0],"explanation":"The lecture explicitly distinguishes odontoblast Tomes’ fibers from ameloblast Tomes’ processes.","type":"single"},{"section":"Odontoblasts and development","q":"Which structure is associated with every Tomes’ fiber?","options":["A dentinal tubule","An enamel rod","A cementum lacuna","A pulp stone"],"correct":[0],"explanation":"Odontoblast projections run in dentinal tubules.","type":"single"},{"section":"Odontoblasts and development","q":"What is the initial unmineralized matrix secreted by odontoblasts?","options":["Predentin","Mature enamel","Secondary cementum","Interrod enamel"],"correct":[0],"explanation":"Predentin is the organic dentin matrix before mineralization.","type":"single"},{"section":"Odontoblasts and development","q":"What remains adjacent to odontoblasts throughout life?","options":["A layer of predentin","A layer of mature enamel","A continuous reduced enamel epithelium","An unmineralized cementum cap"],"correct":[0],"explanation":"Odontoblasts continue depositing predentin, although the rate slows.","type":"single"},{"section":"Odontoblasts and development","q":"Which cells secrete the matrix vesicles that initiate dentin mineralization?","options":["Odontoblasts","Ameloblasts","Epithelial rests of Malassez","Pulp fibroblasts exclusively"],"correct":[0],"explanation":"The lecture describes odontoblast-secreted vesicles in initial dentin mineralization.","type":"single"},{"section":"DEJ and mantle dentin","q":"What does DEJ stand for?","options":["Dentinoenamel junction","Dentin epithelial junction","Dental epithelial junction","Dentinal extracellular junction"],"correct":[0],"explanation":"The DEJ is the direct interface of dentin and enamel.","type":"single"},{"section":"DEJ and mantle dentin","q":"What is the characteristic shape of the DEJ?","options":["Scalloped","Perfectly flat","Uniformly cylindrical","Parallel straight bands"],"correct":[0],"explanation":"Scalloping increases interlocking surface area.","type":"single"},{"section":"DEJ and mantle dentin","q":"Why is the scalloped DEJ mechanically important?","options":["It resists shearing between enamel and dentin","It allows enamel cells to migrate into pulp","It prevents dentin from forming tubules","It eliminates all mineral interfaces"],"correct":[0],"explanation":"Scallops help retain enamel on dentin under loading.","type":"single"},{"section":"DEJ and mantle dentin","q":"What developmental feature is partly defined by the shape of the DEJ?","options":["Crown shape","Root canal diameter alone","Gingival attachment depth","Pulp vascular origin"],"correct":[0],"explanation":"The DEJ outlines the underlying form of the crown.","type":"single"},{"section":"DEJ and mantle dentin","q":"What contributes to mineral interlocking at the DEJ ridges?","options":["Limited merging of enamel and dentin hydroxyapatite crystals","Collagen IV bridging enamel rods","Fibroblast nuclei embedded in enamel","Cementum forming a layer between them"],"correct":[0],"explanation":"The lecture describes slight HA crystal merging within DEJ ridges.","type":"single"},{"section":"DEJ and mantle dentin","q":"What is the first dentin formed next to the DEJ?","options":["Mantle dentin","Secondary dentin","Tertiary dentin","Circumpulpal dentin"],"correct":[0],"explanation":"Mantle dentin is the initial thin outermost dentin layer.","type":"single"},{"section":"DEJ and mantle dentin","q":"Approximately how thick is mantle dentin?","options":["20 µm","200 µm","2 mm","4 µm"],"correct":[0],"explanation":"Mantle dentin is a thin layer approximately 20 micrometers thick.","type":"single"},{"section":"DEJ and mantle dentin","q":"What are von Korff’s fibers primarily made of?","options":["Type III collagen associated with fibronectin","Type IV collagen associated with amelogenin","Type II collagen associated with enamelin","Type I collagen associated with keratin"],"correct":[0],"explanation":"The lecture describes von Korff’s fibers as collagen III fibrils associated with fibronectin.","type":"single"},{"section":"DEJ and mantle dentin","q":"Which approximate diameter is given for von Korff’s collagen fibrils?","options":["0.1–0.2 µm","3–4 nm","20 µm","60–70 µm"],"correct":[0],"explanation":"Von Korff’s fibrils are about 0.1–0.2 micrometers in diameter.","type":"single"},{"section":"DEJ and mantle dentin","q":"Where do von Korff’s fibers extend during mantle dentin formation?","options":["Toward the inner enamel epithelium","Toward the root apex only","Into the oral sulcus","Through mature pulp vessels"],"correct":[0],"explanation":"They extend toward the IEE and contribute to the developing DEJ matrix.","type":"single"},{"section":"DEJ and mantle dentin","q":"What produces enamel spindles during development?","options":["Odontoblast processes penetrating the IEE/DEJ region","Ameloblast processes entering pulp","Pulp blood vessels entering enamel","Cementoblasts crossing the crown"],"correct":[0],"explanation":"Enamel spindles are associated with odontoblast projections entering forming enamel.","type":"single"},{"section":"DEJ and mantle dentin","q":"Which direction do odontoblasts move while producing dentin matrix?","options":["Away from the DEJ, toward the pulp","Toward the outer enamel surface","Parallel to the oral epithelium","Into the stratum intermedium"],"correct":[0],"explanation":"Dentin formation proceeds inward as odontoblasts retreat pulpally.","type":"single"},{"section":"DEJ and mantle dentin","q":"Where does initial dentin mineralization begin?","options":["Within odontoblast-secreted matrix vesicles near the future DEJ","Within enamel rod sheaths at the surface","Inside the pulp vascular lumen","Within mature cementum lacunae"],"correct":[0],"explanation":"The lecture places initial seed mineral crystals in matrix vesicles near the future DEJ.","type":"single"},{"section":"DEJ and mantle dentin","q":"What happens when mineralized matrix vesicles rupture?","options":["They release mineral crystals into the matrix","They generate enamel rod sheaths","They dissolve all collagen fibrils","They transform into odontoblast nuclei"],"correct":[0],"explanation":"Released mineral crystals seed matrix mineralization.","type":"single"},{"section":"DEJ and mantle dentin","q":"What does globular dentin mineralization describe?","options":["Localized spherical mineralized areas that grow and merge","A continuous flat advancing mineral front","A complete absence of mineral nuclei","Selective mineralization only within tubules"],"correct":[0],"explanation":"The lecture compares globular mineralization to water balloons hitting a wall.","type":"single"},{"section":"DEJ and mantle dentin","q":"What does linear dentin mineralization describe?","options":["A continuous advancing layer of mineralization","Separate isolated spheres that never merge","Mineralization restricted to enamel","Crystals confined to pulp vessels"],"correct":[0],"explanation":"The lecture likens linear mineralization to a paint roller.","type":"single"},{"section":"DEJ and mantle dentin","q":"What is the initial structural organization of mantle dentin in the lecture?","options":["Initially nontubular","Initially fully tubular","Made entirely of enamel rods","Composed of pulp epithelial cells"],"correct":[0],"explanation":"Early mantle dentin is described as nontubular before organized tubular primary dentin forms.","type":"single"},{"section":"DEJ and mantle dentin","q":"What helps regulate later tubular dentin formation?","options":["Noncollagenous matrix proteins","Mature ameloblast Tomes’ processes","Oral epithelial keratin","Salivary proteins alone"],"correct":[0],"explanation":"Noncollagenous proteins regulate the transition to organized tubular primary dentin.","type":"single"},{"section":"DEJ and mantle dentin","q":"What dentin begins forming after mantle dentin at the DEJ?","options":["Circumpulpal dentin","Tertiary dentin","Secondary cementum","Enamel cuticle"],"correct":[0],"explanation":"Circumpulpal dentin forms around the pulp after the initial mantle layer.","type":"single"},{"section":"Root and dentin types","q":"Which structure initiates root odontoblast differentiation?","options":["Hertwig’s epithelial root sheath (HERS)","Inner enamel epithelium of the crown","Reduced enamel epithelium","Stratum intermedium"],"correct":[0],"explanation":"HERS induces odontoblast differentiation in developing roots.","type":"single"},{"section":"Root and dentin types","q":"What does HERS eventually break into?","options":["Epithelial rests of Malassez","Enamel spindles","Hunter–Schreger bands","Von Korff’s fibers"],"correct":[0],"explanation":"The epithelial root sheath fragments into rests of Malassez.","type":"single"},{"section":"Root and dentin types","q":"Which feature can differ in root dentin formation compared with crown dentin?","options":["Some mixing of dentin and cementum collagen","No odontoblast differentiation","No mineralized matrix","Root dentin made of enamelin"],"correct":[0],"explanation":"The lecture notes similar mechanisms but anatomical differences, including collagen mingling.","type":"single"},{"section":"Root and dentin types","q":"Which dentin is included in primary dentin?","options":["Mantle dentin plus initial circumpulpal dentin","Secondary dentin plus tertiary dentin","Only predentin after eruption","Only root dentin formed after maturity"],"correct":[0],"explanation":"Primary dentin includes mantle and the first circumpulpal dentin.","type":"single"},{"section":"Root and dentin types","q":"Which dentin is produced after root formation and continues throughout life?","options":["Secondary dentin","Mantle dentin","Primary circumpulpal dentin","Predentin only"],"correct":[0],"explanation":"Secondary dentin is tubular and deposited throughout life after root formation.","type":"single"},{"section":"Root and dentin types","q":"How does secondary dentin relate to primary dentin?","options":["Continuous with it but histologically distinguishable","Separated by an enamel layer","Unconnected and always atubular","Present only at the DEJ"],"correct":[0],"explanation":"Secondary dentin continues from primary dentin yet is histologically distinct.","type":"single"},{"section":"Root and dentin types","q":"How do coronal dentin tubules generally curve?","options":["Sigmoidal (S-shaped)","Completely straight","Circular around the crown","Irregularly absent"],"correct":[0],"explanation":"Coronal dentin tubules follow a sigmoid path.","type":"single"},{"section":"Root and dentin types","q":"How do root dentin tubules compare with coronal tubules?","options":["They are much straighter","They are more sigmoidal","They are completely absent","They contain enamel rods"],"correct":[0],"explanation":"Root tubules are relatively straight compared with coronal tubules.","type":"single"},{"section":"Root and dentin types","q":"Where does secondary dentin accumulate more heavily in the pulp chamber?","options":["Roof and floor","Only at the DEJ","Only along the cementoenamel junction","Only at incisal edges"],"correct":[0],"explanation":"Preferential deposition at roof and floor contributes to pulp chamber recession.","type":"single"},{"section":"Root and dentin types","q":"What is the result of lifelong secondary dentin deposition?","options":["Gradual reduction in pulp chamber space","Progressive enlargement of pulp horns","Regeneration of lost enamel","Elimination of the dentin–pulp interface"],"correct":[0],"explanation":"Secondary dentin accumulates and reduces pulp chamber size.","type":"single"},{"section":"Root and dentin types","q":"Which term describes nonmineralized dentin matrix next to odontoblasts?","options":["Predentin","Mantle enamel","Tertiary cementum","Enamel cuticle"],"correct":[0],"explanation":"Predentin is histologically distinct from mineralized dentin.","type":"single"},{"section":"Root and dentin types","q":"Which dentin forms in response to trauma or other insult?","options":["Tertiary dentin","Primary mantle dentin","Primary circumpulpal dentin","Normal secondary dentin"],"correct":[0],"explanation":"Tertiary dentin is induced by injury or insult.","type":"single"},{"section":"Root and dentin types","q":"How are tubules typically organized in tertiary dentin?","options":["Often absent or disordered","Always more regular than primary dentin","Always identical to root dentin","Always perfectly sigmoidal"],"correct":[0],"explanation":"Tertiary dentin may be atubular or contain irregular tubules.","type":"single"},{"section":"Root and dentin types","q":"What is one protective function of tertiary dentin?","options":["Sealing dentinal tubules after insult","Replacing lost enamel rods","Creating the enamel cuticle","Increasing crown height by eruption"],"correct":[0],"explanation":"Tertiary dentin may seal tubules or form dentin bridges.","type":"single"},{"section":"Root and dentin types","q":"What distinguishes reactionary tertiary dentin?","options":["Original odontoblasts survive the insult","Original odontoblasts are destroyed","Ameloblasts replace odontoblasts","HERS begins secreting enamel"],"correct":[0],"explanation":"Reactionary dentin forms when odontoblasts remain intact.","type":"single"},{"section":"Root and dentin types","q":"What distinguishes reparative tertiary dentin?","options":["Damaged odontoblasts are replaced through mesenchymal recruitment and differentiation","Original odontoblasts remain entirely unharmed","Ameloblasts secrete the replacement dentin","Enamel spindles mineralize the pulp"],"correct":[0],"explanation":"Reparative dentin involves newly differentiated odontoblast-like cells after original cell damage.","type":"single"},{"section":"Root and dentin types","q":"A restoration injures dentin but leaves odontoblasts alive. What response is expected?","options":["Reactionary tertiary dentin","Reparative tertiary dentin","New mantle dentin at the DEJ","New enamel secretion"],"correct":[0],"explanation":"Surviving odontoblasts produce reactionary dentin.","type":"single"},{"section":"Root and dentin types","q":"A deep injury kills odontoblasts and pulp mesenchymal cells differentiate into replacements. What forms?","options":["Reparative tertiary dentin","Reactionary tertiary dentin","Normal mantle dentin","Interrod enamel"],"correct":[0],"explanation":"Reparative dentin follows odontoblast death and replacement.","type":"single"},{"section":"Root and dentin types","q":"How does the lecture describe protein expression in reparative dentin?","options":["Less DSP/DMP-1, more BSP/osteopontin","More DSP/DMP-1, less BSP/osteopontin","Only amelogenin and enamelin","No noncollagenous proteins"],"correct":[0],"explanation":"Reparative dentin shifts toward lower DSP/DMP-1 and higher BSP/OP.","type":"single"},{"section":"Root and dentin types","q":"What may tertiary dentin form between dentin and restorative material?","options":["A dentin bridge","An enamel rod","A periodontal ligament","A cementoenamel junction"],"correct":[0],"explanation":"Tertiary dentin can form a bridge after restorative treatment or trauma.","type":"single"},{"section":"Root and dentin types","q":"Which 3 of these statements about dentin types are correct?","options":["Primary dentin includes mantle and initial circumpulpal dentin","Secondary dentin continues forming after root development","Tertiary dentin forms in response to insult","Predentin is the fully mineralized outer enamel"],"correct":[0,1,2],"explanation":"Predentin is unmineralized dentin matrix, not enamel.","type":"sata"},{"section":"Root and dentin types","q":"Which 2 statements correctly describe tertiary dentin?","options":["Reactionary dentin can form with surviving odontoblasts","Reparative dentin requires replacement cells after odontoblast injury","All tertiary dentin has orderly sigmoid tubules","Tertiary dentin is formed exclusively before eruption"],"correct":[0,1],"explanation":"Reactionary and reparative differ by survival of original odontoblasts; tertiary dentin can be disordered and forms in response to insult.","type":"sata"},{"section":"Root and dentin types","q":"Two teeth sustain comparable deep dentin injuries. In tooth A the original odontoblasts survive; in tooth B they die and pulp-derived cells replace them. Which paired response is expected?","options":["A: reactionary dentin; B: reparative dentin","A: reparative dentin; B: reactionary dentin","A: secondary dentin; B: mantle dentin","A: interglobular dentin; B: primary dentin"],"correct":[0],"explanation":"Surviving odontoblasts produce reactionary tertiary dentin; when they are lost, newly differentiated odontoblast-like cells produce reparative tertiary dentin.","type":"single"}];

DATA.push(...[{"section": "Histology image identification", "q": "Which dentin type is outlined by the red markings in this histology image?", "options": ["Tertiary dentin", "Primary dentin", "Secondary dentin", "Predentin"], "correct": [0], "explanation": "The red-marked region is tertiary dentin, which appears discontinuous and disordered compared with nearby normal dentin.", "type": "single", "imageKey": "tertiary"}, {"section": "Histology image identification", "q": "Which observation best distinguishes the red-marked dentin from adjacent normal dentin?", "options": ["It contains a scalloped enamel junction", "Its structure is irregular and discontinuous", "It is an unmineralized layer beside pulp", "It is organized into uniform sigmoid tubules"], "correct": [1], "explanation": "The annotated tertiary dentin has an irregular, discontinuous structure.", "type": "single", "imageKey": "tertiary"}, {"section": "Histology image identification", "q": "What does the white-highlighted region represent in this section?", "options": ["Tertiary dentin", "Enamel", "Secondary dentin", "Predentin"], "correct": [2], "explanation": "The white-highlighted area adjacent to the pulp is secondary dentin; blue marks primary dentin.", "type": "single", "imageKey": "secondary"}, {"section": "Histology image identification", "q": "What is indicated by the blue-highlighted region?", "options": ["Odontoblast layer", "Pulp tissue", "Secondary dentin", "Primary dentin"], "correct": [3], "explanation": "The blue-highlighted region is primary dentin. The white region is secondary dentin.", "type": "single", "imageKey": "secondary"}, {"section": "Histology image identification", "q": "Which tissue is marked by the yellow boundary in this annotated image?", "options": ["Odontoblast layer", "Predentin", "Dentin", "Pulp"], "correct": [0], "explanation": "Yellow outlines the odontoblast layer, located between pulp and predentin.", "type": "single", "imageKey": "layers"}, {"section": "Histology image identification", "q": "Which tissue is outlined in white in this annotated image?", "options": ["Pulp", "Predentin", "Dentin", "Enamel"], "correct": [1], "explanation": "White outlines predentin; green denotes dentin and pink denotes pulp.", "type": "single", "imageKey": "layers"}, {"section": "Histology image identification", "q": "Which tissue occupies the pink-outlined central region?", "options": ["Dentin", "Predentin", "Pulp", "Enamel"], "correct": [2], "explanation": "The central pink-outlined region is pulp.", "type": "single", "imageKey": "layers"}, {"section": "Histology image identification", "q": "What feature is circled in red at the interface of the two tissues?", "options": ["Dentin tubules", "Enamel spindles", "Granular layer of Tomes", "Scalloped dentinoenamel junction"], "correct": [3], "explanation": "The red outline marks the scalloped dentinoenamel junction (DEJ), between enamel and dentin.", "type": "single", "imageKey": "dej"}] );
let mode='ordered',deck=[],index=0,selected=[],answered=false,score=0;
const el=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const initialCard=el('card').innerHTML;function reset(){if(!el('question'))el('card').innerHTML=initialCard;index=0;selected=[];answered=false;score=0;deck=DATA.map(q=>({...q,options:q.options.slice(),correct:q.correct.slice()}));if(mode==='shuffled')shuffle(deck);deck.forEach(q=>{const order=shuffle([0,1,2,3]);q.options=order.map(i=>q.options[i]);q.correct=q.correct.map(i=>order.indexOf(i));});render();}
function render(){if(index>=deck.length){el('card').innerHTML='<div class="done"><h2>Deck complete!</h2><p>You answered '+score+' of '+deck.length+' correctly.</p><button class="action primary" onclick="reset()">Restart deck</button></div>';return;}let q=deck[index];selected=[];answered=false;el('section').textContent=q.section+(q.type==='sata'?' · Select all that apply':' · Single answer');el('progress').textContent=(index+1)+' / '+deck.length;el('fill').style.width=((index+1)/deck.length*100)+'%';el('question').textContent=q.q;const histo=el('histo-image');histo.innerHTML='';if(q.imageKey){const im=document.createElement('img');im.src=HISTO_IMAGES[q.imageKey];im.alt='Annotated dental histology';im.style.cssText='max-width:100%;max-height:520px;object-fit:contain;border-radius:10px;display:block;margin:12px auto';histo.appendChild(im);}el('choices').innerHTML='';q.options.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML='<span class="letter">'+('ABCD'[i])+'</span><span class="answer"></span>';b.querySelector('.answer').textContent=v;b.onclick=()=>pick(i);el('choices').appendChild(b)});el('feedback').className='feedback';el('feedback').textContent='';el('submit').style.display=q.type==='sata'?'inline-block':'none';el('submit').disabled=true;el('next').style.display='none';el('help').textContent=q.type==='sata'?'Select '+q.correct.length+' choices using 1–4; press 5 to submit.':'Press 1–4 to select and immediately submit.';}
function pick(i){if(answered){next();return;}const q=deck[index];if(q.type==='single'){selected=[i];submit();return;}selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];Array.from(el('choices').children).forEach((b,j)=>b.classList.toggle('selected',selected.includes(j)));el('submit').disabled=selected.length!==q.correct.length;}
function submit(){if(answered)return;const q=deck[index];if(q.type==='sata'&&selected.length!==q.correct.length)return;answered=true;const good=selected.length===q.correct.length&&selected.every(i=>q.correct.includes(i));if(good)score++;Array.from(el('choices').children).forEach((b,i)=>{b.disabled=true;if(q.correct.includes(i))b.classList.add('correct');else if(selected.includes(i))b.classList.add('wrong')});el('feedback').textContent=(good?'✓ Correct. ':'✗ Not quite. ')+q.explanation+' Correct answer'+(q.correct.length>1?'s':'')+': '+q.correct.map(i=>q.options[i]).join('; ')+'.';el('feedback').className='feedback show';el('submit').style.display='none';el('next').style.display='inline-block';el('help').textContent='Press any number 1–4, Enter, or Space to continue.';}
function next(){if(!answered)return;index++;render();}
el('submit').onclick=submit;el('next').onclick=next;el('ordered').onclick=()=>{mode='ordered';el('ordered').classList.add('active');el('shuffled').classList.remove('active');reset()};el('shuffled').onclick=()=>{mode='shuffled';el('shuffled').classList.add('active');el('ordered').classList.remove('active');reset()};el('reset').onclick=reset;
document.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey)return;if(['1','2','3','4'].includes(e.key)){e.preventDefault();if(answered)next();else pick(Number(e.key)-1);}else if(e.key==='5'){if(!answered&&deck[index]?.type==='sata'){e.preventDefault();submit();}}else if(e.key==='Enter'||e.key===' '){if(answered){e.preventDefault();next();}else if(e.key==='Enter'&&deck[index]?.type==='sata'){e.preventDefault();submit();}}});reset();
</script></body></html>
