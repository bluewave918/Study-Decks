<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7125 exam 1 high yield concepts</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#101827;color:#edf2fc;margin:0;padding:24px}main{max-width:790px;margin:auto}.panel{background:#1b283b;border:1px solid #35455e;border-radius:18px;padding:24px;margin-top:16px}h1{font-size:1.8rem}button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid #64748b;padding:12px;background:#263750;color:white}button:hover{background:#345171}button:disabled{opacity:.45;cursor:default}.choice{display:block;text-align:left;width:100%;margin:10px 0;padding:16px}.correct{background:#13543f!important;border-color:#39d59a}.wrong{background:#673039!important;border-color:#f58b91}.bar{height:8px;background:#35455e;border-radius:9px;overflow:hidden}.fill{height:100%;background:#65a8ff;width:0}nav{display:flex;flex-wrap:wrap;gap:9px}small,.muted{color:#b4c3d8}#feedback{line-height:1.55}label{display:inline-flex;align-items:center;gap:6px}#q{font-size:1.22rem;line-height:1.5}#summary{display:none}select{background:#263750;color:white;padding:10px;border-radius:9px}kbd{background:#35455e;padding:2px 6px;border-radius:5px}</style></head><body><main><h1>7125 exam 1 high yield concepts</h1><p class="muted">42 high-yield concept and application questions · Source-aligned study deck</p><nav><button id="mode">📖 Ordered learning mode</button><button id="reset">Reset deck</button><label><input type="checkbox" id="explain" checked> Show explanations</label></nav><section class="panel" id="quiz"><div id="counter"></div><div class="bar"><div class="fill" id="fill"></div></div><p id="q"></p><div id="choices"></div><div id="feedback" aria-live="polite"></div><nav><button id="prev">← Previous</button><button id="next" disabled>Next →</button></nav><p class="muted"><small>Press <kbd>1</kbd>–<kbd>4</kbd> to answer immediately; no Enter required. After answering, press any number to advance.</small></p></section><section class="panel" id="summary"><h2>Deck complete!</h2><p id="score"></p><button id="again">Restart</button></section></main><script>const DATA=[{"q": "A contact area moves cervically. What happens to the incisal embrasure?", "o": ["It becomes larger", "The CEJ moves incisally", "It disappears", "It becomes smaller"], "a": 0, "e": "More cervical contact increases the space toward the incisal edge."}, {"q": "Which maxillary anterior incisal embrasure is largest?", "o": ["All are equal", "Lateral incisor–canine", "Central–lateral", "Central–central"], "a": 1, "e": "Incisal embrasures increase in size moving away from the midline."}, {"q": "Which four embrasures surround a proximal contact?", "o": ["Buccal, mesial, pulp, apical", "Mesial, distal, apical, incisal", "Facial, lingual, incisal/occlusal, cervical", "Facial, distal, root, cervical"], "a": 2, "e": "Adjacent crowns diverge in these four directions from contact."}, {"q": "An open contact repeatedly traps food. What tissue is especially at risk?", "o": ["Pulp horn", "Root dentin", "Cingulum", "Interdental gingival papilla"], "a": 3, "e": "Open contacts can promote food impaction and gingival inflammation."}, {"q": "What is the functional role of embrasures during mastication?", "o": ["Provide food spillways and help protect gingiva", "Prevent any food movement", "Eliminate proximal contacts", "Retain food between meals"], "a": 0, "e": "Proper embrasures channel food and support gingival health."}, {"q": "Which incisor has mesial and distal contacts at approximately the same incisal level?", "o": ["Maxillary canine", "Mandibular central incisor", "Maxillary lateral incisor", "Maxillary central incisor"], "a": 1, "e": "Mandibular central incisors are relatively symmetrical."}, {"q": "What defines the anatomical crown?", "o": ["Only the incisal third", "The part containing pulp", "Enamel coverage ending at the CEJ", "Visible portion above gingiva"], "a": 2, "e": "The anatomical crown is fixed by enamel; clinical crown varies with gingival position."}, {"q": "Which proximal surface generally shows greater CEJ curvature?", "o": ["Distal", "Facial", "Both always equal", "Mesial"], "a": 3, "e": "Mesial cervical-line curvature is usually greater than distal."}, {"q": "What is the cervical ridge?", "o": ["Convexity near the cervical third of the crown", "A ridge inside the pulp chamber", "The incisal contact point", "A groove dividing root lobes"], "a": 0, "e": "The cervical ridge describes a crown bulge near the cervical region."}, {"q": "How do free gingiva and gingival margin differ?", "o": ["Both are synonyms", "Free gingiva is tissue; gingival margin is its coronal edge", "Margin is the whole attached gingiva", "Free gingiva is enamel"], "a": 1, "e": "A tissue zone and its boundary are not identical."}, {"q": "What are typical anterior crown outlines from facial and proximal views?", "o": ["Triangular facially; square proximally", "Square facially; circular proximally", "Trapezoidal facially; triangular proximally", "Round facially; trapezoidal proximally"], "a": 2, "e": "View-dependent geometry is a classic identification clue."}, {"q": "Which crown is generally wider mesiodistally?", "o": ["Mandibular canine compared with all incisors", "Maxillary canine compared with central incisor", "They are always equal", "Maxillary central incisor compared with maxillary canine"], "a": 3, "e": "Maxillary central incisors have greater mesiodistal crown dimensions than maxillary canines."}, {"q": "A maxillary incisor measures about 6.5 mm mesiodistally. Most likely which?", "o": ["Maxillary lateral incisor", "Maxillary central incisor", "Maxillary canine", "Mandibular canine"], "a": 0, "e": "The supplied average for the maxillary lateral incisor is 6.5 mm."}, {"q": "Which maxillary incisors can have greater mesiodistal than faciolingual dimensions?", "o": ["Only lateral incisors", "Both central and lateral incisors", "Only central incisors", "Neither"], "a": 1, "e": "Both were identified in the practice-test material."}, {"q": "Why is side identification of mandibular central incisors difficult?", "o": ["Their distal contacts are always cervical", "They have prominent cusp tips", "Their crowns are relatively symmetrical", "They always have two roots"], "a": 2, "e": "Mesial and distal contact levels and contours are similar."}, {"q": "Which permanent incisors commonly have proximal root depressions?", "o": ["All maxillary incisors exclusively", "Maxillary lateral incisors only", "Maxillary central incisors only", "Mandibular central and lateral incisors"], "a": 3, "e": "Longitudinal proximal root depressions are typical clues for mandibular incisors."}, {"q": "A very long anterior tooth has a single cusp. Which class?", "o": ["Canine", "Incisor", "Molar", "Premolar"], "a": 0, "e": "Canines are the longest teeth and have a prominent cusp."}, {"q": "Which mandibular canine crown outline is nearly continuous with the root?", "o": ["Incisal", "Mesial", "Lingual cusp ridge", "Distal"], "a": 1, "e": "The mesial outline is relatively straight and follows the long axis."}, {"q": "Which anterior tooth is most likely to have a bifurcated root?", "o": ["Maxillary central incisor", "Mandibular central incisor", "Mandibular canine", "Maxillary lateral incisor"], "a": 2, "e": "An occasional mandibular canine bifurcation produces labial and lingual roots."}, {"q": "Viewed mesially, what is the maxillary canine crown shape?", "o": ["Rectangular with flat edge", "Circular with cusp at center", "Trapezoidal with two cusps", "Wedge-shaped with cusp tip at the point"], "a": 3, "e": "The proximal silhouette is wedge-shaped."}, {"q": "A groove separates primary crown parts. What is it?", "o": ["Developmental groove", "Supplemental groove", "Cervical ridge", "Root canal"], "a": 0, "e": "Developmental grooves mark junctions between primary developmental portions."}, {"q": "What does the anterior tooth cingulum represent developmentally?", "o": ["A root bifurcation", "Lingual developmental lobe", "An enamel defect", "An occlusal triangular ridge"], "a": 1, "e": "The cingulum is the lingual lobe of an anterior tooth."}, {"q": "Three rounded elevations on a newly erupted incisor are called:", "o": ["Pulp horns", "Cingula", "Mamelons", "Transverse ridges"], "a": 2, "e": "Mamelons reflect the three facial developmental lobes."}, {"q": "A ridge extends from a posterior cusp tip toward the center. Identify it.", "o": ["Cingulum", "Marginal groove", "Cervical ridge", "Triangular ridge"], "a": 3, "e": "Triangular ridges descend from cusp tips toward central occlusal areas."}, {"q": "Two opposing triangular ridges unite. What forms?", "o": ["Transverse ridge", "Point angle", "Cervical ridge", "Mamelon"], "a": 0, "e": "Their union across the occlusal surface is a transverse ridge."}, {"q": "Which tooth tissue supplies nerves and blood vessels?", "o": ["Alveolar bone", "Pulp", "Cementum", "Enamel"], "a": 1, "e": "The pulp contains the tooth neurovascular supply."}, {"q": "Which structure lies between root cementum and alveolar bone?", "o": ["Pulp chamber", "Dentin", "Periodontal ligament", "Enamel"], "a": 2, "e": "The PDL suspends and anchors the tooth within its socket."}, {"q": "How is a pulp horn different from a root canal?", "o": ["Root canal is outside cementum", "Both occur only in enamel", "Pulp horn is in alveolar bone", "Pulp horn extends coronally; root canal traverses root"], "a": 3, "e": "Both are pulp-space components in different anatomical regions."}, {"q": "What is the permanent dental formula per quadrant?", "o": ["2 incisors, 1 canine, 2 premolars, 3 molars", "2 incisors, 1 canine, 3 premolars, 2 molars", "2 incisors, 1 canine, 0 premolars, 2 molars", "1 incisor, 2 canines, 2 premolars, 3 molars"], "a": 0, "e": "Eight teeth per quadrant yields 32 permanent teeth."}, {"q": "What is the FDI designation for permanent mandibular right second premolar?", "o": ["35", "45", "29", "44"], "a": 1, "e": "Quadrant 4 is mandibular right; position 5 is second premolar."}, {"q": "Which erupts earlier according to the supplied ages?", "o": ["Mandibular canine (9–10 years)", "Both at 11–12 years", "Mandibular central incisor (6–7 years)", "Both at 9–10 years"], "a": 2, "e": "Mandibular central incisors erupt before mandibular canines."}, {"q": "Which structure marks the midline of the hard palate?", "o": ["Cingulum", "Lingual frenum", "Alveolus", "Palatine raphe"], "a": 3, "e": "The palatine raphe is the midline landmark."}, {"q": "Three tooth surfaces meet at a single location. What forms?", "o": ["Point angle", "Contact area", "Line angle", "Transverse ridge"], "a": 0, "e": "A point angle joins three surfaces; a line angle joins two."}, {"q": "Which tooth is particularly associated with a palatoradicular groove?", "o": ["Maxillary first molar", "Maxillary lateral incisor", "Mandibular canine", "Mandibular central incisor"], "a": 1, "e": "Palatogingival/palatoradicular grooves commonly affect maxillary lateral incisors."}, {"q": "What papillae form a V-shaped pattern on the posterior dorsal tongue?", "o": ["Fungiform papillae", "Interdental papillae", "Circumvallate papillae", "Filiform papillae"], "a": 2, "e": "Circumvallate papillae form a characteristic V-shaped arrangement."}, {"q": "When using a PKT1 over an alcohol flame, what should be heated?", "o": ["Only the extreme tip", "Only the handle", "The wax block directly", "Shank of the instrument"], "a": 3, "e": "The practice test specifies heating the shank for proper wax pickup and delivery."}, {"q": "A patient has gingival recession exposing root. Which crown increases in apparent size?", "o": ["Clinical crown", "Enamel crown", "Neither", "Anatomical crown"], "a": 0, "e": "Clinical crown is the visible portion and changes with gingival position."}, {"q": "A groove is faint and does not separate lobes. Classify it.", "o": ["Transverse ridge", "Supplemental groove", "Developmental groove", "Palatine raphe"], "a": 1, "e": "Supplemental grooves do not mark primary developmental junctions."}, {"q": "Which primary dental formula applies per quadrant?", "o": ["1 incisor, 1 canine, 3 molars", "2 incisors, 1 canine, 2 premolars, 3 molars", "2 incisors, 1 canine, 2 molars", "2 incisors, 2 canines, 1 molar"], "a": 2, "e": "Five teeth per quadrant means 20 primary teeth."}, {"q": "Which notation identifies mandibular right second premolar in Universal system?", "o": ["20", "45", "28", "29"], "a": 3, "e": "Universal #29 corresponds to FDI 45."}, {"q": "What is the sequence moving outward from the interior of a root?", "o": ["Pulp → dentin → cementum → PDL → alveolar bone", "Pulp → enamel → PDL → cementum → bone", "Dentin → pulp → cementum → bone → PDL", "Pulp → cementum → dentin → PDL → bone"], "a": 0, "e": "This sequence distinguishes tooth tissues and supporting structures."}, {"q": "Which maxillary incisal embrasure is smallest?", "o": ["Between lateral incisor and canine", "Between the two central incisors", "Between central and lateral incisor", "All are equally large"], "a": 1, "e": "Central–central contacts are most incisal and form the smallest incisal embrasure."}];let shuffled=false,order=[],idx=0,answers={};const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){order=DATA.map((_,i)=>i);if(shuffled)shuffle(order);idx=0;answers={};$('quiz').style.display='block';$('summary').style.display='none';render()}function render(){let id=order[idx],d=DATA[id],sel=answers[id];$('counter').textContent=`Question ${idx+1} of ${DATA.length} · ${Object.keys(answers).length} answered`;$('fill').style.width=`${(idx+1)/DATA.length*100}%`;$('q').textContent=d.q;$('choices').replaceChildren();d.o.forEach((s,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${i+1}. ${s}`;if(sel!==undefined){b.disabled=true;if(i===d.a)b.classList.add('correct');else if(i===sel)b.classList.add('wrong')}b.onclick=()=>answer(i);$('choices').append(b)});$('feedback').textContent=sel===undefined?'':`${sel===d.a?'✓ Correct':'✗ Incorrect'} — ${$('explain').checked?d.e:''}`;$('prev').disabled=idx===0;$('next').disabled=sel===undefined;$('next').textContent=idx===DATA.length-1?'See results':'Next →'}function answer(i){let id=order[idx];if(answers[id]!==undefined)return;answers[id]=i;render()}function next(){if(answers[order[idx]]===undefined)return;if(idx===DATA.length-1){$('quiz').style.display='none';$('summary').style.display='block';let correct=order.filter(i=>answers[i]===DATA[i].a).length;$('score').textContent=`${correct} / ${DATA.length} correct (${Math.round(correct/DATA.length*100)}%).`;return}idx++;render()}$('next').onclick=next;$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('reset').onclick=reset;$('again').onclick=reset;$('mode').onclick=()=>{shuffled=!shuffled;$('mode').textContent=shuffled?'🔀 Shuffled testing mode':'📖 Ordered learning mode';reset()};$('explain').onchange=render;document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(['1','2','3','4'].includes(e.key)){if($('quiz').style.display==='none')return;if(answers[order[idx]]===undefined)answer(Number(e.key)-1);else next()}else if((e.key==='Enter'||e.key===' ')&&answers[order[idx]]!==undefined&&$('quiz').style.display!=='none'){e.preventDefault();next()}});reset();</script></body></html>
