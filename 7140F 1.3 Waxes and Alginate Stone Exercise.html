 stone to 30 mL water", "30 g stone to 30 mL water"], "answer": 2, "explanations": ["This reverses the quantities and makes a much wetter mixture.", "This uses too much water relative to the slide instruction.", "Pages 29 and 32 specify 100 grams of stone with 30 mL of water.", "Both quantities differ from the prescribed mix."]}, {"topic": "1.5 — Stone preparation", "q": "How should the scale be prepared before weighing stone in a disposable cup?", "options": ["Weigh the empty cup and subtract mentally after mixing", "Put water on the scale first", "Leave the scale set to ounces", "Set grams, place the empty cup on the scale, and reset/tare to zero"], "answer": 3, "explanations": ["The lecture specifically directs taring rather than relying on mental subtraction.", "Water is measured separately in a graduated cylinder.", "The scale must be set to grams for the specified 100 g.", "The calibration slide shows the empty cup on the scale and the reset/tare step before adding stone."]}, {"topic": "1.5 — Stone preparation", "q": "Which sequence correctly begins the stone mixing procedure?", "options": ["Stone into tube first, then trim", "Stone into dry bowl, then add alginate", "Water into bowl first, then add stone to the water", "Mix powder dry for several minutes"], "answer": 2, "explanations": ["The plastic tube is for the alginate specimen.", "Alginate is not combined with stone in this exercise.", "The lecture shows water placed in the mixing bowl first, followed by stone added to the water.", "Stone needs water to hydrate and form a mix."]}, {"topic": "1.5 — Stone preparation", "q": "What should you do after adding stone powder to the water?", "options": ["Leave the powder floating without stirring", "Immediately trim the liquid mix", "Wet all of the stone, then mix similarly to alginate", "Add wax fragments to accelerate setting"], "answer": 2, "explanations": ["Unwetted powder produces an incomplete mixture.", "Liquid stone must first set before trimming.", "Pag const el=id=>document.getElementById(id);function start(shuffle=false,review=false){reviewMode=review;mode=shuffle?'shuffled':'ordered';order=review?[...missed]:QUESTIONS.map((_,i)=>i);if(shuffle)for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;results={};render()}

s(results).length} answered this round · ${missed.size} flagged for review`;el('back').disabled=idx===0}
function choose(k){if(!order.length||idx>=order.length)return;let id=order[idx];if(results[id]!==undefined){advance();return}results[id]=k;if(k!==QUESTIONS[id].answer)missed.add(id);else if(reviewMode)missed.delete(id);render()}
