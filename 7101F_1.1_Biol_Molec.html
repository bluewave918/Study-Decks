    <script>
        // =====================================================================

        // =====================================================================

        const questionsBase = [
            // SECTION 1: CATABOLISM/ANABOLISM/CONDENSATION
            {
                question: "What is the primary difference between catabolism and anabolism?",
                options: [
                    "Catabolism breaks down macromolecules to release energy; anabolism uses energy to build macromolecules",
                    "Catabolism occurs in mitochondria; anabolism occurs in cytoplasm",
                    "Catabolism creates ATP; anabolism consumes it directly",
                    "Catabolism requires energy; anabolism releases energy"
                ],
                correct: 0,
                explanation: "This is the foundational distinction—catabolism = breaking down (releasing energy), anabolism = building up (using energy). Catabolic pathways like glycolysis and β-oxidation release ATP; anabolic pathways like protein synthesis and fatty acid synthesis consume ATP. Understanding this split explains why cells have dual metabolic machinery."
            },
            {
                question: "When water is lost during polymer formation, what type of reaction is occurring?",
                options: [
                    "Hydrolysis",
                    "Condensation (dehydration synthesis)",
                    "Decarboxylation",
                    "Oxidation-reduction"
                ],
                correct: 1,
                explanation: "Condensation (dehydration synthesis) is how ALL polymers form—water is always the leaving group. This happens in peptide bond formation (amino acids → proteins), glycosidic bonds (monosaccharides → polysaccharides), and phosphodiester bonds (nucleotides → nucleic acids). The reverse is hydrolysis, which breaks these bonds by adding water."
            },
            {
                question: "Which carbon in an amino acid is chiral and serves as the central anchor point?",
                options: [
                    "The alpha carbon",
                    "The side chain carbon",
                    "The carbonyl carbon",
                    "The amino group carbon"
                ],
                correct: 0,
                explanation: "The alpha (α) carbon is THE central atom of every amino acid. It's bonded to four different groups: an amino group, a carboxyl group, a hydrogen, and a side chain (R group). This makes it chiral, which is why amino acids come in L and D forms. All amino acid chemistry revolves around reactions at this carbon."
            },
            {
                question: "Why is the alpha carbon of an amino acid considered \"amphoteric\"?",
                options: [
                    "It has two chiral centers",
                    "It can act as either an acid or a base",
                    "It forms disulfide bonds",
                    "It contains both polar and nonpolar regions"
                ],
                correct: 1,
                explanation: "Amphoteric means it can act as BOTH an acid (donating H⁺ from the carboxyl group) AND a base (accepting H⁺ at the amino group). This is why the same amino acid can have different charges at different pH values—the alpha carbon's functional groups ionize/deionize depending on pH. This is crucial for understanding isoelectric points and how amino acids behave in buffers."
            },
            {
                question: "At the isoelectric point, what is the net charge on an amino acid?",
                options: [
                    "Strongly positive",
                    "Variable depending on the solvent",
                    "Neutral (zero)",
                    "Strongly negative"
                ],
                correct: 2,
                explanation: "The isoelectric point (pI) is where the number of positive charges equals the number of negative charges, resulting in zero net charge. At this specific pH, the amino acid doesn't migrate in an electric field. This concept matters clinically and is essential for protein purification techniques like isoelectric focusing."
            },
            {
                question: "The zwitter ionic form of an amino acid contains which ionized groups?",
                options: [
                    "Both amino and carboxyl groups are neutral",
                    "Amino group is NH₃⁺ and carboxyl group is COO⁻",
                    "Both groups are negatively charged",
                    "Amino group is NH₂⁻ and carboxyl group is COOH"
                ],
                correct: 1,
                explanation: "A zwitter ion has BOTH charged groups simultaneously: NH₃⁺ (protonated amino group) and COO⁻ (deprotonated carboxyl group). This is the dominant form of amino acids in physiological conditions (pH ~7). The name comes from German 'zwitter' (hybrid/double). This is why amino acids are zwitterionic in cells, not neutral molecules with -NH₂ and -COOH."
            },
            {
                question: "What does pKa represent, and how does it relate to acid strength?",
                options: [
                    "The pH at which an acid is fully ionized; higher pKa = stronger acid",
                    "The concentration of hydrogen ions in solution",
                    "The isoelectric point of the molecule",
                    "The dissociation constant that measures acid strength; lower pKa = stronger acid"
                ],
                correct: 3,
                explanation: "Lower pKa = stronger acid. This is because pKa = -log(Ka), so smaller Ka (weaker acid) → larger pKa, and larger Ka (stronger acid) → smaller pKa. For amino acids: the carboxyl group has pKa ~2.2 (strong acid), the amino group has pKa ~9-10 (weak acid). Memorize: pKa is INVERSE to strength."
            },
            {
                question: "When pKa = pH in a buffer system, what fraction of the ionizable groups have donated their hydrogen ions?",
                options: [
                    "About half (~50%)",
                    "About three-quarters (~75%)",
                    "None of them (0%)",
                    "All of them (~100%)"
                ],
                correct: 0,
                explanation: "When pH = pKa, the ratio of deprotonated to protonated form is 1:1 (half and half). This comes from the Henderson-Hasselbalch equation. This is the MOST effective buffer point because small pH changes don't shift the equilibrium much. For amino acids, maximum buffering occurs near the pKa values of carboxyl (~2.2) and amino (~9.6) groups."
            },
            {
                question: "An amino acid that is \"water-soluble\" and has \"uneven electron distribution\" would be classified as:",
                options: [
                    "Aliphatic",
                    "Polar and hydrophilic",
                    "Amphipathic",
                    "Nonpolar and hydrophobic"
                ],
                correct: 1,
                explanation: "Polar amino acids have uneven electron distribution (electronegative atoms like O, N creating dipoles) and are thus hydrophilic (water-loving). Examples: Ser, Thr, Asn, Gln. These residues can hydrogen bond with water, making them thermodynamically favorable on protein surfaces. Understanding polarity predicts where amino acids locate in folded proteins."
            },
            {
                question: "Which of the following best describes an \"amphipathic\" molecule?",
                options: [
                    "It has a straight or branched chain structure",
                    "It has both positive and negative charges simultaneously",
                    "It contains both polar and nonpolar regions",
                    "It cannot dissolve in water"
                ],
                correct: 2,
                explanation: "Amphipathic = 'both-loving' (amphi = both, pathic = loving). Think phospholipid bilayers: the fatty acid tails are nonpolar, the phosphate head is polar. This dual nature is why they organize into membranes. In proteins, amphipathic α-helices have polar residues on one face and nonpolar on the other, allowing them to sit at membrane-water interfaces."
            },
            {
                question: "An amino acid with a \"straight or branched chain structure\" in its side chain is best described as:",
                options: [
                    "Hydrophobic",
                    "Amphipathic",
                    "Amphoteric",
                    "Aliphatic"
                ],
                correct: 3,
                explanation: "Aliphatic = straight or branched chain structure. These are simple hydrocarbon-like side chains (Ala, Val, Leu, Ile, Pro). They're nonpolar and hydrophobic, so they cluster in protein interiors away from water. Aliphatic residues are especially important in hydrophobic cores of globular proteins and in creating extended, fiber-like structures of collagen."
            },
            {
                question: "Why would a polar amino acid be more likely found on the surface of a folded globular protein?",
                options: [
                    "Polar amino acids have strong affinity for water in the aqueous environment",
                    "Polar amino acids cannot form peptide bonds",
                    "Polar amino acids are larger and need more space",
                    "Polar amino acids are more stable at the surface"
                ],
                correct: 0,
                explanation: "Polar amino acids are thermodynamically favored at the surface because they can form hydrogen bonds with water. Nonpolar residues are buried inside because water would have to reorganize around them (entropic penalty). This hydrophobic effect is one of the strongest driving forces in protein folding. Prediction: if you see a polar residue buried deep in a crystal structure, something unusual is happening (maybe an active site)."
            },
            {
                question: "Which amino acid is found exclusively in proteins, and in what isomeric form?",
                options: [
                    "D-glycine (dextro isomer)",
                    "L-amino acids (levo isomers)",
                    "Only achiral amino acids",
                    "Racemic mixture of L and D isomers"
                ],
                correct: 1,
                explanation: "Only L-amino acids (levo = left-handed in Fischer projection) are incorporated into proteins during ribosomal translation. D-amino acids DO exist in nature (some antibiotics, bacterial cell walls) but NOT in eukaryotic proteins. This stereochemical specificity is enforced by the ribosomal machinery and tRNA synthetases during protein synthesis."
            },
            {
                question: "Why is L-isomer specificity maintained during protein synthesis?",
                options: [
                    "D-isomers cannot form peptide bonds",
                    "L-isomers are chemically more stable",
                    "The ribosome is specifically designed to incorporate L-amino acids during translation",
                    "L-isomers have lower energy"
                ],
                correct: 2,
                explanation: "The ribosome's translation machinery is chiral—it was evolutionarily 'designed' to recognize and incorporate L-amino acids. The aminoacyl-tRNA synthetases (which charge tRNAs with amino acids) also have stereospecificity for L-forms. This is essentially a historical accident that became locked in early evolution. D-amino acids simply don't fit properly in the active sites."
            },
            {
                question: "A buffer solution is best described as:",
                options: [
                    "Any solution that doesn't change pH",
                    "A strong acid mixed with a strong base",
                    "A concentrated salt solution",
                    "A weak acid combined with its corresponding salt"
                ],
                correct: 3,
                explanation: "A buffer is a weak acid + its conjugate base salt (or weak base + its conjugate acid salt). Examples: acetate buffer (acetic acid + acetate ion), phosphate buffer (H₂PO₄⁻ + HPO₄²⁻). Buffers resist pH changes because the weak acid can donate H⁺ if pH rises, and the conjugate base can accept H⁺ if pH drops. The bicarbonate system (H₂CO₃/HCO₃⁻) is the primary blood buffer."
            },
            {
                question: "What is the relationship between pKa and acid strength?",
                options: [
                    "Higher pKa indicates a stronger acid",
                    "pKa and strength are completely unrelated",
                    "Lower pKa indicates a stronger acid",
                    "Larger pKa values indicate weaker acids"
                ],
                correct: 2,
                explanation: "Lower pKa = stronger acid. Examples: HCl (pKa ≈ -7, very strong), acetic acid (pKa ≈ 4.7, weak), ammonia as acid (pKa ≈ 9.25, very weak). This inverse relationship trips up many students—memorize: smaller pKa number = stronger acid. For your exam: know the pKa values of amino acid functional groups (~2.2 for COOH, ~9.6 for NH₃⁺)."
            },
            {
                question: "Ka measures _________________, and a higher Ka value indicates a _____________ acid.",
                options: [
                    "Buffer capacity; more buffered",
                    "Acid strength; stronger",
                    "pH; more neutral",
                    "Acid strength; weaker"
                ],
                correct: 1,
                explanation: "Ka (acid dissociation constant) directly measures how readily an acid donates H⁺. Higher Ka = more dissociation = stronger acid. Ka and pKa are inversely related: pKa = -log(Ka). Strong acids have Ka >> 1 and pKa < 0; weak acids have Ka << 1 and pKa > 0. For amino acids (weak acids), typical Ka values are 10⁻² to 10⁻¹⁰."
            },
            {
                question: "Which enzyme catalyzes the bicarbonate buffer system to help maintain blood pH?",
                options: [
                    "Amylase",
                    "Protease",
                    "Carbonic anhydrase",
                    "Phosphatase"
                ],
                correct: 2,
                explanation: "Carbonic anhydrase catalyzes CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻. This enzyme is CRITICAL for blood pH regulation. CO₂ produced by metabolism is converted to bicarbonate in red blood cells, transported as HCO₃⁻, and exhaled as CO₂ in lungs. Without this enzyme, pH regulation would be extremely slow. This is one of the fastest enzymes known (10⁶ reactions/second)."
            },
            {
                question: "The bicarbonate buffer system functions primarily to maintain pH in:",
                options: [
                    "Only blood plasma",
                    "Only stomach acid",
                    "Only the kidney",
                    "Blood, pancreatic juice, digestive juice, bile, and other body fluids"
                ],
                correct: 3,
                explanation: "The bicarbonate buffer system maintains pH across ALL major body fluids: blood (pH 7.35-7.45), pancreatic juice (pH 8-8.3), bile (pH 7.5-8), digestive juices, cerebrospinal fluid. This ubiquity reflects its importance. The H₂CO₃/HCO₃⁻ pair is the primary extracellular buffer, while phosphate (H₂PO₄⁻/HPO₄²⁻) is the major intracellular buffer."
            },
            {
                question: "Why are amino acids described as \"weak acids\" and given special importance in buffer systems?",
                options: [
                    "They contain carboxyl groups that can donate/accept protons (H⁺)",
                    "They only function in acidic environments",
                    "They are less soluble than other acids",
                    "They cannot be involved in neutralization reactions"
                ],
                correct: 0,
                explanation: "Amino acids contain carboxyl (-COOH, pKa ~2) and amino (-NH₃⁺, pKa ~9) groups, making them amphoteric weak acids. Because of these ionizable groups at physiological pH, amino acids and proteins act as buffers. Proteins in blood (especially hemoglobin) are actually significant physiological buffers. Free amino acids in cells also contribute to buffering capacity."
            },
            {
                question: "Peptide bonds are which type of chemical bond?",
                options: [
                    "Ionic bonds",
                    "Covalent bonds (specifically C-N bonds)",
                    "Disulfide bonds",
                    "Hydrogen bonds"
                ],
                correct: 1,
                explanation: "A peptide bond is a specific C-N covalent bond formed by condensation between the carboxyl group of one amino acid and the amino group of another. It's a strong, stable bond that makes proteins durable and requires enzyme hydrolysis (proteases) to break. This covalent nature means peptide bonds determine primary structure—the basic scaffold of every protein."
            },
            {
                question: "When an amino acid is incorporated into a polypeptide chain, it is referred to as:",
                options: [
                    "A monomer",
                    "A domain",
                    "A residue",
                    "A subunit"
                ],
                correct: 2,
                explanation: "Once incorporated into a polypeptide chain, an amino acid is called a 'residue' because it's missing the elements of water (H and OH). Example: free amino acid is glycine (C₂H₅NO₂), but when incorporated it becomes a glycine residue (C₂H₃NO—two fewer atoms). This terminology reflects the condensation chemistry: amino acids lose water and become residues in the polymer."
            },
            {
                question: "A polypeptide chain has directionality. This polarity runs from:",
                options: [
                    "The side chains to the backbone",
                    "The carboxyl group to the amino group",
                    "The alpha carbon outward",
                    "The N-terminal to the C-terminal"
                ],
                correct: 3,
                explanation: "Polypeptides have directionality: the N-terminal (free amino group) to C-terminal (free carboxyl group). By convention, sequences are written N→C. This matters because: (1) peptide bond formation always goes N-terminus of incoming amino acid to C-terminus of growing chain, (2) enzymes read sequences in specific directions, (3) it affects secondary structure preferences. Always specify direction when describing sequences."
            },
            {
                question: "Why is understanding the hierarchy of protein structure levels (primary → secondary → tertiary → quaternary) essential in biochemistry?",
                options: [
                    "It explains how amino acid sequence ultimately determines final protein structure and function",
                    "It is only relevant for teaching purposes",
                    "It determines how many disulfide bonds a protein has",
                    "It tells us the size of the protein"
                ],
                correct: 0,
                explanation: "The structure hierarchy shows the path from DNA → amino acid sequence → folded structure → function. Primary structure (sequence) is determined by the gene. This sequence contains all the information needed to fold correctly into secondary, tertiary, and quaternary structures. If you know the primary structure and the cellular environment, you can often predict the final 3D structure and function. This is why mutations in amino acid sequence can cause disease."
            },
            {
                question: "Which level of protein structure describes the linear arrangement of amino acids connected by peptide bonds?",
                options: [
                    "Secondary structure",
                    "Primary structure",
                    "Quaternary structure",
                    "Tertiary structure"
                ],
                correct: 1,
                explanation: "Primary structure is simply the LINEAR order of amino acids connected by peptide bonds. It's the most basic level—just the backbone sequence. Two proteins with identical primary structures in different organisms are called homologs. Primary structure is determined by mRNA codon sequence, which is determined by DNA. Changes to primary structure can drastically alter function."
            },
            {
                question: "Alpha helices and beta sheets are examples of which protein structure level?",
                options: [
                    "Primary structure",
                    "Secondary structure",
                    "Quaternary structure",
                    "Tertiary structure"

                for (let i = shuffled.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled.options[i], shuffled.options[j]] = [shuffled.options[j], shuffled.options[i]];
                }

                shuffled.correct = shuffled.options.indexOf(correctOption);
                return shuffled;
            });
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // =====================================================================
        // STATE
        // =====================================================================

        let currentMode = 'ordered';
        let questionsOrdered = shuffleQuestions([...questionsBase]);
        let questionsShuffled = shuffleArray(questionsOrdered).map(q => ({ ...q }));
        let questions = [...questionsOrdered];
        let currentIndex = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let retryQueue = [];
        let answered = false;
        let selectedIndex = -1;
        let lastKeyPressed = null;
        let lastKeyTime = 0;

        // =====================================================================
        // FUNCTIONS
        // =====================================================================

        function setMode(mode) {
            currentMode = mode;
            resetQuiz();

            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'ordered') {
                questions = [...questionsOrdered];
            } else {
                questions = [...questionsShuffled];
            }
            displayQuestion();
        }

        function resetQuiz() {
            currentIndex = 0;
            correctCount = 0;
            incorrectCount = 0;
            retryQueue = [];
            answered = false;
            selectedIndex = -1;
            document.getElementById('quizSection').classList.add('active');
            document.getElementById('resultsScreen').classList.remove('show');
        }

        function displayQuestion() {
            if (currentIndex >= questions.length) {
                showResults();
                return;
            }

            selectedIndex = -1;
            const q = questions[currentIndex];
            document.getElementById('questionText').textContent = q.question;

            const optionsContainer = document.getElementById('answerOptions');
            optionsContainer.innerHTML = '';

            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.id = 'answer-' + index;
                btn.textContent = String.fromCharCode(65 + index) + ') ' + option;
                if (answered) {
                    btn.classList.add('disabled');
                }
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanationSection').classList.remove('show');
            document.getElementById('feedbackMessage').classList.remove('show');

            if (!answered) {
                document.getElementById('advancePrompt').innerHTML = '<strong>Press 1, 2, 3, or 4 to select</strong> → <strong>Press same key again to submit</strong>';
            } else {
                document.getElementById('advancePrompt').innerHTML = '<strong>Press any number (1-4) to continue</strong>';
                document.getElementById('advancePrompt').style.display = 'block';
            }

            updateProgress();
            updateScore();
        }

        function selectAnswer(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentIndex];
            const buttons = document.querySelectorAll('.answer-btn');
            const correctIndex = q.correct;

            buttons.forEach((btn, i) => {
                if (i === correctIndex) {
                    btn.classList.add('correct');
                } else if (i === index) {
                    btn.classList.add('incorrect');
                }
                btn.classList.add('disabled');
            });

            if (index === correctIndex) {
                correctCount++;
                document.getElementById('feedbackMessage').textContent = '✓ Correct!';
                document.getElementById('feedbackMessage').className = 'feedback-message show correct';
            } else {
                incorrectCount++;
                retryQueue.push(q);
                document.getElementById('feedbackMessage').textContent = '✗ Incorrect';
                document.getElementById('feedbackMessage').className = 'feedback-message show incorrect';
            }

            document.getElementById('explanationSection').classList.add('show');
            document.getElementById('explanationText').textContent = q.explanation;
            document.getElementById('advancePrompt').innerHTML = '<strong>Press any number (1-4) to continue</strong>';
            document.getElementById('advancePrompt').style.display = 'block';

            updateScore();
        }

        function nextQuestion() {
            currentIndex++;
            answered = false;
            selectedIndex = -1;

            if (currentIndex >= questions.length && retryQueue.length > 0) {
                questions = retryQueue;
                retryQueue = [];
                currentIndex = 0;
            }

            displayQuestion();
        }

        function updateProgress() {
            const total = questionsOrdered.length;
            const current = currentIndex + 1;
            document.getElementById('currentQuestion').textContent = current;
            document.getElementById('totalQuestions').textContent = total;

            const progress = (currentIndex / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            if (retryQueue.length > 0) {
                document.getElementById('retryLabel').textContent = '🔄 Retry: ' + retryQueue.length;
            } else {
                document.getElementById('retryLabel').textContent = '';
            }
        }

        function updateScore() {
            const total = correctCount + incorrectCount;
            const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('incorrectCount').textContent = incorrectCount;
            document.getElementById('percentageScore').textContent = percentage + '%';
        }

        function showResults() {
            document.getElementById('quizSection').classList.remove('active');
            document.getElementById('resultsScreen').classList.add('show');

            const total = correctCount + incorrectCount;
            const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;

            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('resultsStats').innerHTML =
                `<strong>${correctCount}</strong> Correct<br>` +
                `<strong>${incorrectCount}</strong> Incorrect<br>` +
                `<strong>${total}</strong> Total Questions`;

            let message, emoji;
            if (percentage === 100) {
                message = '🌟 Perfect!';
                emoji = '🌟';
            } else if (percentage >= 90) {
                message = '🎉 Excellent!';
                emoji = '🎉';
            } else if (percentage >= 80) {
                message = '👍 Great Work!';
                emoji = '👍';
            } else if (percentage >= 70) {
                message = '📚 Good Effort';
                emoji = '📚';
            } else if (percentage >= 60) {
                message = '💪 Keep Studying';
                emoji = '💪';
            } else {
                message = '📖 Review More';
                emoji = '📖';
            }

            document.getElementById('resultsMessage').textContent = message;
            document.getElementById('resultEmoji').textContent = emoji;
        }

        // =====================================================================
        // KEYBOARD CONTROLS - DOUBLE-PRESS SYSTEM
        // =====================================================================

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            const keyNum = parseInt(key);

            // Only handle 1, 2, 3, 4
            if (![1, 2, 3, 4].includes(keyNum)) return;

            const now = Date.now();
            const timeSinceLastKey = now - lastKeyTime;
            const isDoublePress = (lastKeyPressed === keyNum && timeSinceLastKey < 500);

            if (!answered) {
                // SELECTION MODE: First press selects, second press submits
                if (isDoublePress) {
                    // DOUBLE PRESS = SUBMIT
                    selectAnswer(keyNum - 1);
                } else {
                    // SINGLE PRESS = SELECT
                    selectedIndex = keyNum - 1;
                    document.querySelectorAll('.answer-btn').forEach((btn, i) => {
                        btn.classList.remove('selected');
                        if (i === selectedIndex) {
                            btn.classList.add('selected');
                        }
                    });
                }
            } else {
                // ANSWERED MODE: Any number advances
                nextQuestion();
            }

            lastKeyPressed = keyNum;
            lastKeyTime = now;
        });

        // =====================================================================
        // INIT
        // =====================================================================

        document.addEventListener('DOMContentLoaded', () => {
            displayQuestion();
        });
    </script>
</body>
</html>
