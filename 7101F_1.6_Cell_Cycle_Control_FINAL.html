            {q: "According to the GU-AG rule, AG is found at the:", o: ["5' donor splice site", "Branch point", "3' acceptor splice site", "5' cap"], a: 2, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Alternative mRNA splicing allows:", o: ["Multiple protein isoforms to be produced from a single gene, increasing diversity in protein function", "All genes to produce the same protein", "Introns to be translated", "Exons to be degraded"], a: 0, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Alternative exon splicing of the tropomyosin gene is an example of:", o: ["Normal gene regulation", "An abnormal splicing event that causes disease", "Increased protein diversity", "Both normal gene regulation and increased protein diversity"], a: 3, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Abnormal processing of the β-globin transcript causes:", o: ["Sickle cell disease", "\u03b1-Thalassemia", "\u03b2-Thalassemia", "Hemophilia"], a: 2, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Alternative splicing of the amelogenin gene (enamel matrix protein):", o: ["Always improves enamel formation", "Has no effect on enamel development", "Inclusion of exon 4 is deleterious to enamel matrix formation", "Increases enamel hardness"], a: 2, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Alternative splicing can be regulated by:", o: ["RNA polymerase exclusively", "Histone deacetylases only", "Activator and repressor proteins specific to a particular cell type", "Only DNA methylation"], a: 2, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "RNA export from the nucleus occurs through:", o: ["Random diffusion across the nuclear membrane", "Nuclear pore complexes that cover the nuclear membrane", "Histone-mediated transport", "Chromosomal translocation"], a: 1, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Post-transcriptional control of gene expression includes: (Select all that apply)", o: ["Attenuation", "RNA processing", "RNA transport", "Transcription factor assembly"], a: [0, 1, 2], e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Overall transcriptional modifications include: (Select all that apply)", o: ["Chromatin modification", "Nucleosome positioning", "Assembly of transcription factors", "mRNA polyadenylation"], a: [0, 1, 2], e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Overall post-transcriptional modifications include: (Select all that apply)", o: ["Attenuation", "RNA processing", "RNA transport", "Translation"], a: [0, 1, 2], e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "The primary difference between positive and negative control of transcription is:", o: ["Positive control activates genes while negative control represses genes", "Positive control uses activators while negative control uses repressors", "Positive control affects DNA while negative control affects RNA", "Both A and B"], a: 3, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Gene regulation is important for:", o: ["Cell cycle control only", "Cell differentiation only", "Response to environmental signals, cell cycle control, and cell differentiation", "Protein synthesis only"], a: 2, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Transcription factor mutations can result in:", o: ["Loss of specific protein function only", "Ribosomal dysfunction", "Changes in mRNA splicing only", "Developmental defects and cancer"], a: 3, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "The complexity of multicellular organisms is largely due to:", o: ["Differences in gene expression patterns through combinatorial gene regulation", "Duplication of genes", "Increased number of chromosomes", "Different numbers of mitochondria"], a: 0, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Epigenetic modifications include: (Select all that apply)", o: ["DNA methylation", "Histone modifications", "Chromatin remodeling", "Gene mutations"], a: [0, 1, 2], e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Which of the following statements about chromatin is true? (Select all that apply)", o: ["Heterochromatin is transcriptionally inactive", "Euchromatin is transcriptionally active", "Histone modifications can change chromatin structure", "Chromatin structure is permanent and cannot be modified"], a: [0, 1, 2], e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Cell cycle checkpoints ensure:", o: ["All cells divide at the same rate", "Continuous cell division", "Cancer development in all cells", "DNA integrity and proper replication before progression to the next phase"], a: 3, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Tumor suppressor proteins like p53, p21, and Rb:", o: ["Promote uncontrolled cell division", "Are mutated in all cells", "Always lead to apoptosis", "Halt the cell cycle when problems are detected"], a: 3, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Proto-oncogenes like Ras:", o: ["Always promote cell death", "Are only found in cancer cells", "Normally promote cell growth and cell cycle progression", "Prevent DNA replication"], a: 2, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "The cell cycle is a tightly regulated process involving:", o: ["CDK-cyclin complexes only", "Checkpoints, regulatory proteins, and gene expression changes", "DNA methylation only", "Histone modifications only"], a: 1, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Anticancer therapies targeting CDK inhibitors work by:", o: ["Preventing cell cycle progression, particularly in rapidly dividing cancer cells", "Promoting uncontrolled cell division", "Enhancing DNA repair", "Activating apoptosis in all cells equally"], a: 0, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "The relationship between cell cycle control and gene expression is:", o: ["Independent; they do not interact", "Only related during interphase", "Only related during mitosis", "Interconnected; genes controlling cyclins and CDKs must be properly regulated"], a: 3, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Mutations in tumor suppressor genes can result in:", o: ["Loss of cell cycle checkpoints and increased risk of cancer", "Increased cell cycle control", "Enhanced DNA repair", "Decreased proliferation rate"], a: 0, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "The transition from one cell cycle phase to another requires:", o: ["Continuous high levels of all cyclins and CDKs", "Precise timing of cyclin synthesis and degradation", "Constant activation of all checkpoints", "Simultaneous division of all cells"], a: 1, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Epigenetic changes in cancer cells often include:", o: ["Loss of histone acetylation leading to silencing of tumor suppressor genes", "Increased DNA methylation at CpG islands in promoters", "Changes in chromatin structure that promote oncogene expression", "All of the above"], a: 3, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Gene expression patterns are determined by:", o: ["The DNA sequence alone", "The combination of transcription factors present in a cell", "The proteins expressed during development", "Only the presence of specific promoters"], a: 1, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "The regulation of cell cycle and gene expression ensures:", o: ["All cells divide at the same rate", "Continuous mitosis", "Identical protein expression in all cells", "Proper development, tissue homeostasis, and prevention of cancer"], a: 3, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Alternative splicing increases:", o: ["The number of genes in the genome", "mRNA stability", "The diversity of proteins that can be produced from a single gene", "The rate of transcription"], a: 2, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "CpG dinucleotides are particularly important because:", o: ["They are the site of histone modifications", "They are the site of DNA methylation and gene silencing", "They encode a unique amino acid", "They mark the end of genes"], a: 1, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "The coordination between cell cycle progression and gene expression is essential for:", o: ["Preventing aneuploidy and cancer development", "Maintaining genomic stability", "Appropriate cell differentiation and tissue function", "All of the above"], a: 3, e: "Master cell cycle regulation, gene control, and chromatin dynamics."},
            {q: "Understanding cell cycle control and gene expression mechanisms is important for:", o: ["Treating cancer and genetic diseases", "Understanding development", "Developing personalized medicine", "All of the above"], a: 3, e: "Master cell cycle regulation, gene control, and chromatin dynamics."}
        ];

        let currentMode = 'learning';
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let answered = false;
        let selectedAnswers = [];
        let lastKeyPressed = null;
        let lastKeyTime = 0;

        function setMode(mode) {
            currentMode = mode;
            currentQuestionIndex = 0;
            correctCount = 0;
            incorrectCount = 0;
            answered = false;
            selectedAnswers = [];
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.mode-btn.${mode}`).classList.add('active');
            displayQuestion();
        }

        function getQuestions() {
            if (currentMode === 'learning') {
                return questionsData;
            } else {
                let shuffled = [...questionsData];
                Fisher_Yates_Shuffle(shuffled);
                return shuffled;
            }
        }

        function getTotalQuestions() {
            return questionsData.length;
        }

        function Fisher_Yates_Shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function displayQuestion() {
            const questions = getQuestions();
            if (currentQuestionIndex >= questions.length) {
                showResults();
                return;
            }

            const question = questions[currentQuestionIndex];
            answered = false;
            selectedAnswers = [];
            let isMultiSelect = Array.isArray(question.a);

            let optionsHTML = question.o.map((opt, idx) => {
                return `<div class="option" onclick="selectOption(${idx}, ${isMultiSelect})" data-option="${idx}">
                    <strong>${String.fromCharCode(65 + idx)})</strong> ${opt}
                </div>`;
            }).join('');

            document.getElementById('quizContent').innerHTML = `
                <div class="question-section">
                    <div class="question-number">Question ${currentQuestionIndex + 1} of ${getTotalQuestions()}</div>
                    <div class="question-text">${question.q}</div>
                    <div class="options" id="optionsContainer">${optionsHTML}</div>
                    <button class="submit-btn" id="submitBtn" onclick="checkAnswer()">
                        ${isMultiSelect ? 'Submit Selected Answers' : 'Submit Answer'}
                    </button>
                    <div class="keyboard-hint">💡 Press 1/2/3/4 to select • Double-press within 500ms to submit</div>
                </div>
            `;

            updateProgress();
        }

        function selectOption(index, isMultiSelect) {
            if (answered) return;

            const options = document.querySelectorAll('.option');
            if (isMultiSelect) {
                selectedAnswers.includes(index) ?
                    selectedAnswers.splice(selectedAnswers.indexOf(index), 1) :
                    selectedAnswers.push(index);
                options.forEach((opt, idx) => {
                    selectedAnswers.includes(idx) ? opt.classList.add('selected') : opt.classList.remove('selected');
                });
            } else {
                selectedAnswers = [index];
                options.forEach((opt, idx) => {
                    idx === index ? opt.classList.add('selected') : opt.classList.remove('selected');
                });
            }
        }

        function checkAnswer() {
            if (answered) return;

            const questions = getQuestions();
            const question = questions[currentQuestionIndex];
            const correctAnswers = Array.isArray(question.a) ? question.a : [question.a];
            const isCorrect = selectedAnswers.length === correctAnswers.length &&
                selectedAnswers.every(idx => correctAnswers.includes(idx));

            answered = true;
            const options = document.querySelectorAll('.option');
            options.forEach((opt, idx) => {
                if (correctAnswers.includes(idx)) {
                    opt.classList.add('correct');
                } else if (selectedAnswers.includes(idx) && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });

            const feedbackClass = isCorrect ? 'correct' : 'incorrect';
            const feedbackTitle = isCorrect ? '✓ Correct!' : '✗ Incorrect';

            document.querySelector('.submit-btn').innerHTML = `
                <div class="feedback ${feedbackClass}">
                    <div class="feedback-title">${feedbackTitle}</div>
                    <div class="feedback-text">${question.e}</div>
                </div>
            `;

            if (isCorrect) {
                correctCount++;
            } else {
                incorrectCount++;
            }
            updateScore();
        }

        function nextQuestion() {
            if (!answered) return;
            currentQuestionIndex++;
            displayQuestion();
        }

        function updateProgress() {
            const total = getTotalQuestions();
            const percentage = (currentQuestionIndex / total) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQuestions').textContent = total;
        }

        function updateScore() {
            const total = correctCount + incorrectCount;
            const percentage = total === 0 ? 0 : Math.round(correctCount / total * 100);
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('incorrectCount').textContent = incorrectCount;
            document.getElementById('percentageDisplay').textContent = percentage;
            updateProgress();
        }

        function showResults() {
            const total = correctCount + incorrectCount;
            const pct = total === 0 ? 0 : Math.round(correctCount / total * 100);
            document.getElementById('quizContent').innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <h2 style="color: #667eea; font-size: 32px; margin-bottom: 20px;">🎉 Quiz Complete!</h2>
                    <div style="font-size: 18px; margin: 30px 0; line-height: 2;">
                        <div>✓ Correct: <strong>${correctCount}</strong></div>
                        <div>✗ Incorrect: <strong>${incorrectCount}</strong></div>
                        <div>Score: <strong>${pct}%</strong></div>
                    </div>
                    <button class="restart-btn" onclick="location.reload()">Restart Quiz</button>
                </div>
            `;
        }

        function setupKeyboard() {
            document.onkeydown = function(e) {
                const keyNum = parseInt(e.key);
                if (![1, 2, 3, 4].includes(keyNum)) return;

                const isMultiSelect = Array.isArray(getQuestions()[currentQuestionIndex]?.a);
                const now = Date.now();

                if (answered) {
                    nextQuestion();
                } else {
                    if (lastKeyPressed === keyNum && now - lastKeyTime < 500) {
                        checkAnswer();
                        lastKeyPressed = null;
                    } else {
                        selectOption(keyNum - 1, isMultiSelect);
                        lastKeyPressed = keyNum;
                        lastKeyTime = now;
                    }
                }
            };
        }

        setupKeyboard();
        setMode('learning');
    </script>

</html>
