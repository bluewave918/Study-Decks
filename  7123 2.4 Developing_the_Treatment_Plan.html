v><div class="panel" id="quiz"><div class="muted" id="topic"></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback hidden"></div><div class="top"><button id="prev">← Previous</button><button id="next">Next →</button></div></div></main><script>const bank=[{"topic":"Planning foundations","q":"What is the correct first step in the treatment-planning flowchart?","options":["Schedule recall before identifying problems","Choose definitive restorations immediately","Obtain a signature before examining the patient","Gather medical, dental and psychosocial histories, clinical and radiographic examinations, and diagnostic aids"],"correct":3,"why":"Information gathering precedes evaluation, significant findings, the comprehensive diagnostic list, objectives, modifiers and the phased plan."},{"topic":"Planning foundations","q":"After information gathering, what is the next major step?","options":["Skip to the patient modifiers","Evaluate findings to identify significant findings","Create a recall schedule","Immediately begin definitive treatment"],"correct":1,"why":"The flowchart moves from information gathering to evaluation and significant findings before diagnoses."},{"topic":"Planning foundations","q":"Which sequence best matches the treatment planning process?","options":["Significant findings → comprehensive diagnosis list → objectives → patient/dentist modifiers → plan","Plan → diagnosis → modifiers → findings","Objectives → examination → diagnosis → treatment","Modifiers → recall → history → diagnosis"],"correct":0,"why":"The comprehensive diagnosis list establishes why care is needed; objectives and modifiers then shape the plan."},{"topic":"Planning foundations","q":"What does the comprehensive diagnosis list formally document?","options":["Why treatment is necessary","The patient’s signature","Only the procedures the patient can afford","The recall interval"],"correct":0,"why":"Diagnoses establish the problems requiring care; they precede the treatment objectives."},{"topic":"Planning foundations","q":"Treatment objectives primarily describe which part of planning?","options":["The physical measurements of teeth","Only the procedural billing codes","The intent or rationale of the final treatment plan","The sterilization protocol"],"correct":2,"why":"Objectives state clear goals from both patient and dentist perspectives."},{"topic":"Planning foundations","q":"What must treatment objectives integrate?","options":["Dentist preferences without patient input","Current diagnoses/problems and knowledge of feasible dental procedures","Only radiographic findings","Patient preference without diagnoses"],"correct":1,"why":"Objectives are based on the diagnosed problems and what procedures can accomplish."},{"topic":"Planning foundations","q":"Why are both patient and dentist modifiers considered?","options":["The patient chooses all diagnoses","Both perspectives influence a feasible, acceptable treatment plan","The dentist cannot propose alternatives","They replace the need for objectives"],"correct":1,"why":"The flowchart explicitly places patient and dentist modifiers between objectives and treatment plans."},{"topic":"Planning foundations","q":"What comes after implementation of a phased treatment plan?","options":["Maintenance, monitoring and prevention","A new initial history with no follow-up","Skipping all recall visits","Immediate discharge without reevaluation"],"correct":0,"why":"Treatment is followed by ongoing maintenance, monitoring and prevention."},{"topic":"Planning foundations","q":"Which statement about treatment plans is most accurate?","options":["Every diagnosis has only one permissible procedure","More than one reasonable plan may emerge after objectives and modifiers are considered","The plan is finalized before findings are evaluated","Patient preferences are excluded"],"correct":1,"why":"The flowchart explicitly says treatment plan(s), reflecting alternatives shaped by patient and clinician factors."},{"topic":"SOAP and prognosis","q":"In a SOAP note, what does S stand for?","options":["Screening: the dentist’s diagnosis","Surgical: the definitive procedure","Systemic: clinician-measured vital signs","Subjective: the patient’s own report or complaint"],"correct":3,"why":"Subjective includes the chief complaint and history as reported by the patient, ideally in their own words."},{"topic":"SOAP and prognosis","q":"“My denture hurts on the right” belongs in which SOAP section?","options":["Subjective","Assessment","Plan","Objective"],"correct":0,"why":"This is the patient’s description, not an independently measured finding or clinician interpretation."},{"topic":"SOAP and prognosis","q":"A patient points to a tooth and says “I have pain right here.” How should this be recorded?","options":["In Assessment as radiographic pathology","In Subjective, preserving the patient’s wording","In Objective as a confirmed diagnosis","In Plan as an extraction order"],"correct":1,"why":"The lecture emphasizes documenting what the patient reports in their own words."},{"topic":"SOAP and prognosis","q":"What does O in SOAP mean?","options":["Outcome: future recall intervals","Opinion: the patient’s preferences","Options: treatment alternatives only","Objective: measurable or observable clinician findings"],"correct":3,"why":"Objective findings include vital signs and clinical or radiographic observations."},{"topic":"SOAP and prognosis","q":"A recorded blood pressure and an observed facial mole belong primarily in which section?","options":["Plan","Prognosis","Objective","Subjective"],"correct":2,"why":"Vital signs and extraoral observations are clinician-measured or observed facts."},{"topic":"SOAP and prognosis","q":"Cracked, chipped, decayed, missing and filled teeth are examples of what?","options":["Patient-reported symptoms only","Prognostic ratings","Objective intraoral findings","Final treatment choices"],"correct":2,"why":"They are observable dentiti mmend more sweetened beverages","Perform emergency endodontics","Prescribe a saliva substitute only","Recommend an electric toothbrush"],"correct":3,"why":"An electric brush is an adaptive aid for impaired hand function and oral hygiene."},{"topic":"Diagnosis-to-treatment case","q":"For gingivitis with poor plaque control, what is the objective and associated treatment?","options":["Restore gingival health through prophylaxis and oral hygiene instruction","Treat pain through a removable denture","Restore salivary flow through crowns","Replace every missing tooth with implants"],"correct":0,"why":"Gingivitis risks progression to periodontal disease; plaque control and prophylaxis target its cause."},{"topic":"Diagnosis-to-treatment case","q":"Ms. Smith drinks approximately 1 liter of sweetened soda daily and has seven carious teeth. What should treatment emphasize?","options":["Immediate complete dentures for all patients","Only a cosmetic whitening procedure","Only an electric toothbrush with no dietary changes","Diet counseling, reducing refined carbohydrates, caries control and topical fluoride"],"correct":3,"why":"The slide links high sucrose intake to caries susceptibility and identifies diet modification and fluoride-based caries control."},{"topic":"Diagnosis-to-treatment case","q":"In Ms. Smith’s case, what is the immediate objective for her painful maxillary right first molar with acute apical abscess?","options":["Whiten the tooth before evaluating pain","Perform elective orthodontics first","Relieve pain with emergency endodontic therapy","Defer all evaluation until recall"],"correct":2,"why":"The table directly pairs the acute apical abscess and constant pain with pain relief and emergency endodontic therapy."},{"topic":"Diagnosis-to-treatment case","q":"What is the difference between a diagnosis and a treatment objective in the case table?","options":["Diagnosis names the condition; objective states the desired clinical result","Diagnosis is the planned isease before definitive restoration."},{"topic":"Treatment phases","q":"Most oral surgery, periodontics and endodontics are grouped in which phase when not urgently required?","options":["Phase III: esthetic rehabilitation only","Phase V: recall","Phase IV: final reevaluation","Phase II: disease control"],"correct":3,"why":"These services commonly eliminate or stabilize disease; emergencies may be handled earlier in Phase I."},{"topic":"Treatment phases","q":"Why might an amalgam or composite restoration be placed in Phase II rather than Phase III?","options":["Its primary purpose is eliminating decay and controlling active disease","It cannot be placed before orthodontics","It is always a cosmetic procedure","It replaces routine recall"],"correct":0,"why":"The same material can serve disease control in Phase II or functional/esthetic restoration in Phase III depending on purpose."},{"topic":"Treatment phases","q":"What is the main goal of Phase III?","options":["Only gather initial histories","Restore full function and esthetics through restorative and prosthodontic care","Only determine blood pressure","Only relieve acute pain"],"correct":1,"why":"Definitive treatment restores function and appearance after disease is stabilized."},{"topic":"Treatment phases","q":"Crowns and fixed bridges most typically belong in which phase?","options":["Phase III: definitive treatment","Phase I: emergency management only","Phase IV: reevaluation","Phase V: periodic examination"],"correct":0,"why":"These are examples of definitive restorative and prosthodontic procedures."},{"topic":"Treatment phases","q":"Delivery of complete or removable partial dentures is characteristic of which phase?","options":["Phase II: oral hygiene instruction","Phase IV: reevaluation","Phase III: restoration of function and esthetics","Phase I: priority care"],"correct":2,"why":"Prostheses replace missing teeth and restore function and appearance."},{"topic":"Treatment phases","q":"What is the purpose d bridges","Oral hygiene instruction, scaling/root planing or prophylaxis, and control of contributing factors","Only esthetic whitening","Only periodic oral evaluations"],"correct":1,"why":"Initial periodontal therapy also includes correcting defective restorations, removing caries and addressing smoking or parafunctional habits."},{"topic":"Treatment phases","q":"Which contributing factors does the lecture explicitly recommend reducing during disease control?","options":["All radiographic examinations","Parafunctional habits and smoking","Patient participation and consent","Recall frequency alone"],"correct":1,"why":"Behavioral and local contributing factors can undermine periodontal control."},{"topic":"Treatment phases","q":"Which set is specifically listed under Phase II caries control?","options":["Implant placement, denture delivery and whitening","Only PCCE and POE","Caries risk assessment, provisional restorations and definitive disease-control restorations","Only sedation and emergency care"],"correct":2,"why":"The lecture lists risk assessment and provisional or definitive restorations, including amalgam, composite and glass ionomers."},{"topic":"Treatment phases","q":"What is a Phase II role for a defective existing restoration?","options":["Always convert it into a removable denture","Ignore it if the patient has no esthetic concern","Replace it when needed to control disease","Leave it until after recall regardless of decay"],"correct":2,"why":"Replacing defective restorations can eliminate caries and local disease contributors."},{"topic":"Treatment phases","q":"Endodontic therapy for pathologic pulpal or periapical conditions is included in which nonemergency phase?","options":["Phase II: disease control","Phase IV: reevaluation only","Phase V: recall only","Phase III: esthetics only"],"correct":0,"why":"The lecture distinguishes emergency endodontics in Phase I from planned disease-control endodontics in Phase II."},{"topic":"Treatment phases","q":" g vertical dimension, and other involved teeth","Only teeth scheduled for extraction"],"correct":2,"why":"The lecture lists these groups under definitive restoration of individual teeth."},{"topic":"Treatment phases","q":"Elective removal of an asymptomatic third molar is placed in which phase?","options":["Phase V: recall","Phase IV: reevaluation","Phase III: definitive treatment","Phase I: emergency treatment in every case"],"correct":2,"why":"The slides distinguish elective asymptomatic extractions from urgent infected or painful teeth."},{"topic":"Treatment phases","q":"Which options are listed for replacing missing teeth in Phase III?","options":["Only emergency endodontics","Only physician consultation","Only topical fluoride","Fixed partial dentures/implants, removable partial dentures, and complete dentures"],"correct":3,"why":"The definitive phase includes fixed, implant-supported and removable prosthodontic replacement."},{"topic":"Treatment phases","q":"Tooth whitening and esthetic restorations are examples of what?","options":["Phase V diagnostic recall","Phase III esthetic dentistry","Phase I infection control","Phase II systemic consultation"],"correct":1,"why":"Elective esthetic work belongs to definitive treatment."},{"topic":"Informed consent and records","q":"Which best describes informed consent for dental treatment?","options":["Have the dentist decide without patient discussion","Obtain a signature without explaining alternatives","Discuss only the recommended treatment’s price","Discuss diagnoses, options, benefits, disadvantages and risks so a competent patient can decide"],"correct":3,"why":"The lecture requires disclosure of the condition, proposed treatment, risks, benefits, complications, no-treatment consequences, alternatives and prognosis."},{"topic":"Informed consent and records","q":"According to the lecture, the consenting individual must generally be what?","options":["Only a family member, never the patient","Any age if they sign quickly","Mentally competent and of majority age, usually 18 or older","A dental employee"],"correct":2,"why":"The slide explicitly describes competence and majority age as consent requirements."},{"topic":"Informed consent and records","q":"A patient has limited understanding of the clinician’s language. What may be necessary?","options":["Omit alternative treatments","Proceed without assessing understanding","Rely only on an unexplained signature","Translation services to support meaningful informed consent"],"correct":3,"why":"Understanding is essential to informed choice; the lecture explicitly mentions translation services."},{"topic":"Informed consent and records","q":"Which information about declining recommended care must be disclosed?","options":["Only the dentist’s preferred appointment time","Only the instrument sterilization method","Consequences or risks of not undergoing treatment","Only the laboratory shipping date"],"correct":2,"why":"No-treatment consequences are a distinct required disclosure in the lecture."},{"topic":"Informed consent and records","q":"Which statement about treatment alternatives is correct?","options":["Reasonable alternative procedures and their advantages/disadvantages must be discussed","Alternatives are unnecessary if a patient is in pain","Only the most expensive option must be offered","Alternatives replace the need to explain prognosis"],"correct":0,"why":"Informed consent requires alternatives, including relevant risks, benefits and likely outcomes."},{"topic":"Informed consent and records","q":"Which is a separate disclosure item in the lecture’s informed-consent list?","options":["The patient’s insurance company name only","The assistant’s favorite procedure","Potential complications or side effects","The dental unit manufacturer"],"correct":2,"why":"Complications/side effects are listed separately from overall risks and benefits."},{"topic":"Informed consent and records","q":"Why must prognosis be discussed before consent?","options":["It informs the patient of the expected outlook for the proposed treatment","It guarantees a perfect outcome","It is only relevant after the final recall","It substitutes for explaining the diagnosis"],"correct":0,"why":"Prognosis is explicitly one of the seven listed disclosures."},{"topic":"Informed consent and records","q":"What is the benefit of a clearly written treatment plan?","options":["It makes all procedures irreversible","It replaces all patient communication","It eliminates the need for clinical evaluation","Dentist, staff and patient know procedures, sequence and fees"],"correct":3,"why":"The lecture describes documentation as a practice-management tool as well as a risk-management measure."},{"topic":"Informed consent and records","q":"When does the patient affirm acceptance of an agreed treatment plan with a signature?","options":["After the plan is agreed upon and informed consent established","Before diagnosis and discussion","Instead of learning the risks","Only after every procedure is completed"],"correct":0,"why":"The lecture explicitly places signature after agreement and informed consent."},{"topic":"Informed consent and records","q":"What does treatment plan documentation need to make clear?","options":["Only the patient’s preferred color","Only the recall date","Procedures, sequence of care and associated fees","Only the instrument tray number"],"correct":2,"why":"Written plans coordinate care among patient, dentist and staff."},{"topic":"Patient sequencing exercise","q":"In the slide 30 patient example, which need is most clearly acute?","options":["Esthetic Class V restoration on #8","Routine restoration of #19","Elective crown on #3","Painful tooth #30 requiring root canal therapy"],"correct":3,"why":"The symptomatic endodontic problem is an acute priority."},{"topic":"Patient sequencing exercise","q":"According to the professor’s slide 31 exercise, which three procedures appear in Phase I?","options":["Two quadrants of raphs, occlusal adjustment, definitive crowns, recall","Physician consultation, premedication, stress/fear management, special positioning, and considerations for systemic disease","Premedication, prosthodontics, orthodontics, bleaching, and periodic evaluation","Chief-complaint restoration, scaling, impressions, occlusal stabilization, and recall"],"correct":1,"why":"Systemic treatment includes consultation with the physician, premedication, managing stress or fear, positioning modifications, and other considerations necessitated by systemic disease. These make subsequent dental care safer."},{"topic":"Disease control details","q":"A questionable tooth may be unrestorable, and the patient has plaque, defective margins, and smoking-related periodontal risk. Which Phase II sequence best matches the slides?","options":["Fabricate definitive bridgework first and postpone assessment of caries","Perform whitening and replace missing teeth before evaluating active disease","Remove caries to determine restorability; address hopeless teeth, hygiene, scaling/root planing, defective restorations and contributing habits","Complete only routine recall and defer all disease control until Phase V"],"correct":2,"why":"Phase II determines restorability by caries removal, manages hopeless/problematic teeth (possibly provisionally replacing them), performs periodontal initial therapy and oral-hygiene instruction, and reduces contributing factors including defective restorations, parafunction, and smoking."},{"topic":"Disease control details","q":"Which of the following is explicitly included in the Phase II caries-control and stabilization checklist?","options":["Only crowns and bridges once occlusion has been restored","Only elective third-molar extraction and tooth whitening","Only recall examination and patient-complete-care evaluation","Caries risk assessment, temporary and definitive caries-control restorations, endodontic therapy when indicated, build-ups, and post-treatment assessment"],"correct":3,"why":"Slide 25 lists caries risk assessment, provisional and definitive restorations (amalgam, composite, glass ionomer), replacement of defective restorations, endodontic therapy, provisional/foundation build-ups, and post-treatment assessment (2200)."},{"topic":"Clinical case","q":"In Ms. Smith’s case table, which pairing correctly distinguishes a diagnosis-related problem from the future risk and intervention?","options":["Sjögren’s → reduced saliva/xerostomia → risk of caries and poor prosthesis retention → saliva-promoting therapy or substitutes","Rheumatoid arthritis → increased saliva → risk of calculus → mouthrinse alone","Gingivitis → painful molar abscess → risk of occlusal collapse → whitening","High-sucrose diet → improved salivary protection → low caries risk → no counseling"],"correct":0,"why":"The table links Sjögren’s syndrome to xerostomia, then to caries, prosthesis-retention difficulties, and discomfort. The objective is to increase flow or reduce symptoms, with medication or saliva substitutes as possible treatment."},{"topic":"Consent","q":"Which set includes ALL seven disclosures specifically required by the lecture before informed consent?","options":["Diagnosis, proposed treatment, expected appointment length, staff names, scheduling, insurance, and signature","Condition/diagnosis, proposed treatment, risks and benefits, possible complications or side effects, risks of no treatment, alternatives, and prognosis","Diagnosis, medical history, radiographs, fees, insurance, patient age, and recall","Proposed treatment, provider preference, expected profits, procedure duration, staff qualifications, and insurance"],"correct":1,"why":"Slide 28 enumerates seven disclosures: condition; proposed care; risks and benefits; potential complications/side effects; consequences of no treatment; alternatives; and prognosis. Consent also requires competence and an appropriate language-access approach."},{"topic":"Definitive phase","q":"W bank.map((_,i)=>i);if(!onlyMissed&&$('mode').value==='shuffled')for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}if(!onlyMissed)misses.clear();answers={};idx=0;render()}function render(){if(!order.length){$('quiz').innerHTML='<h2>No missed questions to review.</h2><p>Start the full deck to practice again.</p>';return}if(idx>=order.length){const right=order.filter(i=>answers[i]===bank[i].correct).length;$('quiz').innerHTML='<h2>Round complete!</h2><p class="end">'+right+' / '+order.length+' correct ('+Math.round(100*right/order.length)+'%).</p><p>'+misses.size+' question(s) remain in missed review.</p><button onclick="start(true)">Review missed questions</button> <button onclick="location.reload()">Restart full deck</button>';return}let i=order[idx],q=bank[i],ans=answers[i];$('topic').textContent=q.topic+' · Question '+(idx+1)+' of '+order.length+ (review?' · MISSED REVIEW':'');$('question').textContent=q.q;$('choices').innerHTML='';q.options.forEach((s,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=(j+1)+'. '+s;if(ans!==undefined){b.disabled=true;if(j===q.correct)b.classList.add('correct');else if(j===ans)b.classList.add('incorrect')}b.onclick=()=>pick(j);$('choices').appendChild(b)});$('feedback').classList.toggle('hidden',ans===undefined);if(ans!==undefined){$('feedback').innerHTML='<strong>'+(ans===q.correct?'Correct!':'Not quite.')+'</strong> '+(ans!==q.correct?'Correct answer: '+q.options[q.correct]+'. ':'')+q.why+'<p class="small muted">Other choices do not match the specific slide concept, phase, or documentation category being tested.</p>'}$('prev').disabled=idx===0;$('next').textContent=idx===order.length-1?'Finish round →':'Next →';$('fill').style.width=(100*idx/order.length)+'%';$('stats').textContent='Answered '+Object.keys(answers).length+' / '+order.length+' · Missed to master: '+misses.size}function pick(j){let i=order[idx];if(answers[i]!==undefined){next();
