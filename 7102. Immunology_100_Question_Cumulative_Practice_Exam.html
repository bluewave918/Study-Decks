<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Immunology — 100-Question Cumulative Practice Exam</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color-scheme:light dark}body{margin:0;background:#f3f5fa;color:#19283e}main{max-width:820px;margin:auto;padding:22px 16px 60px}h1{font-size:clamp(1.5rem,4vw,2.25rem);margin-bottom:6px}.sub{color:#59677b}.panel{background:white;border:1px solid #dbe1e9;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 4px 20px #182d4610}button,select{font:inherit;border:1px solid #bac6d4;border-radius:11px;padding:12px 15px;background:white;color:#19283e;cursor:pointer}button:hover{border-color:#466fc3}button:focus-visible{outline:3px solid #6794ff}button.primary{background:#1b4f9d;color:white;border-color:#1b4f9d}button:disabled{opacity:.5;cursor:default}.toolbar,.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.choice{display:block;width:100%;text-align:left;margin:10px 0;line-height:1.45}.choice b{display:inline-block;width:27px}.choice.correct{border:2px solid #187b53;background:#e5f7ee}.choice.wrong{border:2px solid #bb3940;background:#fff0f0}.feedback{border-left:4px solid #285ea8;background:#edf4ff;padding:14px 16px;margin-top:15px;border-radius:6px;line-height:1.6}.muted{color:#66758b}.progress{height:9px;background:#dce4f0;border-radius:8px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#3975d0;width:0}.hidden{display:none}.kbd{font-size:.88rem;color:#58667b}.question{font-size:1.2rem;line-height:1.5;font-weight:700}.nav{justify-content:space-between;margin-top:20px}@media(prefers-color-scheme:dark){body{background:#111926;color:#e9f1ff}.panel,button,select{background:#202c3c;color:#f1f5fc;border-color:#47576b}.sub,.muted,.kbd{color:#aab9cf}.choice.correct{background:#123d30}.choice.wrong{background:#4d242b}.feedback{background:#243e5f}.progress{background:#3a485d}}</style></head><body><main><h1>Immunology · Cumulative Practice Exam</h1><div class="sub">100 questions · 20 per lecture · Based on five PowerPoints and professor practice-test style</div><div class="panel"><div class="toolbar"><label for="mode">Mode</label><select id="mode"><option value="shuffled">Shuffled exam</option><option value="ordered">Fixed exam order</option></select><button id="restart">Restart deck</button><span id="status" class="muted"></span></div><div class="progress"><div id="bar" class="fill"></div></div><p class="kbd">Remote: 1–4 answer · After feedback, any 1–4 or ↓ advances · ↑ goes back · No Enter needed</p></div><div class="panel" id="study"><div id="counter" class="muted"></div><p class="question" id="question"></p><div id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="nav"><button id="back">← Previous</button><button id="next" class="primary" disabled>Next ↓</button></div></div><div class="panel hidden" id="end"><h2 id="endtitle">Round complete</h2><p id="summary"></p><div class="toolbar"><button id="review" class="primary">Review missed questions</button><button id="again">Restart full deck</button></div></div></main><script>
const BANK=[{"lecture": 5, "q": "Which of the following events follows PI3 kinase activation in the lecture's memory-cell pathway?", "options": ["MHC class II is degraded by proteasomes", "Antibodies are converted directly into memory cells", "Fas ligand activates caspase 8", "A membrane lipid is phosphorylated to create an Akt docking site"], "correct": 3, "why": "The modified membrane lipid recruits Akt; its kinase activity then suppresses pro-apoptotic signaling.", "section": "Memory signaling (3 questions)", "id": 1}, {"lecture": 2, "q": "Which pairing matches the lecture's surfactant proteins?", "options": ["SP-A—MHC I; SP-D—TCR", "SP-A—viral RNA; SP-D—IgG Fc", "SP-A—histones; SP-D—C5a", "SP-A—capsular polysaccharide; SP-D—LPS"], "correct": 3, "why": "Both promote neutralization and clearance but recognize different microbial surface components.", "section": "Innate barriers and antimicrobial substances", "id": 2}, {"lecture": 1, "q": "A committed lymphoid progenitor is most directly associated with generation of which set?", "options": ["Megakaryocytes, basophils and erythrocytes", "Neutrophils, eosinophils, platelets and RBCs", "Osteoblasts, endothelial cells and fibroblasts", "B cells, T cells, NK cells and some dendritic cells"], "correct": 3, "why": "The slides assign lymphocytes, NK cells and some dendritic cells to lymphoid progenitors; the other blood cells listed are myeloid-derived.", "section": "Organization and hematopoiesis", "id": 3}, {"lecture": 3, "q": "Which feature of antibody constant regions can improve serum solubility and influence accessibility to effector proteins?", "options": ["Somatic hypermutation of the CDRs", "Glycosylation with attached oligosaccharides", "Replacement of both heavy chains by light chains", "Deletion of the Fc region during secretion"], "correct": 1, "why": "The lecture describes carbohydrate groups on constant regions. These can increase solubility and affect how exposed constant-region domains interact with the environment.", "section": "Antibody structure", "id": 4}, {"lecture": 4, "q": "Which TCR binding pattern is most likely to trigger negative selection?", "options": ["Binding to free IgA in saliva", "Weak recognition compatible with survival", "High affinity for self MHC/self peptide complexes", "No recognition of self MHC"], "correct": 2, "why": "The lecture emphasizes apoptosis of cells with high-affinity self interactions rather than those with useful low-affinity MHC recognition.", "section": "", "id": 5}, {"lecture": 4, "q": "Which cytokines characterize Th17 in the lecture?", "options": ["IL-10 and TGF-β only", "IL-2 alone", "IL-17A, IL-17F, and IL-22", "IL-4 and IL-21 only"], "correct": 2, "why": "Th17 cells produce inflammatory cytokines such as IL-17A/F and IL-22 to protect barrier tissues.", "section": "", "id": 6}, {"lecture": 2, "q": "What should you know as the downstream consequence of NOD1/NOD2 activation?", "options": ["Direct secretion of IgM by NOD proteins", "MHC I removal from every healthy cell", "Inflammatory signaling and interferon-related gene expression", "Immediate perforin release from erythrocytes"], "correct": 2, "why": "The slides link NOD activation to NF-κB/MAP kinase and interferon outputs; detailed RIP2 kinase steps are excluded.", "section": "Pattern recognition receptors", "id": 7}, {"lecture": 5, "q": "A memory cell homes to the tissue where the pathogen first entered. Which classification fits?", "options": ["Central memory cell", "Tissue-resident memory cell", "Effector memory cell", "Pre-B cell"], "correct": 1, "why": "Tissue-resident memory cells localize to the original challenge site, placing them near likely future exposure.", "section": "Memory localization (5 questions)", "id": 8}, {"lecture": 3, "q": "What is passive immunization?", "options": ["Protection conferred by antibodies obtained from an external source", "Antibody production after one’s own vaccination", "Generation of V(D)J rearrangements in the fetus", "A permanent memory B-cell response to antigen"], "correct": 0, "why": "Maternal IgG crossing the placenta and antibodies delivered in milk protect the infant without requiring the infant to generate them.", "section": "Antibody effector functions", "id": 9}, {"lecture": 1, "q": "Which feature best identifies neutrophils in a stained blood sample?", "options": ["No nucleus and a role in clot formation", "Blue-staining granules and no phagocytic activity", "Multilobed nucleus and granules staining with acidic and basic dyes", "Bilobed nucleus with bright red granules"], "correct": 2, "why": "Neutrophils are polymorphonuclear granulocytes; eosinophils are typically bilobed, basophils stain blue, and platelets lack nuclei.", "section": "Myeloid cells and antigen presentation", "id": 10}, {"lecture": 5, "q": "Why does CD45RO favor a memory T-cell response?", "options": ["It binds IgE on mast cells", "It replaces the CD8 coreceptor", "It directly cleaves antigens into peptides", "It associates more avidly with the TCR and supports signal transduction"], "correct": 3, "why": "The lecture links CD45RO's stronger TCR association to more effective signal transmission.", "section": "Memory activation (12 questions)", "id": 11}, {"lecture": 4, "q": "How many subunits does the lecture assign to the CD3 signaling complex?", "options": ["Four", "Eight", "Six", "Two"], "correct": 2, "why": "The slides describe six subunits assembled from four protein types: ζ, γ, ε, and δ.", "section": "", "id": 12}, {"lecture": 1, "q": "Which combined set of functions is described for NKT cells?", "options": ["Only phagocytosis without signaling", "Cytotoxic degranulation plus cytokine secretion", "Antibody secretion plus erythrocyte production", "Bone formation plus blood-vessel lining"], "correct": 1, "why": "NKT cells can kill problematic cells and rapidly produce cytokines, combining properties of cytotoxic and helper/regulatory cells.", "section": "Lymphocytes and surface markers", "id": 13}, {"lecture": 2, "q": "Which interferon-induced enzyme promotes degradation of viral RNA?", "options": ["Factor P", "2′–5′ poly(A) synthetase pathway", "MASP-2", "C1r"], "correct": 1, "why": "The lecture associates 2′–5′ poly(A) synthetase with viral RNA degradation.", "section": "Inflammasome and interferon defense", "id": 14}, {"lecture": 3, "q": "Which IgG subclass is described as inactive for complement fixation?", "options": ["IgG3", "IgG4", "IgG1", "IgG2"], "correct": 1, "why": "Despite similar overall structure, IgG subclasses differ in Fc-mediated functions; the slides identify IgG4 as not active in complement fixation.", "section": "Immunoglobulin isotypes", "id": 15}, {"lecture": 5, "q": "Why is antibody affinity typically higher after repeated antigen exposure?", "options": ["All antigen molecules become smaller", "Each antibody binds more antigen molecules by gaining extra Fab arms", "Antibody genes lose their variable regions", "The response recruits previously selected, affinity-matured memory B-cell populations"], "correct": 3, "why": "The higher-affinity antibodies reflect prior immune selection and memory rather than an increase in antibody valency.", "section": "Primary secondary (5 questions)", "id": 16}, {"lecture": 1, "q": "At what thymic location are incoming T-cell progenitors deposited before migrating toward the subcapsular cortex?", "options": ["Splenic red pulp", "Bone-marrow endosteal niche", "Lymph-node follicle", "Corticomedullary junction"], "correct": 3, "why": "The lecture places incoming progenitors at the corticomedullary junction, where they become thymocytes.", "section": "Bone marrow and thymus", "id": 17}, {"lecture": 2, "q": "Which HSV protein reverses PKR-related translation inhibition by promoting eIF2α dephosphorylation?", "options": ["E7", "ICP34.5", "ICP47", "ICP27"], "correct": 1, "why": "ICP34.5 recruits a host phosphatase to restore eIF2α activity and viral protein synthesis.", "section": "HSV and HPV immune evasion", "id": 18}, {"lecture": 3, "q": "What does stem cell factor (SCF) bind on the developing B cell?", "options": ["FcγR", "c-Kit", "CD40L", "CD21"], "correct": 1, "why": "The lecture places c-Kit–SCF signaling before increased IL-7 receptor expression and IL-7-driven development.", "section": "B-cell development", "id": 19}, {"lecture": 4, "q": "Which sequence best describes MHC I processing?", "options": ["Ubiquitin tagging → proteasome → TAP → ER MHC I loading", "Phagocytosis → CLIP removal → MHC II loading → surface", "CD1 loading → IgA secretion → ER", "MHC II binding → lysosomal breakdown → TAP"], "correct": 0, "why": "Endogenous proteins are proteasomally processed, moved by TAP into ER, and loaded onto class I before surface transport.", "section": "", "id": 20}, {"lecture": 4, "q": "What is the goal of negative selection?", "options": ["Increase TCR somatic hypermutation", "Select cells that cannot bind any MHC", "Remove T cells with high-affinity self-reactivity", "Produce IgM-secreting plasma cells"], "correct": 2, "why": "Negative selection deletes strongly self-reactive thymocytes, reducing the risk of immune attack on normal tissues.", "section": "", "id": 21}, {"lecture": 1, "q": "What is the central fluid-balance function of the lymphatic system?", "options": ["Return excess tissue fluid to circulation to limit edema", "Digest all blood-borne antigen inside the thymus", "Replace blood arteries with lymph nodes", "Produce all erythrocytes after birth"], "correct": 0, "why": "Lymphatics drain fluid that has entered tissues, helping prevent excessive accumulation and swelling.", "section": "Lymphatic system and lymph nodes", "id": 22}, {"lecture": 2, "q": "Which material is an endogenous target for phagocytosis rather than an exogenous target?", "options": ["Dead tissue and cell debris", "Whole invading microorganisms", "Inhaled particulate dirt", "Extracellular bacterial capsules"], "correct": 0, "why": "The lecture includes clearance of damaged tissue, debris and clots as endogenous phagocytic work, alongside ingestion of exogenous microbes and particles.", "section": "Cytokines, chemotaxis, and phagocytosis", "id": 23}, {"lecture": 5, "q": "Which immune response is particularly emphasized for BCG vaccination?", "options": ["Absence of any T-cell response", "Direct complement activation by the vaccine alone", "Cell-mediated immunity against a macrophage-associated pathogen", "Exclusively IgE-mediated mast-cell degranulation"], "correct": 2, "why": "BCG stimulates prolonged CMI, consistent with the intracellular macrophage-associated infection described.", "section": "Vaccines conventional (14 questions)", "id": 24}, {"lecture": 3, "q": "Which of the following is the primary source of the vast pre-immune antibody repertoire?", "options": ["Transfer of antibody genes from pathogens", "A separate intact gene for every possible antibody", "Random rearrangement of immunoglobulin gene segments", "Only somatic hypermutation before B-cell maturation"], "correct": 2, "why": "V(D)J recombination generates many receptor sequences from limited genomic segments.", "section": "Antibody diversity", "id": 25}, {"lecture": 5, "q": "What substitution is made during in vitro transcription in the lecture's mRNA vaccine manufacturing scheme?", "options": ["It is an antibody linked to peroxidase", "It serves as a live viral carrier", "It encodes the viral envelope protein by itself", "It replaces uracil during production of modified mRNA"], "correct": 3, "why": "The slide explicitly identifies uracil replacement with N1-methyl-pseudouridine during in vitro transcription.", "section": "Recombinant vaccines (18 questions)", "id": 26}, {"lecture": 4, "q": "Which executioner caspase is described as the endpoint of the cascade?", "options": ["Caspase-1", "Caspase-9", "Caspase-8", "Caspase-3"], "correct": 3, "why": "Caspase-3 acts downstream of the initiating pathways and executes the death program.", "section": "", "id": 27}, {"lecture": 2, "q": "Which stimulus is paired with ILC1 activation in the slides?", "options": ["Prostaglandin E2", "IL-12", "IL-33", "IL-25"], "correct": 1, "why": "IL-12 activates ILC1, whereas IL-25/IL-33/PGD2 are associated with ILC2.", "section": "NK cells and innate lymphoid cells", "id": 28}, {"lecture": 3, "q": "What happens to resting naïve B cells when they receive activating signals?", "options": ["They stop expressing any surface receptor before activation", "They become thymocytes", "They immediately lose all DNA", "They leave G0, proliferate, and differentiate"], "correct": 3, "why": "Antigen recognition and appropriate second signals drive entry into the cell cycle and clonal expansion.", "section": "B-cell activation", "id": 29}, {"lecture": 1, "q": "Which antibody isotype is emphasized as a mucosal defense product in this lecture?", "options": ["IgE", "IgA", "IgD", "IgG4"], "correct": 1, "why": "MALT responses produce IgA that is secreted across mucosal surfaces to limit pathogen attachment.", "section": "Spleen and mucosal immunity", "id": 30}, {"lecture": 2, "q": "Which dendritic-cell signal combination is paired with Treg differentiation?", "options": ["TLR3 → C3a and C5a", "Dectin-1 → IL-6 and IL-23", "TLR2/TLR6 → IL-10 and TGF-β", "TLR4/TLR5 → IL-12 and IFN-γ"], "correct": 2, "why": "The lecture links TLR2/6 to regulatory cytokines and tolerance of normal microbial flora.", "section": "Innate–adaptive coordination", "id": 31}, {"lecture": 3, "q": "Which description best fits a centrocyte?", "options": ["A smaller, nondividing light-zone B cell with increased surface Ig", "A secreted pentameric immunoglobulin", "A macrophage carrying C3b-coated erythrocytes", "A dark-zone cell lacking surface Ig and dividing rapidly"], "correct": 0, "why": "Centrocytes display mutated BCRs for affinity-based selection in the light zone.", "section": "Germinal centers", "id": 32}, {"lecture": 5, "q": "Why were early diagnostic antibodies generated by injecting microbial proteins into animals?", "options": ["The animals' red cells converted into microbes", "Injected proteins immediately became monoclonal antibodies", "The proteins directly produced color without reagents", "Foreign proteins elicited antibodies that could later recognize those proteins"], "correct": 3, "why": "Immunization generates antibodies against the introduced antigen, which can then be harvested for assays.", "section": "Diagnostics foundation (3 questions)", "id": 33}, {"lecture": 4, "q": "What order best describes directed granule-mediated CTL killing?", "options": ["Antigen recognition → LFA-1/ICAM tight adhesion → granule and Golgi polarization → perforin-assisted granzyme delivery", "Granzyme release → antigen recognition → LFA-1 dissociation → Golgi polarization", "CD40 ligation → Ig class switching → perforin production by target cell", "HLA-DM removes CLIP → LFA-1 cleavage → caspase-9 export"], "correct": 0, "why": "TCR recognition increases LFA-1 affinity for ICAM and forms a conjugate. Cytotoxic granules and Golgi orient toward the contact; perforin facilitates granzyme access to the target.", "section": "", "id": 34}, {"lecture": 1, "q": "Which cell provides cytokine signals that help activate cytotoxic T cells and B cells?", "options": ["Cytotoxic T cell", "Natural killer cell", "Plasma cell", "Helper T cell"], "correct": 3, "why": "Helper T cells coordinate cellular and humoral responses through cytokine secretion.", "section": "Integrated antiviral immunity", "id": 35}, {"lecture": 5, "q": "After fusion, why must individual hybridoma clones be screened?", "options": ["HAT medium identifies antigen affinity directly", "Every clone automatically recognizes the same epitope", "Screening replaces the need for immortal cells", "Only some surviving clones produce antibody with the desired specificity"], "correct": 3, "why": "HAT selects viable hybrids, but a separate specificity screen finds the clone producing the desired antibody.", "section": "Monoclonal antibodies (9 questions)", "id": 36}, {"lecture": 3, "q": "Why can a B cell switch from IgM to a downstream isotype but not necessarily switch back to an upstream class?", "options": ["Switching deletes the variable-region antigen-binding site", "Class switching always requires a new heavy-chain V(D)J rearrangement", "The J chain irreversibly blocks membrane IgM", "Switch-region recombination loops out and deletes intervening constant-region DNA"], "correct": 3, "why": "Class-switch recombination preserves the assembled antigen-binding VDJ segment but deletes DNA between switch regions. Once an upstream constant-region segment is removed, that cell cannot recover it by reversing the switch.", "section": "Class switching and differentiation", "id": 37}, {"lecture": 1, "q": "Which vascular change produces much of the visible redness associated with acute inflammation?", "options": ["Vasodilation", "Diapedesis", "Margination", "Increased vascular permeability"], "correct": 0, "why": "Vasodilation increases local blood flow and contributes to erythema, distinct from edema caused by fluid leakage.", "section": "Inflammation and mediators", "id": 38}, {"lecture": 2, "q": "Which pathway begins with spontaneous C3 activation and uses Factors B and D?", "options": ["Lectin", "Classical", "Alternative", "Caspase-1"], "correct": 2, "why": "The alternative tickover pathway does not require antibody and uses C3 hydrolysis with B and D.", "section": "Complement origins and initiation", "id": 39}, {"lecture": 4, "q": "Which two components form MHC class I?", "options": ["An α chain and invariant chain as the final surface complex", "A TCR α and β heterodimer", "Two equal α and β transmembrane chains", "An α heavy chain and β2-microglobulin"], "correct": 3, "why": "Class I uses a membrane-anchored α chain associated with β2-microglobulin, which supports surface expression.", "section": "", "id": 40}, {"lecture": 1, "q": "Which cytokine pair produced by professional APCs is linked to Th17 differentiation in the periodontal example?", "options": ["IL-4 and IL-10", "IL-2 and IL-7", "IL-6 and IL-23", "IFN-α and IFN-β"], "correct": 2, "why": "The slide links P. gingivalis-associated stimulation with APC production of IL-6/IL-23 and a Th17-skewed response.", "section": "Oral inflammation", "id": 41}, {"lecture": 2, "q": "In the alternative pathway, which event creates the membrane-bound C3 convertase that properdin stabilizes?", "options": ["Factor D cleaves Factor B bound to surface C3b, leaving Bb in C3bBb", "C1s cleaves MBL to form C4bC2a", "C5b binds IgM to form C3bBb", "C1q converts C3a directly into properdin"], "correct": 0, "why": "Factor B binds deposited C3b, Factor D cleaves B and Bb remains bound, forming C3bBb. Properdin then stabilizes this otherwise unstable surface convertase.", "section": "Complement convertases and downstream outcomes", "id": 42}, {"lecture": 4, "q": "Which TCR heterodimer is expressed by the majority of T cells?", "options": ["Igα/Igβ", "γδ", "CD4/CD8", "αβ"], "correct": 3, "why": "The lecture identifies αβ as the predominant TCR; γδ occurs on a smaller population and has different antigen-recognition properties.", "section": "", "id": 43}, {"lecture": 3, "q": "How can salivary IgA slow plaque buildup?", "options": ["Directly killing all microbes by phagocytosis", "Inducing V(D)J rearrangement inside bacteria", "Neutralization and agglutination of biofilm-forming microbes", "Turning off salivary-gland secretion"], "correct": 2, "why": "IgA can bind organisms such as S. mutans and C. albicans, limiting attachment and promoting their clearance.", "section": "Oral humoral immunity", "id": 44}, {"lecture": 5, "q": "What causes a positive agglutination reaction?", "options": ["Antibodies cross-link multiple cells into visible clumps", "A fluorescent substrate emits light without antibody", "Antibodies dissolve every bacterial cell immediately", "An enzyme creates an insoluble gel ring"], "correct": 0, "why": "Antibody binding sites can bridge cells bearing the antigen, creating visible aggregates.", "section": "Agglutination (3 questions)", "id": 45}, {"lecture": 3, "q": "An antibody binds its antigen normally but fails to recruit phagocytes through Fc receptors. Which region is most likely functionally impaired?", "options": ["VH/VL antigen-binding surface", "Leader peptide after cleavage", "RSS spacer in germ-line DNA", "Heavy-chain constant region"], "correct": 3, "why": "Normal recognition indicates intact variable regions; Fc-mediated recruitment depends on the heavy-chain constant region.", "section": "Integrated exam-style applications", "id": 46}, {"lecture": 5, "q": "Which clinical condition is associated with HE4 in the lecture?", "options": ["Type I allergy", "Ovarian cancer", "Tetanus", "Poliomyelitis"], "correct": 1, "why": "The slides describe HE4 as a protein produced by ovarian cancer cells and measured using antibody-based capture.", "section": "ELISA (13 questions)", "id": 47}, {"lecture": 4, "q": "Which cytokines are associated with Tfh differentiation in the lecture?", "options": ["IL-12 and IFN-γ", "C3a and C5a", "IL-6 and IL-21", "IL-10 and TGF-β only"], "correct": 2, "why": "The slides assign IL-6 and IL-21 from follicular dendritic cells to Tfh differentiation, followed by Tfh IL-4/IL-21 output.", "section": "", "id": 48}, {"lecture": 1, "q": "How do cytokines guide HSC differentiation?", "options": ["They digest the extracellular matrix surrounding HSCs", "They directly replace genes in the stem-cell nucleus", "They transport mature cells through lymphatic vessels", "They bind surface receptors and alter transcription-factor-driven gene expression"], "correct": 3, "why": "Receptor signaling changes transcription and thus the differentiation program; cytokines are signals, not replacement DNA.", "section": "Organization and hematopoiesis", "id": 49}, {"lecture": 2, "q": "Which substance inhibits microbial growth by sequestering iron?", "options": ["Cathelicidin", "Histamine", "Lactoferrin", "Lysozyme"], "correct": 2, "why": "Lactoferrin is an iron-binding chelator; iron deprivation restricts microbial growth rather than directly degrading cell walls.", "section": "Innate barriers and antimicrobial substances", "id": 50}, {"lecture": 3, "q": "What is the immunoglobulin fold?", "options": ["A single uninterrupted α-helix", "A lipid bilayer around the antibody", "A triple-stranded DNA helix", "Two antiparallel β-pleated sheets packed as a sandwich"], "correct": 3, "why": "Hydrogen bonds and a disulfide bridge stabilize this recurring domain structure.", "section": "Antibody structure", "id": 51}, {"lecture": 5, "q": "What makes an immunofluorescence test positive in the lecture's organism-detection example?", "options": ["The specimen produces IgM without incubation", "An antibody-antigen complex produces a precipitin ring", "All organisms agglutinate into visible clumps", "Target organisms glow because fluorescent antibodies have bound them"], "correct": 3, "why": "A fluorophore-conjugated antibody binds the organism, making it visible under excitation light.", "section": "Immunofluorescence (6 questions)", "id": 52}, {"lecture": 1, "q": "Which monocyte subtype enters infected tissue rapidly in response to an immunological challenge?", "options": ["Patrolling monocyte", "Naïve B lymphocyte", "Inflammatory monocyte", "Central memory T cell"], "correct": 2, "why": "Inflammatory monocytes are recruited rapidly; patrolling monocytes survey vessels and may participate in repair or regulation.", "section": "Myeloid cells and antigen presentation", "id": 53}, {"lecture": 2, "q": "Which PAMP class is typically recognized by endosomal TLRs?", "options": ["Only sebum fatty acids", "IgA Fc regions", "Extracellular host MHC I", "Bacterial and viral nucleic acids exposed after degradation"], "correct": 3, "why": "Endosomal localization allows detection of internalized microbial material, particularly nucleic acids.", "section": "Pattern recognition receptors", "id": 54}, {"lecture": 4, "q": "Which antigen is emphasized as a target of γδ T cells?", "options": ["Only 8–10-residue peptides on MHC I", "Only soluble antibodies", "Lipids presented by CD1", "Only peptides presented by MHC II"], "correct": 2, "why": "The γδ binding cleft is described as deeper and narrower and can recognize less variable lipid antigens presented by CD1.", "section": "", "id": 55}, {"lecture": 1, "q": "Which B-cell surface complex is specifically associated with transducing activation signals from the BCR?", "options": ["CD16", "CD1", "CD8", "CD79α/β"], "correct": 3, "why": "CD79α/β transduces signals linked to membrane immunoglobulin recognition; the other markers have different roles.", "section": "Lymphocytes and surface markers", "id": 56}, {"lecture": 4, "q": "Which sequence correctly describes exogenous peptide presentation?", "options": ["Proteasome → TAP → ER class I binding → CD8 recognition", "Endocytosis → vesicle acidification and proteolysis → invariant-chain/CLIP removal by HLA-DM → class II peptide display", "RAG recombination → β2-microglobulin → class II peptide display", "Perforin release → granzyme entry → HLA-DM → class II display"], "correct": 1, "why": "The endocytic route digests extracellular material in acidified compartments. Class II is protected by invariant chain until CLIP is replaced through HLA-DM, permitting antigenic peptide display.", "section": "", "id": 57}, {"lecture": 3, "q": "Which complement fragment acts as an opsonin on a target?", "options": ["C3a", "C3b", "C4a", "C5a"], "correct": 1, "why": "C3b coats targets for recognition by complement receptors; C3a, C4a, and C5a are described as anaphylatoxins.", "section": "Antibody effector functions", "id": 58}, {"lecture": 5, "q": "At what antigen-antibody ratio is visible precipitation greatest?", "options": ["Extreme antigen excess", "Zone of equivalence", "Complete absence of antigen", "Extreme antibody excess"], "correct": 1, "why": "Balanced reactant concentrations allow an extended antigen-antibody lattice that precipitates.", "section": "Precipitation (5 questions)", "id": 59}, {"lecture": 2, "q": "Which cytosolic protein is described as promoting NLRP3 oligomerization?", "options": ["NEK7", "Properdin", "C1q", "STAT2"], "correct": 0, "why": "NEK7 helps NLRP3 oligomerize to form the inflammasome. Properdin stabilizes an alternative-pathway convertase, while C1q and STAT2 function elsewhere.", "section": "Inflammasome and interferon defense", "id": 60}, {"lecture": 3, "q": "Which antibody isotype is described as scarce in serum but present in the upper respiratory mucosa?", "options": ["IgA", "IgD", "IgG", "IgM"], "correct": 1, "why": "The lecture describes IgD-mediated opsonization and activation of basophils/mast cells in that location.", "section": "Immunoglobulin isotypes", "id": 61}, {"lecture": 5, "q": "What double-immunodiffusion pattern indicates antigenic identity?", "options": ["A spur indicating an unmatched epitope", "No antibody binding under any condition", "Two independent crossing straight lines", "Fused continuous precipitin line"], "correct": 3, "why": "Shared antigenic determinants produce a continuous line of identity.", "section": "Immunodiffusion (6 questions)", "id": 62}, {"lecture": 4, "q": "Which sequence correctly traces an endogenous viral peptide to surface presentation?", "options": ["Ubiquitin tagging → proteasome → TAP transport to ER → class I loading with tapasin assistance → surface", "Endocytosis → acidic vesicle → CLIP removal → class I loading → surface", "Ubiquitin tagging → HLA-DM → class II loading in nucleus → surface", "Proteasome → J chain → poly-Ig receptor → surface"], "correct": 0, "why": "Endogenous cytosolic proteins are tagged and degraded by proteasomes. TAP moves suitable peptides into the ER, where class I loading is assisted by tapasin before transport to the surface.", "section": "", "id": 63}, {"lecture": 1, "q": "Which stromal cell directl const $=id=>document.getElementById(id);
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
let order=[],index=0,missed=new Set(),roundWrong=new Set(),attempted=new Set(),answers=new Map(),reviewMode=false,firstCorrect=0;
function makeEntry(id){let perm=shuffle([0,1,2,3]);return {id,perm}}
function reset(){const ids=BANK.map((_,i)=>i);order=( $('mode').value==='shuffled'?shuffle(ids):ids).map(makeEntry);index=0;missed=new Set();roundWrong=new Set();attempted=new Set();answers=new Map();reviewMode=false;firstCorrect=0;show()}
function show(){if(index>=order.length){finish();return} $('study').classList.remove('hidden');$('end').classList.add('hidden');let e=order[index],q=BANK[e.id],answer=answers.get(e.id);$('counter').textContent=`${reviewMode?'Missed review · ':'Question '}${index+1} / ${order.length}`;$('question').textContent=q.q;const root=$('answers');root.replaceChildren();e.perm.forEach((original,pos)=>{const b=document.createElement('button');b.className='choice';const bold=document.createElement('b');bold.textContent='ABCD'[pos]+'.';b.append(bold,document.createTextNode(' '+q.options[original]));b.onclick=()=>choose(pos);if(answer!==undefined){b.disabled=true;if(original===q.correct)b.classList.add('correct');else if(pos===answer)b.classList.add('wrong')}root.append(b)});$('feedback').classList.toggle('hidden',answer===undefined);if(answer!==undefined){$('feedback').textContent=(e.perm[answer]===q.correct?'Correct. ':'Not quite. ')+q.why}else $('feedback').textContent='';$('next').disabled=answer===undefined;$('next').textContent=index===order.length-1?'Finish round ↓':'Next ↓';$('back').disabled=index===0;$('status').textContent=`${attempted.size} answered · ${missed.size} missed`; $('bar').style.width=(100*(index+1)/order.length)+'%'}
function choose(pos){let e=order[index];if(answers.has(e.id))return;answers.set(e.id,pos);attempted.add(e.id);if(!reviewMode&&e.perm[pos]===BANK[e.id].correct)firstCorrect++;if(e.perm[pos]!==BANK[e.id].correct){missed.add(e.id);roundWrong.add(e.id)}else missed.delete(e.id);show()}
function next(){if(index>=order.length)return;if(!answers.has(order[index].id))return;index++;show()}
function prev(){if(index>0){index--;show()}}
function finish(){ $('study').classList.add('hidden');$('end').classList.remove('hidden');$('endtitle').textContent=missed.size?'Round complete':'All questions mastered!';$('summary').textContent=`First-pass score: ${firstCorrect}/100 (${firstCorrect}%). ${missed.size} question(s) need review.`;$('review').classList.toggle('hidden',missed.size===0);$('status').textContent=missed.size?`${missed.size} to review`:'Mastered';$('bar').style.width='100%'}
function review(){if(!missed.size)return;order=shuffle([...missed]).map(makeEntry);index=0;attempted=new Set();roundWrong=new Set();answers=new Map();reviewMode=true;show()}
$('restart').onclick=reset;$('again').onclick=reset;$('review').onclick=review;$('next').onclick=next;$('back').onclick=prev;$('mode').onchange=reset;
document.addEventListener('keydown',ev=>{if(ev.altKey||ev.ctrlKey||ev.metaKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(ev.key==='ArrowUp'){ev.preventDefault();prev();return}if($('study').classList.contains('hidden')){if(ev.key==='ArrowDown'&&missed.size){ev.preventDefault();review()}return}if(ev.key==='ArrowDown'){ev.preventDefault();next();return}if(/^[1-4]$/.test(ev.key)){ev.preventDefault();if(answers.has(order[index].id))next();else choose(Number(ev.key)-1)}});
