<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Immunology Lecture 4 — Learn Deck</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color-scheme:light dark}body{margin:0;background:#f3f5fa;color:#19283e}main{max-width:820px;margin:auto;padding:22px 16px 60px}h1{font-size:clamp(1.5rem,4vw,2.25rem);margin-bottom:6px}.sub{color:#59677b}.panel{background:white;border:1px solid #dbe1e9;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 4px 20px #182d4610}button,select{font:inherit;border:1px solid #bac6d4;border-radius:11px;padding:12px 15px;background:white;color:#19283e;cursor:pointer}button:hover{border-color:#466fc3}button:focus-visible{outline:3px solid #6794ff}button.primary{background:#1b4f9d;color:white;border-color:#1b4f9d}button:disabled{opacity:.5;cursor:default}.toolbar,.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.choice{display:block;width:100%;text-align:left;margin:10px 0;line-height:1.45}.choice b{display:inline-block;width:27px}.choice.correct{border:2px solid #187b53;background:#e5f7ee}.choice.wrong{border:2px solid #bb3940;background:#fff0f0}.feedback{border-left:4px solid #285ea8;background:#edf4ff;padding:14px 16px;margin-top:15px;border-radius:6px;line-height:1.6}.muted{color:#66758b}.progress{height:9px;background:#dce4f0;border-radius:8px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#3975d0;width:0}.hidden{display:none}.kbd{font-size:.88rem;color:#58667b}.question{font-size:1.2rem;line-height:1.5;font-weight:700}.nav{justify-content:space-between;margin-top:20px}@media(prefers-color-scheme:dark){body{background:#111926;color:#e9f1ff}.panel,button,select{background:#202c3c;color:#f1f5fc;border-color:#47576b}.sub,.muted,.kbd{color:#aab9cf}.choice.correct{background:#123d30}.choice.wrong{background:#4d242b}.feedback{background:#243e5f}.progress{background:#3a485d}}</style></head><body><main><h1>Lecture 4 · Cell-Mediated Immunity</h1><div class="sub">117 questions · Offline Learn Deck · Source: lecture PowerPoint</div><div class="panel"><div class="toolbar"><label for="mode">Mode</label><select id="mode"><option value="ordered">Ordered learning</option><option value="shuffled">Shuffled testing</option></select><button id="restart">Restart deck</button><span id="status" class="muted"></span></div><div class="progress"><div id="bar" class="fill"></div></div><p class="kbd">Remote: 1–4 answer · After feedback, any 1–4 or ↓ advances · ↑ goes back · No Enter needed</p></div><div class="panel" id="study"><div id="counter" class="muted"></div><p class="question" id="question"></p><div id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="nav"><button id="back">← Previous</button><button id="next" class="primary" disabled>Next ↓</button></div></div><div class="panel hidden" id="end"><h2 id="endtitle">Round complete</h2><p id="summary"></p><div class="toolbar"><button id="review" class="primary">Review missed questions</button><button id="again">Restart full deck</button></div></div></main><script>
const BANK=[{"n": 1, "q": "Which TCR heterodimer is expressed by the majority of T cells?", "options": ["Igα/Igβ", "γδ", "CD4/CD8", "αβ"], "correct": 3, "why": "The lecture identifies αβ as the predominant TCR; γδ occurs on a smaller population and has different antigen-recognition properties."}, {"n": 2, "q": "What structural feature do αβ and γδ TCRs share?", "options": ["Both are secreted as pentamers", "Each chain has variable and constant immunoglobulin-fold domains", "Each chain has four constant domains", "Both contain β2-microglobulin"], "correct": 1, "why": "Both TCR classes are disulfide-linked heterodimers with V and C domains, unlike secreted antibodies or MHC class I."}, {"n": 3, "q": "Which antigen is emphasized as a target of γδ T cells?", "options": ["Only 8–10-residue peptides on MHC I", "Only soluble antibodies", "Lipids presented by CD1", "Only peptides presented by MHC II"], "correct": 2, "why": "The γδ binding cleft is described as deeper and narrower and can recognize less variable lipid antigens presented by CD1."}, {"n": 4, "q": "How does the antigen-binding site of γδ TCR differ from αβ TCR?", "options": ["It is absent", "It is identical to an Fc region", "It is deeper and narrower", "It is formed by β2-microglobulin"], "correct": 2, "why": "The lecture connects the narrower γδ binding site with reduced variability and recognition of certain lipids."}, {"n": 5, "q": "Which TCR chains rearrange V and J segments without a D segment?", "options": ["α and δ", "α and γ", "β and δ", "β and γ"], "correct": 1, "why": "Like immunoglobulin light chains, α and γ use V–J joining; β and δ resemble heavy chains and use V–D–J joining."}, {"n": 6, "q": "Which TCR chains undergo D–J joining followed by V–DJ joining?", "options": ["β and δ", "γ and δ", "α and β", "α and γ"], "correct": 0, "why": "β and δ genes include D segments; therefore they require the two-step rearrangement characteristic of VDJ assembly."}, {"n": 7, "q": "Why are αβ receptors more diverse than γδ receptors in this lecture?", "options": ["αβ receptors undergo somatic hypermutation", "α and β genes contain more available V/J segments than γ and δ", "γδ receptors cannot rearrange genes", "αβ receptors use immunoglobulin class switching"], "correct": 1, "why": "The professor attributes the greater αβ diversity to gene-segment availability, not somatic hypermutation or class switching."}, {"n": 8, "q": "Which event does NOT contribute to TCR diversity?", "options": ["N- and P-nucleotide addition", "Combinatorial joining", "Somatic hypermutation", "Junctional flexibility"], "correct": 2, "why": "The lecture explicitly states that TCRs do not undergo somatic hypermutation, unlike activated B-cell immunoglobulin genes."}, {"n": 9, "q": "Which principle helps ensure proper TCR gene-segment joining?", "options": ["Class-switch regions", "Recombination signal sequences (RSS)", "Invariant chain cleavage", "CD1 loading"], "correct": 1, "why": "RSS guide permissible recombination, whereas switch regions function in immunoglobulin isotype switching."}, {"n": 10, "q": "Why does a TCR need the CD3 accessory complex?", "options": ["Its own cytoplasmic tail is too short for effective signal transduction", "CD3 converts CD4 into CD8", "CD3 supplies the peptide-binding cleft", "CD3 transports peptides into the ER"], "correct": 0, "why": "The antigen-binding TCR has a short cytoplasmic segment; CD3 carries ITAMs that initiate intracellular signaling."}, {"n": 11, "q": "What signaling motif is found in the CD3 complex?", "options": ["CLIP", "J chain", "ITAM", "RSS"], "correct": 2, "why": "CD3 uses immunoreceptor tyrosine-based activation motifs to couple TCR engagement to tyrosine kinase signaling."}, {"n": 12, "q": "How many subunits does the lecture assign to the CD3 signaling complex?", "options": ["Four", "Eight", "Six", "Two"], "correct": 2, "why": "The slides describe six subunits assembled from four protein types: ζ, γ, ε, and δ."}, {"n": 13, "q": "What is the outcome of post-transcriptional splicing during TCR α-chain assembly?", "options": ["It introduces somatic hypermutations", "It connects leader, VJ, and constant-region coding sequences", "It cleaves the CD3 ITAM", "It adds a D gene segment"], "correct": 1, "why": "VJ recombination occurs at DNA level; splicing then assembles the mature transcript before translation and chain assembly."}, {"n": 14, "q": "Which statement distinguishes TCRs from B-cell receptors in the lecture?", "options": ["TCRs are secreted as pentamers", "TCRs exhibit allelic exclusion but not α/γ chain editing", "TCRs use Fc regions to recruit phagocytes", "TCRs class-switch after activation"], "correct": 1, "why": "The slides specifically note allelic exclusion and absence of α- or γ-chain editing, and do not describe TCR class switching."}, {"n": 15, "q": "Why was MHC initially discovered?", "options": ["It was first identified as a bacterial toxin", "It was discovered as a plasma complement protein", "Transplant acceptance and rejection depended on cell-surface differences", "It was identified as the B-cell J chain"], "correct": 2, "why": "The lecture introduces histocompatibility through transplantation, then explains MHC's physiological role in antigen presentation."}, {"n": 16, "q": "What is the primary immune function of MHC molecules?", "options": ["Rearrange TCR genes", "Secrete immunoglobulin into saliva", "Present antigenic peptides to T cells", "Directly perforate pathogen membranes"], "correct": 2, "why": "MHC displays peptide antigens for T-cell recognition; transplant rejection is a consequence of MHC differences, not its evolved purpose."}, {"n": 17, "q": "Which two components form MHC class I?", "options": ["An α chain and invariant chain as the final surface complex", "A TCR α and β heterodimer", "Two equal α and β transmembrane chains", "An α heavy chain and β2-microglobulin"], "correct": 3, "why": "Class I uses a membrane-anchored α chain associated with β2-microglobulin, which supports surface expression."}, {"n": 18, "q": "Which MHC I domains create the peptide-binding cleft?", "options": ["α2 and α3", "α3 and β2-microglobulin", "α1 and α2", "β1 and β2"], "correct": 2, "why": "The α1 and α2 domains form the peptide-binding groove; α3 instead contacts CD8."}, {"n": 19, "q": "Which MHC I domain contacts the CD8 coreceptor?", "options": ["α3", "α1", "β2-microglobulin", "α2"], "correct": 0, "why": "The lecture identifies α3 as the CD8 contact point, distinguishing coreceptor binding from the α1/α2 peptide groove."}, {"n": 20, "q": "What peptide length is characteristic of MHC I binding in the slides?", "options": ["30–50 amino acids", "8–10 amino acids", "Whole undigested proteins", "13–18 amino acids"], "correct": 1, "why": "The closed-ended class I cleft accommodates relatively short peptides, unlike the more open MHC II groove."}, {"n": 21, "q": "Which domains form the MHC II peptide-binding cleft?", "options": ["β1 and β2", "α2 and β2", "α1 and β1", "α1 and α2"], "correct": 2, "why": "MHC II is a two-transmembrane-chain complex; the α1 and β1 domains create its peptide-binding groove."}, {"n": 22, "q": "Why can MHC II bind longer peptides than MHC I?", "options": ["Its peptide-binding cleft is open at the ends", "It binds only lipids", "It lacks a peptide-binding groove", "It uses β2-microglobulin to widen the cleft"], "correct": 0, "why": "The professor contrasts the open MHC II cleft with the closed MHC I cleft, allowing peptides around 13–18 residues."}, {"n": 23, "q": "Which peptide length is emphasized for MHC II?", "options": ["More than 100 intact amino acids", "8–10 amino acids", "Exactly 3 amino acids", "13–18 amino acids"], "correct": 3, "why": "The class II groove can accommodate longer processed peptides than the class I groove."}, {"n": 24, "q": "Which cells usually express MHC I?", "options": ["Only mature erythrocytes", "Only professional APCs", "Most nucleated cells", "Only plasma cells"], "correct": 2, "why": "Class I is broadly distributed among nucleated cells, allowing CD8 T cells to monitor altered self."}, {"n": 25, "q": "Which group contains the three professional APC types listed in the lecture?", "options": ["Neutrophils, red blood cells, platelets", "CTLs, plasma cells, sperm", "Dendritic cells, B cells, macrophages", "Fibroblasts, erythrocytes, keratin"], "correct": 2, "why": "The lecture identifies dendritic cells, B cells, and macrophages as professional APCs with class II presentation and costimulatory capability."}, {"n": 26, "q": "Which professional APC constitutively expresses both class II and costimulatory factors?", "options": ["Dendritic cell", "Pre-B cell", "Mature red blood cell", "Resting macrophage"], "correct": 0, "why": "Dendritic cells are presented as the most effective APCs; B cells and macrophages need activation for full costimulatory function."}, {"n": 27, "q": "What happens to macrophage MHC II expression after antigen encounter?", "options": ["It is permanently eliminated", "It becomes a secreted antibody", "It rises dramatically", "It changes into MHC I"], "correct": 2, "why": "The lecture contrasts low expression on unstimulated macrophages with increased class II expression after activation."}, {"n": 28, "q": "What does 'promiscuous' MHC peptide binding mean?", "options": ["One TCR recognizes every peptide", "One MHC molecule can bind many distinct peptides", "MHC class I binds whole bacterial cells", "MHC only binds a single fixed peptide"], "correct": 1, "why": "A limited set of MHC molecules can display many peptides, enabling recognition by a highly diverse T-cell repertoire."}, {"n": 29, "q": "Which MHC class is associated with CD4 helper T cells?", "options": ["MHC II", "MHC I", "Neither class", "CD1 only"], "correct": 0, "why": "The lecture establishes CD4 cells as class II restricted, whereas CD8 cytotoxic T cells are class I restricted."}, {"n": 30, "q": "Which MHC class is associated with CD8 cytotoxic T cells?", "options": ["MHC II", "Neither class", "MHC I", "Secretory IgA"], "correct": 2, "why": "CD8 T cells survey peptides on MHC I, the pathway commonly used by infected target cells."}, {"n": 31, "q": "What distinguishes a true APC from a typical MHC I target cell in the lecture?", "options": ["Absence of any MHC molecule", "Production of secreted IgM", "Class II presentation together with costimulatory signaling", "Expression of class I alone"], "correct": 2, "why": "The lecture requires class II plus a costimulatory signal for APC function; MHC I target cells may present antigen but chiefly undergo destruction."}, {"n": 32, "q": "What is the main outcome when a CTL recognizes an altered MHC I target cell?", "options": ["Antibody class switching in the target", "Secretion of J chain", "Conversion of the target to a plasma cell", "Destruction of the target cell"], "correct": 3, "why": "Class I presentation identifies altered self to cytotoxic T cells, which can kill infected or transformed targets."}, {"n": 33, "q": "Which antigens are usually presented by the cytosolic pathway?", "options": ["Endogenous proteins made within the cell", "Extracellular proteins engulfed into phagolysosomes", "Antibody Fc domains alone", "Intact extracellular bacteria"], "correct": 0, "why": "The endogenous route processes cytosolic proteins for MHC I, distinguishing it from exogenous MHC II presentation."}, {"n": 34, "q": "Which sequence best describes MHC I processing?", "options": ["Ubiquitin tagging → proteasome → TAP → ER MHC I loading", "Phagocytosis → CLIP removal → MHC II loading → surface", "CD1 loading → IgA secretion → ER", "MHC II binding → lysosomal breakdown → TAP"], "correct": 0, "why": "Endogenous proteins are proteasomally processed, moved by TAP into ER, and loaded onto class I before surface transport."}, {"n": 35, "q": "What transports cytosolic peptides into the ER for MHC I loading?", "options": ["TAP complex", "Invariant chain", "HLA-DM", "CD40L"], "correct": 0, "why": "TAP moves proteasome-generated peptides into the ER; HLA-DM instead facilitates MHC II peptide exchange."}, {"n": 36, "q": "What role does tapasin play in class I antigen presentation?", "options": ["Degrades exogenous antigen in lysosomes", "Acts as the CD8 coreceptor", "Removes CLIP from MHC II", "Links assembled MHC I with the TAP peptide-loading complex"], "correct": 3, "why": "Tapasin connects MHC I to the ER loading machinery and is released after peptide loading."}, {"n": 37, "q": "Which pathway processes exogenous proteins for MHC II?", "options": ["Cytosolic ubiquitination and proteasome only", "TCR rearrangement in the thymus", "Endocytosis/phagocytosis and acid-dependent vesicular degradation", "Direct loading of whole pathogens into class I"], "correct": 2, "why": "Exogenous antigens enter vesicles, are degraded in acidified compartments, and are loaded onto class II."}, {"n": 38, "q": "Why does MHC II associate with invariant chain in the ER?", "options": ["To serve as the final antigenic peptide", "To replace the α and β chains", "To occupy/protect the binding groove before exogenous peptide loading", "To activate perforin"], "correct": 2, "why": "Invariant chain prevents premature peptide occupancy during trafficking; its residual CLIP is later exchanged."}, {"n": 39, "q": "What is CLIP?", "options": ["A cytotoxic granule protein", "The peptide transporter in the ER", "A TCR recombination signal", "A fragment of invariant chain left in the MHC II binding groove"], "correct": 3, "why": "CLIP remains after invariant-chain degradation and must be displaced to load exogenous antigen."}, {"n": 40, "q": "Which molecule facilitates displacement of CLIP by exogenous peptide?", "options": ["HLA-DM", "TAP", "β2-microglobulin", "Tapasin"], "correct": 0, "why": "HLA-DM promotes exchange of CLIP for processed peptide in the MHC II endocytic pathway."}, {"n": 41, "q": "Why must most protein antigens be processed before MHC presentation?", "options": ["MHC clefts accommodate short peptides, not most intact proteins", "T cells recognize only whole bacteria", "Antigens must become antibodies first", "MHC cannot bind any protein-derived material"], "correct": 0, "why": "The slides contrast typical large antigens with the 8–18-residue peptides accommodated by MHC grooves."}, {"n": 42, "q": "Which situation best illustrates an MHC I target cell rather than a professional APC?", "options": ["Activated macrophage displaying class II peptide", "Virus-infected epithelial cell displaying endogenous peptide", "Dendritic cell presenting engulfed bacterial peptide on MHC II", "Activated B cell presenting peptide with costimulation"], "correct": 1, "why": "An infected epithelial cell can display intracellular antigen on MHC I and be killed by CD8 CTLs without functioning as a professional APC."}, {"n": 43, "q": "Where do T-cell precursors undergo the maturation described in this lecture?", "options": ["Bone marrow exclusively", "Salivary glands", "Spleen red pulp", "Thymus"], "correct": 3, "why": "Precursors migrate to the thymus and become thymocytes, where TCR assembly and selection occur."}, {"n": 44, "q": "What defines a double-negative thymocyte?", "options": ["Only CD4 is expressed", "Only CD8 is expressed", "Both CD4 and CD8 are expressed", "Neither CD4 nor CD8 is expressed"], "correct": 3, "why": "Double-negative denotes lack of both coreceptors, characteristic of early thymocyte development."}, {"n": 45, "q": "Which early thymocyte receptor binds a growth-factor signal in the lecture?", "options": ["c-Kit", "CD8", "HLA-DM", "FcγR"], "correct": 0, "why": "Early DN cells express c-Kit along with CD44 and CD25 before later TCR rearrangement steps."}, {"n": 46, "q": "Which changes accompany initiation of TCR gene rearrangement?", "options": ["CD4 and CD8 are both immediately lost", "RAG1/2 expression increases as c-Kit and CD44 decrease", "RAG1/2 disappear permanently before rearrangement", "MHC I becomes an antibody"], "correct": 1, "why": "The slide links altered surface-marker expression with RAG activation and TCR gene rearrangement."}, {"n": 47, "q": "What happens when a thymocyte fails to assemble a functional TCR β chain?", "options": ["It class-switches to IgG", "It becomes a mature plasma cell", "It undergoes apoptosis", "It directly becomes a CTL"], "correct": 2, "why": "Successful β-chain assembly is a checkpoint; cells failing this step are eliminated."}, {"n": 48, "q": "What pairs with a newly assembled TCR β chain to form the pre-TCR?", "options": ["Igβ", "Pre-Tα", "Invariant chain", "β2-microglobulin"], "correct": 1, "why": "Pre-Tα substitutes for the eventual α chain at the pre-TCR checkpoint and signals with CD3."}, {"n": 49, "q": "What is a key consequence of pre-TCR signaling?", "options": ["The cell immediately becomes a plasma cell", "MHC II is secreted", "Somatic hypermutation begins", "Further β rearrangement is prevented and α rearrangement is initiated"], "correct": 3, "why": "The pre-TCR checkpoint enforces β-chain allelic exclusion and allows progression toward complete αβ receptor assembly."}, {"n": 50, "q": "What defines a double-positive thymocyte?", "options": ["Only CD8 is expressed", "Both CD4 and CD8 are expressed", "Only CD4 is expressed", "Neither CD4 nor CD8 is expressed"], "correct": 1, "why": "After pre-TCR progression, thymocytes express both coreceptors before selection produces single-positive cells."}, {"n": 51, "q": "Why does the lecture connect proliferation with temporary interruption of α-chain rearrangement?", "options": ["MHC II prevents transcription of β chain", "RAG2 becomes unstable during proliferation", "CD1 removes all RSS sequences", "TAP destroys the α-chain DNA"], "correct": 1, "why": "The slides describe RAG2 instability during cycling and stabilization when proliferation stops, allowing α rearrangement."}, {"n": 52, "q": "What is the goal of positive selection?", "options": ["Select cells that bind self peptide with very high affinity", "Convert TCRs into antibodies", "Retain T cells able to recognize self MHC", "Eliminate every cell that binds MHC"], "correct": 2, "why": "Positive selection preserves useful MHC recognition, a prerequisite for subsequent peptide-specific responses."}, {"n": 53, "q": "What happens if a thymocyte cannot interact adequately with self MHC?", "options": ["It is automatically selected as CD8", "It becomes a B cell", "It dies by apoptosis", "It bypasses thymic selection"], "correct": 2, "why": "Failure to recognize self MHC means the TCR cannot function in that host's MHC context."}, {"n": 54, "q": "What is the goal of negative selection?", "options": ["Increase TCR somatic hypermutation", "Select cells that cannot bind any MHC", "Remove T cells with high-affinity self-reactivity", "Produce IgM-secreting plasma cells"], "correct": 2, "why": "Negative selection deletes strongly self-reactive thymocytes, reducing the risk of immune attack on normal tissues."}, {"n": 55, "q": "Which TCR binding pattern is most likely to trigger negative selection?", "options": ["Binding to free IgA in saliva", "Weak recognition compatible with survival", "High affinity for self MHC/self peptide complexes", "No recognition of self MHC"], "correct": 2, "why": "The lecture emphasizes apoptosis of cells with high-affinity self interactions rather than those with useful low-affinity MHC recognition."}, {"n": 56, "q": "Which mature T-cell types emerge after thymic selection?", "options": ["Single-positive CD4+ and CD8+ cells", "Double-positive CD4+CD8+ cells only", "IgM+ and IgD+ B cells", "CD1+ erythrocytes"], "correct": 0, "why": "Successful selection yields CD4 or CD8 single-positive T cells with distinct MHC restrictions."}, {"n": 57, "q": "Why is thymic MHC expression important for later T-cell responses?", "options": ["It determines the MHC restriction of the surviving repertoire", "It directly makes all antigens immunogenic", "It causes antibody secretion", "It removes the need for peptide presentation"], "correct": 0, "why": "Selection on host thymic MHC shapes which MHC molecules mature T cells can recognize."}, {"n": 58, "q": "Which comparison correctly pairs thymic selection mechanisms?", "options": ["Positive: class switch; negative: somatic hypermutation", "Positive: recognize self MHC; negative: avoid strong self-peptide reactivity", "Positive: perforin release; negative: granzyme uptake", "Positive: eliminate all MHC binding; negative: retain strongest self binding"], "correct": 1, "why": "The two checkpoints select for useful MHC restriction while eliminating dangerous high-affinity self reactivity."}, {"n": 59, "q": "What begins activation of a naïve T cell?", "options": ["Antibody J-chain secretion", "Direct perforin insertion", "Free antigen binding Fc region alone", "TCR recognition of peptide–MHC plus accessory signals"], "correct": 3, "why": "The lecture states that TCR–MHC–peptide interaction is necessary but insufficient; accessory stabilization and signaling are also required."}, {"n": 60, "q": "What is the cell-cycle state of circulating naïve T cells?", "options": ["G0", "M phase continuously", "S phase continuously", "G2 only"], "correct": 0, "why": "Naïve cells are resting in G0 until appropriate antigen stimulation initiates proliferation."}, {"n": 61, "q": "Which cytokine and receptor rise during initial T-cell activation?", "options": ["C3b and CR1", "IL-2 and IL-2R", "IL-17 and TAP", "IL-4 and FcαRI"], "correct": 1, "why": "Activated T cells produce IL-2 and its receptor, establishing a proliferative feedback response."}, {"n": 62, "q": "What is a major consequence of IL-2 binding IL-2R on activated T cells?", "options": ["Direct peptide transport into ER", "Permanent arrest in G0", "Rapid proliferation and differentiation", "MHC II invariant-chain cleavage"], "correct": 2, "why": "IL-2 supports clonal expansion after antigen-driven activation, generating effector and memory populations."}, {"n": 63, "q": "Which helper subset is emphasized for intracellular pathogen defense and cell-mediated immunity?", "options": ["Treg", "Tfh", "Th1", "Th2"], "correct": 2, "why": "Th1 cells promote cell-mediated responses and help generate cytotoxic effectors against intracellular pathogens."}, {"n": 64, "q": "Which helper subset is emphasized for humoral immunity against extracellular pathogens?", "options": ["Th1", "Th2", "CTL", "Treg"], "correct": 1, "why": "Th2 cytokines support B-cell responses and antibody production against extracellular challenges."}, {"n": 65, "q": "Which helper subset protects barrier tissues including gums and mucosa?", "options": ["Tfh only", "Th1 only", "Th17", "CD8 CTL only"], "correct": 2, "why": "The lecture specifically links Th17 inflammation to skin, gingiva, and mucous membranes, with excess activity contributing to autoimmunity."}, {"n": 66, "q": "Which cytokines characterize Th17 in the lecture?", "options": ["IL-10 and TGF-β only", "IL-2 alone", "IL-17A, IL-17F, and IL-22", "IL-4 and IL-21 only"], "correct": 2, "why": "Th17 cells produce inflammatory cytokines such as IL-17A/F and IL-22 to protect barrier tissues."}, {"n": 67, "q": "Which helper subset regulates germinal-center affinity maturation?", "options": ["Th1", "Tfh", "CTL", "Th17"], "correct": 1, "why": "Follicular helper T cells support B-cell somatic hypermutation and affinity maturation in secondary lymphoid organs."}, {"n": 68, "q": "Which cytokines are highlighted as Tfh products?", "options": ["IL-4 and IL-21", "Perforin and granzyme", "IFN-α and IFN-β exclusively", "C3a and C5a"], "correct": 0, "why": "The slides name IL-4 and IL-21 as Tfh products involved in germinal-center B-cell regulation."}, {"n": 69, "q": "Which subset suppresses inflammation and promotes tolerance to normal microbiota?", "options": ["CTL", "Treg", "Th17", "Th1"], "correct": 1, "why": "Treg cells produce suppressive cytokines and help limit unnecessary responses to commensal microbes."}, {"n": 70, "q": "Which cytokine pair is characteristic of Treg function in this lecture?", "options": ["Perforin and granzyme", "IL-4 and IL-21", "IL-10 and TGF-β", "IL-17A and IL-22"], "correct": 2, "why": "IL-10 and TGF-β mediate suppression and tolerance rather than direct cytotoxic killing."}, {"n": 71, "q": "Which helper subset can contribute to autoimmune disease when excessively activated?", "options": ["Th17", "CD4-negative thymocyte only", "Tfh exclusively", "Th2 exclusively"], "correct": 0, "why": "The lecture explicitly notes that overzealous Th17 inflammatory activity can progress toward autoimmunity."}, {"n": 72, "q": "Which pairing best distinguishes Th1 from Th2?", "options": ["Th1: cell-mediated/intracellular; Th2: humoral/extracellular", "Th1: CD1 loading; Th2: TAP transport", "Th1: Treg suppression; Th2: thymic selection", "Th1: antibody secretion; Th2: target-cell perforation"], "correct": 0, "why": "The professor organizes these subsets by the immune response they support and the pathogen location they address."}, {"n": 73, "q": "Which dendritic-cell PRR/cytokine sequence is linked to Th1 differentiation in the slides?", "options": ["TLR4/5 → IL-12 → Th1", "TLR2/6 → IL-17 → Th1", "Dectin-1 → IL-10 → Th1", "TLR2/1 → TGF-β → Th1"], "correct": 0, "why": "The lecture maps extracellular bacterial recognition by TLR4 or TLR5 to IL-12 production and a Th1 response."}, {"n": 74, "q": "Which sequence is linked to helminth-associated Th2 differentiation in the slides?", "options": ["TLR2/6 → TGF-β → Th2", "Dectin-1 → IL-23 → Th2", "TLR2/1 → IL-10 → Th2", "TLR4/5 → IL-12 → Th2"], "correct": 2, "why": "The professor's specific pathway associates helminth recognition with TLR2/1, IL-10, and commitment to Th2."}, {"n": 75, "q": "Which sequence is linked to fungal Th17 differentiation?", "options": ["Dectin-1 → IL-6/IL-23 → Th17", "CD1 → IL-2 → Th17", "TLR4 → IL-12 → Th17", "TLR2/1 → IL-10 → Th17"], "correct": 0, "why": "Fungal carbohydrates activate Dectin-1, which the slides connect to IL-6/IL-23 and inflammatory Th17 differentiation."}, {"n": 76, "q": "Which sequence is linked to Treg differentiation and microbiota tolerance?", "options": ["TLR4/5 → IL-12 → Treg", "Dectin-1 → IL-23 → Treg", "TAP → IL-2 → Treg", "TLR2/6 → IL-10/TGF-β → Treg"], "correct": 3, "why": "The professor links TLR2/6 activation to IL-10/TGF-β and regulatory tolerance."}, {"n": 77, "q": "Which cytokines are associated with Tfh differentiation in the lecture?", "options": ["IL-12 and IFN-γ", "C3a and C5a", "IL-6 and IL-21", "IL-10 and TGF-β only"], "correct": 2, "why": "The slides assign IL-6 and IL-21 from follicular dendritic cells to Tfh differentiation, followed by Tfh IL-4/IL-21 output."}, {"n": 78, "q": "Why can different PRRs on dendritic cells lead to different adaptive responses?", "options": ["PRRs directly rearrange TCR genes", "They induce distinct cytokine environments that direct T-cell differentiation", "PRRs replace the need for antigen presentation", "All PRRs activate identical helper subsets"], "correct": 1, "why": "The lecture's central comparison is PRR → instructive cytokine → helper T-cell fate → specialized immune response."}, {"n": 79, "q": "Why are naïve CD8 T cells described as CTL precursors (CTL-P)?", "options": ["They are not yet competent for cytotoxic killing", "They secrete pentameric IgM", "They cannot express TCRs", "They already contain full killing granules"], "correct": 0, "why": "The lecture states that thymus-derived naïve CD8 cells require activation and differentiation before becoming effector CTLs."}, {"n": 80, "q": "What is the initial antigen-specific signal for CTL-P activation?", "options": ["IgA binding the poly-Ig receptor", "TCR/CD8 recognition of peptide–MHC I with costimulation", "C3b deposition alone", "CLIP removal from MHC II"], "correct": 1, "why": "CD8 precursor activation requires cognate peptide–MHC I recognition and costimulation before subsequent IL-2-driven differentiation."}, {"n": 81, "q": "Why does increased IL-2Rα matter during CTL-P activation?", "options": ["It removes self-reactive thymocytes", "It makes the precursor responsive to IL-2 differentiation signals", "It converts MHC I to MHC II", "It directly forms perforin pores"], "correct": 1, "why": "The first activation signal induces IL-2Rα, preparing CTL-P to receive IL-2 and become an effector."}, {"n": 82, "q": "Which cell-derived cytokine is emphasized as the second CTL differentiation signal?", "options": ["IL-2 from Th1 cells", "IL-10 from Treg cells", "IL-4 from Tfh only", "IL-17 from Th17 cells"], "correct": 0, "why": "The professor specifically attributes the differentiation-driving IL-2 signal to Th1 support."}, {"n": 83, "q": "What creates tight CTL–target adhesion during conjugate formation?", "options": ["CLIP binding HLA-DM", "IgA binding secretory component", "TAP binding tapasin", "Activated LFA-1 binding ICAM"], "correct": 3, "why": "Antigen recognition increases LFA-1 affinity for ICAM, stabilizing the killing interface."}, {"n": 84, "q": "What is meant by CTL conjugate formation?", "options": ["TCR α-chain rearrangement", "Binding of complement to red blood cells", "Class switching of the target cell", "Stable adhesion between CTL and its recognized target"], "correct": 3, "why": "Conjugate formation follows recognition and tight adhesion, allowing directed cytotoxic granule release."}, {"n": 85, "q": "What happens during cytoplasmic rearrangement after CTL conjugate formation?", "options": ["MHC I is replaced by IgM", "The target synthesizes CD3", "Granules move to the interface and Golgi reorients toward the target", "The CTL loses its TCR permanently"], "correct": 2, "why": "Polarization directs cytotoxic contents toward the target rather than releasing them indiscriminately."}, {"n": 86, "q": "Which two granule components are central to CTL cytotoxicity?", "options": ["IL-10 and TGF-β", "Invariant chain and CLIP", "C3b and C5a", "Perforin and granzymes"], "correct": 3, "why": "Perforin creates an entry route and granzymes execute intracellular killing, distinguishing CTLs from complement lysis."}, {"n": 87, "q": "What does perforin primarily accomplish in the lecture?", "options": ["Directly recombines VDJ segments", "Creates membrane pores allowing granzyme entry", "Replaces TAP transport", "Binds CD4 on helper cells"], "correct": 1, "why": "The professor emphasizes that perforin pores alone are usually insufficient; they facilitate granzyme access."}, {"n": 88, "q": "What is the relationship between perforin and complement C9?", "options": ["C9 is a TCR coreceptor", "They have similar pore-forming structures", "They are the same molecule", "Perforin is a class II chaperone"], "correct": 1, "why": "The lecture draws a structural analogy between perforin and the pore-forming complement protein C9."}, {"n": 89, "q": "What triggers perforin membrane insertion?", "options": ["CD40–CD40L engagement in a germinal center", "Calcium-dependent conformational change on target-membrane contact", "HLA-DM removal of CLIP", "RSS recombination"], "correct": 1, "why": "The slides connect target contact and calcium-dependent conformational change with membrane insertion."}, {"n": 90, "q": "Which sequence best describes the granule-mediated killing process?", "options": ["Degranulation → thymic selection → antigen recognition → polarization", "Recognition → LFA-1/ICAM adhesion → polarization → degranulation", "CLIP removal → TAP transport → cytokine suppression", "Class switching → antibody secretion → perforin synthesis in target"], "correct": 1, "why": "The ordered steps explain how CTLs deliver killing molecules precisely to an antigen-bearing target."}, {"n": 91, "q": "Which interaction can trigger the extrinsic apoptotic pathway?", "options": ["FasL on effector cell binding Fas on target cell", "CD4 binding MHC I α3", "IgA binding poly-Ig receptor", "TAP binding a proteasome"], "correct": 0, "why": "The lecture describes Fas–FasL engagement as a death-receptor signal distinct from granule-mediated cytotoxicity."}, {"n": 92, "q": "What is the role of FADD after Fas engagement?", "options": ["Recruit/activate the pathway leading to caspase-8", "Transport peptides into ER", "Create perforin pores", "Bind the TCR antigenic peptide"], "correct": 0, "why": "FADD is the death-domain adaptor linking activated Fas to the caspase cascade."}, {"n": 93, "q": "Which initiator caspase is emphasized in the Fas pathway?", "options": ["Caspase-9", "Caspase-8", "Caspase-3", "Caspase-1"], "correct": 1, "why": "Fas/FADD signaling activates caspase-8, which propagates apoptosis and can also cleave Bid."}, {"n": 94, "q": "Which executioner caspase is described as the endpoint of the cascade?", "options": ["Caspase-1", "Caspase-9", "Caspase-8", "Caspase-3"], "correct": 3, "why": "Caspase-3 acts downstream of the initiating pathways and executes the death program."}, {"n": 95, "q": "How can caspase-8 connect the Fas pathway to mitochondria?", "options": ["It cleaves Bid to a truncated form that acts on mitochondria", "It removes invariant chain from class II", "It converts CD8 into CD4", "It transports peptides via TAP"], "correct": 0, "why": "Truncated Bid links death-receptor signaling to the mitochondrial apoptotic machinery."}, {"n": 96, "q": "Which mitochondrial molecule associates with Apaf-1 in the lecture?", "options": ["β2-microglobulin", "Cytochrome c", "IL-2Rα", "CLIP"], "correct": 1, "why": "Released cytochrome c works with Apaf-1 to activate caspase-9 in the mitochondrial pathway."}, {"n": 97, "q": "Which initiator caspase is associated with the mitochondrial Apaf-1 pathway?", "options": ["Caspase-8", "Caspase-9", "Caspase-1", "Caspase-3"], "correct": 1, "why": "Cytochrome c/Apaf-1 promotes caspase-9 activation, which subsequently activates caspase-3."}, {"n": 98, "q": "Which comparison correctly distinguishes the two apoptosis routes?", "options": ["Fas/FADD begins with caspase-8; mitochondrial cytochrome c/Apaf-1 involves caspase-9", "Both routes depend on antibody J chain", "Fas begins with caspase-9; mitochondria require TAP", "Neither route activates caspase-3"], "correct": 0, "why": "The pathways have distinct initiators but converge on the executioner caspase-3."}, {"n": 99, "q": "Which additional mitochondrial product is named alongside cytochrome c?", "options": ["Invariant chain", "Secretory component", "Apoptosis-inducing factor (AIF)", "CD79a"], "correct": 2, "why": "The professor identifies AIF and cytochrome c as mitochondrial products involved in apoptosis."}, {"n": 100, "q": "Which statement about peripheral γδ T-cell antigen recognition matches the slides?", "options": ["They cannot recognize proteins", "They may recognize CD1-presented lipids or soluble antigen", "They only recognize MHC II-bound 13–18-mer peptides", "They require MHC I for every antigen"], "correct": 1, "why": "The professor contrasts γδ recognition of lipids and some peptides, including nonclassical presentation, with conventional αβ MHC restriction."}, {"n": 101, "q": "How are conventional αβ T cells described in comparison with γδ T cells?", "options": ["αβ cells use Fc receptors as antigen receptors", "αβ cells only recognize soluble lipids", "αβ cells do not undergo gene rearrangement", "αβ cells recognize peptides in MHC context"], "correct": 3, "why": "The lecture stresses MHC restriction of αβ T cells versus broader recognition modes for some γδ cells."}, {"n": 102, "q": "Which unusual potential role of γδ T cells is mentioned near the end of the lecture?", "options": ["They synthesize MHC II invariant chain in the ER of every cell", "They secrete pentameric IgM", "They generate erythrocytes", "They may act as antigen-presenting cells"], "correct": 3, "why": "The final slide notes emerging data suggesting some γδ T cells may have APC-like functions."}, {"n": 103, "q": "A virus-infected epithelial cell displays an endogenous peptide. Which response best follows the lecture?", "options": ["CD1 presentation to a plasma cell", "CLIP binding directly activates neutrophils", "MHC I presentation to CD8 CTL, followed by targeted killing", "MHC II presentation to naïve B cells, followed by IgA switching"], "correct": 2, "why": "Endogenous viral peptides follow the MHC I pathway and can identify infected cells to cytotoxic CD8 effectors."}, {"n": 104, "q": "A dendritic cell engulfs extracellular fungal material and promotes gingival barrier inflammation. Which combination fits the lecture?", "options": ["CD1 only plus IgM pentamerization", "TAP loading plus IL-10–driven CTL", "MHC II presentation plus Dectin-1/IL-6/IL-23–driven Th17 response", "MHC I only plus TLR2/6–driven Th1"], "correct": 2, "why": "Exogenous antigen presentation activates helper T cells, while fungal Dectin-1 signaling instructs Th17 differentiation relevant to gums and mucosa."}, {"n": 105, "q": "A developing thymocyte recognizes self MHC but binds self peptide very strongly. What is the expected selection outcome?", "options": ["Immediate CTL degranulation", "Elimination by negative selection", "Class switching to IgG", "Automatic survival as mature Treg"], "correct": 1, "why": "Positive selection requires MHC recognition, but strong self-peptide reactivity triggers deletion during negative selection."}, {"n": 106, "q": "An activated CD8 precursor has increased IL-2Rα but has not received helper IL-2. What remains incomplete?", "options": ["Thymic VDJ rearrangement", "Initial peptide–MHC I recognition", "Expression of all MHC I molecules in the body", "Full proliferation and differentiation into effector CTL"], "correct": 3, "why": "The slides separate initial activation and receptor upregulation from IL-2-dependent effector differentiation."}, {"n": 107, "q": "Which pairing accurately distinguishes cytotoxic mechanisms?", "options": ["Granzyme creates MHC II; FasL rearranges TCR", "Perforin removes CLIP; FasL transports peptides to ER", "Perforin enables granzyme entry; FasL activates death-receptor signaling", "Both mechanisms require IgA secretion"], "correct": 2, "why": "CTLs can kill through directed granule delivery or Fas-mediated apoptosis, which begin with different molecular triggers."}, {"n": 108, "q": "Which set lists the four exons encoding the TCR constant-region-associated structure after rearrangement?", "options": ["C domain, connector, transmembrane segment, cytoplasmic tail", "V domain, D segment, J segment, leader peptide", "CD4 domain, CD8 domain, CD3 domain, ITAM", "α1 domain, α2 domain, α3 domain, β2-microglobulin"], "correct": 0, "why": "The slides divide the TCR C-region transcript into four functional exons: the constant domain, connector, membrane-spanning segment, and short cytoplasmic tail."}, {"n": 109, "q": "Which statement about TCR diversity matches the lecture?", "options": ["Somatic hypermutation and α/γ chain editing are major mechanisms", "Allelic exclusion occurs, but somatic hypermutation and α/γ editing do not", "TCR diversity is generated only by pairing identical chains", "N- and P-nucleotide additions occur only in immunoglobulins"], "correct": 1, "why": "TCRs gain diversity from segment combinations, junctional flexibility, and N/P additions. The lecture specifically contrasts allelic exclusion with absent somatic hypermutation and α/γ editing."}, {"n": 110, "q": "An MHC class I heavy chain is produced without β2-microglobulin. What step is impaired?", "options": ["Generation of antigen by lysosomal enzymes", "Recognition of MHC II by CD4", "Transport of the class I complex to the cell surface", "Replacement of CLIP by HLA-DM"], "correct": 2, "why": "The lecture identifies β2-microglobulin as the constant partner essential for class I transport to the surface. The α1/α2 groove binds peptide, while α3 contacts CD8."}, {"n": 111, "q": "Which MHC class II expression pattern best follows the lecture?", "options": ["Pre-B cells constitutively express the highest levels", "Resting macrophages always express more than dendritic cells", "Mature B cells cannot express class II until class switching", "Dendritic cells express it constitutively; mature B cells express it, and macrophages increase it after activation"], "correct": 3, "why": "Class II expression varies with differentiation and activation: pre-B cells lack detectable expression, mature B cells express it, dendritic cells constitutively express it, and activated macrophages upregulate it."}, {"n": 112, "q": "Which sequence correctly traces an endogenous viral peptide to surface presentation?", "options": ["Ubiquitin tagging → proteasome → TAP transport to ER → class I loading with tapasin assistance → surface", "Endocytosis → acidic vesicle → CLIP removal → class I loading → surface", "Ubiquitin tagging → HLA-DM → class II loading in nucleus → surface", "Proteasome → J chain → poly-Ig receptor → surface"], "correct": 0, "why": "Endogenous cytosolic proteins are tagged and degraded by proteasomes. TAP moves suitable peptides into the ER, where class I loading is assisted by tapasin before transport to the surface."}, {"n": 113, "q": "Which sequence correctly describes exogenous peptide presentation?", "options": ["Proteasome → TAP → ER class I binding → CD8 recognition", "Endocytosis → vesicle acidification and proteolysis → invariant-chain/CLIP removal by HLA-DM → class II peptide display", "RAG recombination → β2-microglobulin → class II peptide display", "Perforin release → granzyme entry → HLA-DM → class II display"], "correct": 1, "why": "The endocytic route digests extracellular material in acidified compartments. Class II is protected by invariant chain until CLIP is replaced through HLA-DM, permitting antigenic peptide display."}, {"n": 114, "q": "What is the immediate developmental consequence of a successful pre-TCR β/pre-Tα checkpoint?", "options": ["Deletion of every CD4-expressing cell", "Switching to antibody production", "CD3 signaling that prevents further β rearrangement and permits α rearrangement and CD4/CD8 expression", "Immediate cytotoxic granule secretion"], "correct": 2, "why": "A functional β chain pairs with pre-Tα and CD3 to signal survival, enforce β-chain allelic exclusion, and advance toward the double-positive stage and α-chain assembly."}, {"n": 115, "q": "Which comparison distinguishes positive from negative thymic selection?", "options": ["Positive selection deletes cells binding self peptide strongly; negative selection rescues cells unable to bind MHC", "Both steps exclusively select high-affinity recognition of self peptide", "Positive selection occurs only after mature T cells enter blood", "Positive selection retains cells capable of self-MHC interaction; negative selection deletes cells with excessive self-reactivity"], "correct": 3, "why": "The lecture describes positive selection as survival based on ability to recognize self MHC and negative selection as apoptosis of high-affinity self-reactive cells. Pre-TCR signaling is a separate earlier checkpoint."}, {"n": 116, "q": "What order best describes directed granule-mediated CTL killing?", "options": ["Antigen recognition → LFA-1/ICAM tight adhesion → granule and Golgi polarization → perforin-assisted granzyme delivery", "Granzyme release → antigen recognition → LFA-1 dissociation → Golgi polarization", "CD40 ligation → Ig class switching → perforin production by target cell", "HLA-DM removes CLIP → LFA-1 cleavage → caspase-9 export"], "correct": 0, "why": "TCR recognition increases LFA-1 affinity for ICAM and forms a conjugate. Cytotoxic granules and Golgi orient toward the contact; perforin facilitates granzyme access to the target."}, {"n": 117, "q": "Which contrast best distinguishes Tfh from Treg in the lecture?", "options": ["Tfh suppresses microbiota responses while Treg drives B-cell somatic hypermutation", "Tfh supports germinal-center B-cell affinity maturation; Treg produces IL-10/TGF-β to suppress inflammatory responses", "Tfh kills virus-infected cells by perforin while Treg presents lipid on CD1", "Both subsets chiefly produce IL-2 to activate CTL precursors"], "correct": 1, "why": "Tfh supports germinal-center B-cell responses through cytokines such as IL-4 and IL-21, whereas Treg limits inflammation and promotes tolerance of normal microbiota through IL-10 and TGF-β."}];
const $=id=>document.getElementById(id);
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
let order=[],index=0,missed=new Set(),roundWrong=new Set(),attempted=new Set(),answers=new Map(),reviewMode=false;
function makeEntry(id){let perm=shuffle([0,1,2,3]);return {id,perm}}
function reset(){const ids=BANK.map((_,i)=>i);order=( $('mode').value==='shuffled'?shuffle(ids):ids).map(makeEntry);index=0;missed=new Set();roundWrong=new Set();attempted=new Set();answers=new Map();reviewMode=false;show()}
function show(){if(index>=order.length){finish();return} $('study').classList.remove('hidden');$('end').classList.add('hidden');let e=order[index],q=BANK[e.id],answer=answers.get(e.id);$('counter').textContent=`${reviewMode?'Missed review · ':'Question '}${index+1} / ${order.length}`;$('question').textContent=q.q;const root=$('answers');root.replaceChildren();e.perm.forEach((original,pos)=>{const b=document.createElement('button');b.className='choice';const bold=document.createElement('b');bold.textContent='ABCD'[pos]+'.';b.append(bold,document.createTextNode(' '+q.options[original]));b.onclick=()=>choose(pos);if(answer!==undefined){b.disabled=true;if(original===q.correct)b.classList.add('correct');else if(pos===answer)b.classList.add('wrong')}root.append(b)});$('feedback').classList.toggle('hidden',answer===undefined);if(answer!==undefined){$('feedback').textContent=(e.perm[answer]===q.correct?'Correct. ':'Not quite. ')+q.why}else $('feedback').textContent='';$('next').disabled=answer===undefined;$('next').textContent=index===order.length-1?'Finish round ↓':'Next ↓';$('back').disabled=index===0;$('status').textContent=`${attempted.size} answered · ${missed.size} missed`; $('bar').style.width=(100*(index+1)/order.length)+'%'}
function choose(pos){let e=order[index];if(answers.has(e.id))return;answers.set(e.id,pos);attempted.add(e.id);if(e.perm[pos]!==BANK[e.id].correct){missed.add(e.id);roundWrong.add(e.id)}else missed.delete(e.id);show()}
function next(){if(index>=order.length)return;if(!answers.has(order[index].id))return;index++;show()}
function prev(){if(index>0){index--;show()}}
function finish(){ $('study').classList.add('hidden');$('end').classList.remove('hidden');$('endtitle').textContent=missed.size?'Round complete':'All questions mastered!';$('summary').textContent=`${attempted.size} answered in this round; ${missed.size} question(s) still need review.`;$('review').classList.toggle('hidden',missed.size===0);$('status').textContent=missed.size?`${missed.size} to review`:'Mastered';$('bar').style.width='100%'}
function review(){if(!missed.size)return;order=shuffle([...missed]).map(makeEntry);index=0;attempted=new Set();roundWrong=new Set();answers=new Map();reviewMode=true;show()}
$('restart').onclick=reset;$('again').onclick=reset;$('review').onclick=review;$('next').onclick=next;$('back').onclick=prev;$('mode').onchange=reset;
document.addEventListener('keydown',ev=>{if(ev.altKey||ev.ctrlKey||ev.metaKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(ev.key==='ArrowUp'){ev.preventDefault();prev();return}if($('study').classList.contains('hidden')){if(ev.key==='ArrowDown'&&missed.size){ev.preventDefault();review()}return}if(ev.key==='ArrowDown'){ev.preventDefault();next();return}if(/^[1-4]$/.test(ev.key)){ev.preventDefault();if(answers.has(order[index].id))next();else choose(Number(ev.key)-1)}});
