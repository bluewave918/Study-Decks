    <script>
        function shuffleQuestions(questionsArray) {
            return questionsArray.map(q => {
                const options = [...q.options];
                const correctAnswer = options[q.correct];

                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }

                const newCorrect = options.indexOf(correctAnswer);

                return {
                    q: q.q,
                    options: options,
                    correct: newCorrect
                };
            });
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

            currentMode = mode;
            document.getElementById('btnOrdered').classList.toggle('active', mode === 'ordered');
            document.getElementById('btnShuffled').classList.toggle('active', mode === 'shuffled');

            if (mode === 'ordered') {
                document.getElementById('modeInfo').innerHTML = '📖 LEARNING MODE: Questions in original order (content builds logically)';
                questions = [...questionsOrdered];
            } else {
                document.getElementById('modeInfo').innerHTML = '🔀 TESTING MODE: Questions randomized (check understanding independently)';
                questions = [...questionsShuffled];
            }

            resetQuiz();
        }

        function displayQuestion() {
            const q = questions[currentQ];
            const isRetry = currentQ >= originalQuestionsLength;

            document.getElementById('qNumber').textContent = `Question ${currentQ + 1}${isRetry ? ' 🔄' : ''}`;
            document.getElementById('questionText').textContent = q.q;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + index)}</span>${option}`;
                div.onclick = () => selectAnswer(index);
                container.appendChild(div);
            });

            document.getElementById('progressText').textContent = `Question ${currentQ + 1} of ${questions.length}`;
            const progress = ((currentQ + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            updateButtons();
            updateStats();

            if (answered[currentQ]) {
                showAnswer();
            } else {
                document.getElementById('feedback').classList.remove('show');
            }
        }

        function selectAnswer(index) {
            if (answered[currentQ]) return;

            userAnswers[currentQ] = index;
            answered[currentQ] = true;

            const q = questions[currentQ];
            const options = document.querySelectorAll('.option');

            if (index === q.correct) {
                correctCount++;
                options[index].classList.add('correct');
                showFeedback(true, "✓ Correct!");
            } else {
                incorrectCount++;
                options[index].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                showFeedback(false, `✗ Incorrect`);
                retryQueue.push(currentQ);
            }

            options.forEach(opt => opt.classList.add('disabled'));
            updateButtons();
            updateStats();
        }

        function showFeedback(isCorrect, message) {
            const fb = document.getElementById('feedback');
            fb.classList.add('show');
            fb.classList.toggle('correct', isCorrect);
            fb.classList.toggle('incorrect', !isCorrect);
            fb.innerHTML = `<div>${message}</div>`;
        }

        function showAnswer() {
            const q = questions[currentQ];
            const userAns = userAnswers[currentQ];
            const options = document.querySelectorAll('.option');

            options.forEach(opt => opt.classList.add('disabled'));

            if (userAns === q.correct) {
                options[userAns].classList.add('correct');
                showFeedback(true, "✓ Correct!");
            } else {
                options[userAns].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                showFeedback(false, `✗ Incorrect`);
            }
        }

        function nextQuestion() {
            if (currentQ < questions.length - 1) {
                currentQ++;
                displayQuestion();
            } else if (retryQueue.length > 0) {
                const nextRetryIndex = retryQueue.shift();
                questions.push(questions[nextRetryIndex]);
                answered.push(false);
                userAnswers.push(-1);
                currentQ++;
                displayQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQ > 0) {
                currentQ--;
                displayQuestion();
            }
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentQ === 0;
            document.getElementById('nextBtn').disabled = !answered[currentQ];
            document.getElementById('nextBtn').textContent = (currentQ === questions.length - 1 && answered[currentQ]) ? 'Results →' : 'Next →';
        }

        function updateStats() {
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('incorrect').textContent = incorrectCount;
            const perc = (correctCount + incorrectCount) > 0 ? Math.round((correctCount / (correctCount + incorrectCount)) * 100) : 0;
            document.getElementById('percentage').textContent = perc;
        }

        function showResults() {
            const percentage = Math.round((correctCount / questions.length) * 100);
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('resultScreen').classList.add('show');
            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalIncorrect').textContent = incorrectCount;

            let message = '';
            if (percentage === 100) message = '🌟 Perfect Score!';
            else if (percentage >= 90) message = '🎉 Excellent!';
            else if (percentage >= 80) message = '👍 Great!';
            else if (percentage >= 70) message = '📚 Good effort';
            else if (percentage >= 60) message = '💪 Keep studying';
            else message = '📖 Review more';

            document.getElementById('resultMessage').textContent = message;
        }

        function resetQuiz() {
            currentQ = 0;
            correctCount = 0;
            incorrectCount = 0;
            retryQueue = [];
            answered = new Array(originalQuestionsLength).fill(false);
            userAnswers = new Array(originalQuestionsLength).fill(-1);

            // Reset questions array based on current mode
            if (currentMode === 'ordered') {
                questions = [...questionsOrdered];
            } else {
                questions = [...questionsShuffled];
            }

            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('resultScreen').classList.remove('show');
            displayQuestion();
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (document.getElementById('resultScreen').classList.contains('show')) {
                if (/[0-9]/.test(key)) resetQuiz();
                return;
            }

            if (answered[currentQ]) {
                if (/[0-9]/.test(key)) nextQuestion();
                return;
            }

            if (key === '1' || key === '2' || key === '3' || key === '4') {
                selectAnswer(parseInt(key) - 1);
            }
        });

        displayQuestion();
    </script>
</body>
</html>
