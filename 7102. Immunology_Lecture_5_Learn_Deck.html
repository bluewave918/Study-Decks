label for="mode">Mode</label><select id="mode"><option value="ordered">Ordered learning</option><option value="shuffled">Shuffled testing</option></select><button id="restart">Restart deck</button><span id="status" class="muted"></span></div><div class="progress"><div id="bar" class="fill"></div></div><p class="kbd">Remote: 1–4 answer · After feedback, any 1–4 or ↓ advances · ↑ goes back · No Enter needed</p></div><div class="panel" id="study"><div id="counter" class="muted"></div><p class="question" id="question"></p><div id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="nav"><button id="back">← Previous</button><button id="next" class="primary" disabled>Next ↓</button></div></div><div class="panel hidden" id="end"><h2 id="endtitle">Round complete</h2><p id="summary"></p><div class="toolbar"><button id="review" class="primary">Review missed questions</button><button id="again">Restart full deck</button></div></div></main><script>
const BANK=[{"n": 1, "q": "What directly promotes longevity of activated memory lymphocytes?", "options": ["PI3 kinase activates Akt signaling that inactivates pro-apoptotic factors", "Complement C9 maintains lymphocyte survival", "RAG proteins permanently disable apoptosis", "IgM binding prevents all cell death"], "correct": 0, "why": "PI3 kinase creates a membrane docking site for Akt; activated Akt phosphorylates pro-apoptotic factors, reducing apoptosis and allowing memory cells to persist.", "section": 1, "sectionName": "Memory signaling (3 questions)"}, {"n": 2, "q": "Which event follows PI3 kinase activation in the lecture's memory-cell pathway?", "options": ["MHC class II is degraded by proteasomes", "Antibodies are converted directly into memory cells", "Fas ligand activates caspase 8", "A membrane lipid is phosphorylated to create an Akt docking site"], "correct": 3, "why": "The modified membrane lipid recruits Akt; its kinase activity then suppresses pro-apoptotic signaling.", "section": 1, "sectionName": "Memory signaling (3 questions)"}, {"n": 3, "q": "Why can memory cells persist for years after antigen clearance?", "options": ["They lose all surface antigen receptors", "They continuously require the original pathogen to divide", "They exclusively express IgM", "Their activation inhibits apoptotic pathways"], "correct": 3, "why": "The lecture attributes longevity to PI3K/Akt-mediated inactivation of pro-apoptotic factors, not persistent antigen.", "section": 1, "sectionName": "Memory signaling (3 questions)"}, {"n": 4, "q": "A memory lymphocyte remains in the secondary lymphoid organ where antigen was first encountered. What is it?", "options": ["Tissue-resident memory cell", "Naïve lymphocyte", "Effector memory cell", "Central memory cell"], "correct": 3, "why": "Central memory is defined by residence in the secondary lymphoid organ associated with the initial encounter.", "section": 2, "sectionName": "Memory localization (5 questions)"}, {"n": 5, "q": "Which memory-cell population circulates among tissues?", "options": ["Double-negative thymocytes", "Effector memory cells", "Central memory cells", "Tissue-resident memory cells"], "correct": 1, "why": "Effector memory cells enter the circulation and move among tissues, unlike central or tissue-resident populations.", "section": 2, "sectionName": "Memory localization (5 questions)"}, {"n": 6, "q": "A memory cell homes to the tissue where the pathogen first entered. Which classification fits?", "options": ["Central memory cell", "Tissue-resident memory cell", "Effector memory cell", "Pre-B cell"], "correct": 1, "why": "Tissue-resident memory cells localize to the original challenge site, placing them near likely future exposure.", "section": 2, "sectionName": "Memory localization (5 questions)"}, {"n": 7, "q": "What is the proposed benefit of tertiary lymphoid tissue in chronically infected organs?", "options": ["It creates a local microenvironment that promotes memory-cell activation", "It converts memory T cells into erythrocytes", "It replaces all primary lymphoid organs", "It prevents any antigen from entering the organ"], "correct": 0, "why": "The lecture describes local memory-cell residence and supportive microenvironments, especially in chronic infections such as parasites.", "section": 2, "sectionName": "Memory localization (5 questions)"}, {"n": 8, "q": "Which setting particularly favors tertiary lymphoid tissue formation in the lecture?", "options": ["A brief absence of all antigens", "TCR rearrangement in bone marrow", "Normal red blood cell turnover", "Chronic infection by parasites"], "correct": 3, "why": "Persistent local antigenic challenge favors a local memory response and tertiary lymphoid organization.", "section": 2, "sectionName": "Memory localization (5 questions)"}, {"n": 9, "q": "How does a secondary memory TH-cell response compare with the primary response?", "options": ["It requires a new thymic maturation cycle", "It is faster and stronger", "It always produces only IgM", "It has a longer lag phase and lower magnitude"], "correct": 1, "why": "Memory TH cells persist and activate with less stringent requirements, enabling a faster and stronger secondary response.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 10, "q": "Which cells can activate memory TH cells according to the lecture?", "options": ["All professional antigen-presenting cells", "Only infected neurons", "Only dendritic cells", "Only erythrocytes"], "correct": 0, "why": "The lecture contrasts naïve T-cell activation by dendritic cells with memory T-cell activation by all professional APCs.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 11, "q": "What cell-cycle state do resting memory TH cells share with naïve T cells?", "options": ["G0", "M phase", "G2 only", "S phase"], "correct": 0, "why": "Memory TH cells can remain arrested in G0 while retaining the ability to respond rapidly on rechallenge.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 12, "q": "What two signals are required for naïve T-cell activation in the lecture?", "options": ["CD2–LFA-3 and perforin–granzyme", "CD45RO and Fas–FasL alone", "IgM secretion and complement fixation", "TCR with CD4/CD8 recognition and CD28–B7 costimulation"], "correct": 3, "why": "The antigen-specific TCR/coreceptor interaction supplies one signal and CD28 binding B7 supplies the second.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 13, "q": "Why can effector and memory T cells respond to a target lacking B7?", "options": ["They no longer need antigen recognition", "They activate only through antibodies", "They can respond to TCR/coreceptor signaling without the naïve-cell costimulatory requirement", "They secrete B7 themselves before antigen recognition"], "correct": 2, "why": "The lecture states that memory and effector T cells require the TCR-CD4/8 signal but not the CD28–B7 signal.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 14, "q": "Which CD45 isoform is characteristic of naïve T cells in this lecture?", "options": ["CD45RA", "CD28", "CD45RO", "CD25"], "correct": 0, "why": "Naïve cells express CD45RA; memory and effector cells preferentially express CD45RO.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 15, "q": "Why does CD45RO favor a memory T-cell response?", "options": ["It binds IgE on mast cells", "It replaces the CD8 coreceptor", "It directly cleaves antigens into peptides", "It associates more avidly with the TCR and supports signal transduction"], "correct": 3, "why": "The lecture links CD45RO's stronger TCR association to more effective signal transmission.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 16, "q": "Which adhesion pair is correctly matched?", "options": ["LFA-1 binds CD45RO", "CD2 binds ICAM", "CD2 binds LFA-3", "CD28 binds LFA-3"], "correct": 2, "why": "CD2–LFA-3 is one stabilizing adhesion interaction; LFA-1 instead binds ICAM.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 17, "q": "Which adhesion pair is responsible for high-affinity stabilization after TCR recognizes appropriate MHC/peptide?", "options": ["HAT and myeloma", "CD45RA and CD45RO", "LFA-1 and ICAM", "IgE and Fcε receptor"], "correct": 2, "why": "Antigen recognition increases LFA-1 affinity for ICAM, promoting stable interaction with APC or target cells.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 18, "q": "Compared with naïve cells, effector cells express approximately how much more LFA-1 in the lecture?", "options": ["Tenfold", "Twofold", "No increase", "Fourfold"], "correct": 3, "why": "The slides state LFA-1 rises fourfold while CD2 rises twofold, increasing adhesive interactions.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 19, "q": "What change allows memory CTL precursors to differentiate without TH1-derived IL-2?", "options": ["Only Fas signaling generates IL-2", "TCR/CD8/MHC/peptide recognition induces both IL-2Rα and IL-2", "IgG replaces IL-2 as a growth signal", "Memory CTL precursors cannot express IL-2 receptors"], "correct": 1, "why": "The lecture says memory CTL-P cells generate their own IL-2 and IL-2Rα after recognition, reducing reliance on TH1 help.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 20, "q": "Which costimulatory interaction is suggested to be unnecessary for memory CTL-P activation?", "options": ["TCR–MHC peptide", "CD8–MHC class I", "IL-2–IL-2 receptor", "B7–CD28"], "correct": 3, "why": "Memory CTL precursors still recognize peptide-MHC but are less dependent on B7–CD28 costimulation.", "section": 3, "sectionName": "Memory activation (12 questions)"}, {"n": 21, "q": "What is the lag phase of the primary antibody response?", "options": ["Time needed for an ELISA substrate to change color", "Time between two vaccine boosters only", "Time between initial antigen exposure and detectable antibody", "Duration of B-cell life in bone marrow"], "correct": 2, "why": "The lag phase measures the delay before antibody is detected after first exposure.", "section": 4, "sectionName": "Primary secondary (5 questions)"}, {"n": 22, "q": "Which immunoglobulin appears first in a primary response?", "options": ["IgE", "IgA only", "IgM", "IgG"], "correct": 2, "why": "The lecture describes initial IgM production followed by a shift toward IgG.", "section": 4, "sectionName": "Primary secondary (5 questions)"}, {"n": 23, "q": "Which pattern characterizes a secondary antibody response?", "options": ["No detectable antibodies until months later", "Shorter lag, much more IgG, and higher antibody affinity", "Longer lag, exclusively IgM, and lower affinity", "Identical kinetics and affinity to the primary response"], "correct": 1, "why": "Memory responses start sooner and yield more IgG with increased affinity due to prior selection.", "section": 4, "sectionName": "Primary secondary (5 questions)"}, {"n": 24, "q": "During a secondary response, when is IgG produced relative to IgM?", "options": ["Only before any IgM is made", "At approximately the same time, in much greater quantity", "Only after all IgM disappears", "Never, because secondary responses use IgA exclusively"], "correct": 1, "why": "The lecture emphasizes rapid abundant IgG production alongside relatively little IgM.", "section": 4, "sectionName": "Primary secondary (5 questions)"}, {"n": 25, "q": "Why is antibody affinity typically higher after repeated antigen exposure?", "options": ["All antigen molecules become smaller", "Each antibody binds more antigen molecules by gaining extra Fab arms", "Antibody genes lose their variable regions", "The response recruits previously selected, affinity-matured memory B-cell populations"], "correct": 3, "why": "The higher-affinity antibodies reflect prior immune selection and memory rather than an increase in antibody valency.", "section": 4, "sectionName": "Primary secondary (5 questions)"}, {"n": 26, "q": "What is the central immunological purpose of vaccination?", "options": ["Generate protective immune memory before actual pathogen exposure", "Replace all innate immune responses", "Guarantee immediate elimination of every microbe without adaptive immunity", "Prevent lymphocyte activation"], "correct": 0, "why": "Vaccination presents immunogenic material in advance, enabling a rapid response during later genuine infection.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 27, "q": "How do formalin-inactivated and live attenuated whole-organism vaccines differ?", "options": ["Inactivated organisms are killed; attenuated organisms remain alive but nonvirulent", "Both are identical to recombinant mRNA vaccines", "Both contain only purified antibodies", "Inactivated organisms replicate normally; attenuated organisms contain no antigens"], "correct": 0, "why": "Formalin treatment kills the organism; attenuation reduces virulence while preserving living organisms.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 28, "q": "Which concern is specifically associated with an attenuated live vaccine?", "options": ["Inability to contain any microbial antigen", "Absolute inability to induce immune memory", "Requirement that it consist only of a synthetic peptide", "Mutation or reversion toward virulence"], "correct": 3, "why": "Because the organism remains alive, the lecture notes a risk of regaining virulence.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 29, "q": "What safety problem may occur during production of chemically inactivated vaccines?", "options": ["They lack all immune-recognizable epitopes", "Not every organism may be completely killed", "They necessarily produce an infection in every recipient", "They always revert by replicating"], "correct": 1, "why": "The lecture notes that incomplete killing could leave viable organisms in a purportedly inactivated preparation.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 30, "q": "Why can a live attenuated vaccine stimulate durable immunity?", "options": ["It contains no antigen and therefore avoids immune activation", "It immediately destroys all memory lymphocytes", "Limited infection and normal life-cycle progression prolong antigen exposure", "It consists entirely of purified IgG"], "correct": 2, "why": "The attenuated organism can undergo limited infection without progressing to disease, extending immune stimulation.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 31, "q": "Which polio vaccine is described as orally administered and live attenuated?", "options": ["BCG vaccine", "Sabin vaccine", "Recombinant HPV L1 vaccine", "Salk vaccine"], "correct": 1, "why": "Sabin is the oral live attenuated polio vaccine; Salk is the inactivated preparation.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 32, "q": "Which antibody class predominates in the lecture's description of oral Sabin vaccination?", "options": ["IgE", "IgG exclusively", "IgD", "IgA"], "correct": 3, "why": "The oral route stimulates mucosal immunity, with IgA predominating in the slide's description.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 33, "q": "Which organism was attenuated through prolonged culture to create the BCG vaccine?", "options": ["Corynebacterium diphtheriae", "Mycobacterium leprae", "Bordetella pertussis", "Mycobacterium bovis"], "correct": 3, "why": "The slides describe prolonged culture of M. bovis with bile, producing a form that stimulates protective cell-mediated immunity.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 34, "q": "Which immune response is particularly emphasized for BCG vaccination?", "options": ["Absence of any T-cell response", "Direct complement activation by the vaccine alone", "Cell-mediated immunity against a macrophage-associated pathogen", "Exclusively IgE-mediated mast-cell degranulation"], "correct": 2, "why": "BCG stimulates prolonged CMI, consistent with the intracellular macrophage-associated infection described.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 35, "q": "Which vaccine group is listed as live attenuated in the lecture?", "options": ["HPV L1 and recombinant influenza HA", "Tetanus and diphtheria toxoids", "Hepatitis A and Salk polio", "Measles, mumps, rubella, and varicella"], "correct": 3, "why": "The MMRV vaccines use attenuated viruses; the other examples involve inactivation or subunits.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 36, "q": "Which polio vaccine is formalin-inactivated?", "options": ["Ervebo", "Sabin vaccine", "BCG", "Salk vaccine"], "correct": 3, "why": "The original Salk vaccine was formalin-inactivated, contrasting with the oral live Sabin vaccine.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 37, "q": "Which antibody class is emphasized for injected inactivated polio and hepatitis A vaccines?", "options": ["Systemic IgG", "IgE exclusively", "Only IgD", "Only secretory IgA"], "correct": 0, "why": "The slides associate injected inactivated vaccines with systemic IgG production.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 38, "q": "Which production constraint limits conventional whole-organism vaccines?", "options": ["Some pathogens cannot be cultivated in vitro", "Live vaccines have unlimited shelf life without refrigeration", "All pathogens grow equally well in cheap media", "No production process requires safety precautions"], "correct": 0, "why": "Whole-organism production depends on cultivation, which is impossible or expensive for some pathogens.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 39, "q": "Why can refrigeration requirements complicate vaccine distribution?", "options": ["They prevent immune memory from forming in all recipients", "They eliminate the need for transport", "They hinder reliable storage in areas lacking electricity", "They increase antigen diversity in the vial"], "correct": 2, "why": "Cold-chain dependence makes distribution difficult where reliable refrigeration is unavailable.", "section": 5, "sectionName": "Vaccines conventional (14 questions)"}, {"n": 40, "q": "How can deleting a virulence gene improve a recombinant vaccine?", "options": ["Reduce disease-causing capacity while retaining antigenicity", "Turn all vaccine antigens into host proteins", "Ensure the organism can no longer be recognized by T cells", "Remove every immune-recognizable antigen"], "correct": 0, "why": "Virulence-gene deletion is intended to preserve immune stimulation while lowering the chance of disease and reversion.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 41, "q": "What is a recombinant carrier-vaccine strategy?", "options": ["Grow the fully virulent pathogen without modification", "Use an avirulent organism engineered to express a pathogen antigen", "Use only erythrocytes as antigen carriers", "Inject only immune serum from an infected patient"], "correct": 1, "why": "The carrier expresses an antigen from another pathogen while being designed not to cause the target disease.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 42, "q": "Why does the lecture describe purified recombinant subunit vaccines as unable to cause the source infection?", "options": ["They contain fully replication-competent pathogen genomes", "They contain an antigenic product rather than the infectious organism", "They must be administered through the pathogen's natural portal", "They eliminate the need for antigen recognition"], "correct": 1, "why": "A purified subunit does not contain the intact infectious organism needed to cause its disease.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 43, "q": "Which antigen property does the professor emphasize when selecting a subunit vaccine target?", "options": ["An antibody Fc domain from the recipient", "A surface-exposed protein accessible during natural infection", "Any abundant internal enzyme regardless of accessibility", "A protein absent from the infectious organism"], "correct": 1, "why": "The lecture prioritizes surface proteins because host antibodies can access them during infection.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 44, "q": "After identifying a candidate surface antigen gene, what is the next broad recombinant subunit workflow?", "options": ["Clone and express the protein, purify it, immunize, and test protection", "Immediately administer the pathogen without testing", "Use HAT medium to select antigen-producing viruses", "Delete all epitopes from the protein"], "correct": 0, "why": "The slides outline cloning, expression in bacteria/yeast/culture, purification, immunization, and infection challenge.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 45, "q": "Which components are identified in the lecture's TDaP formulation?", "options": ["IgE and anti-IgE antibodies", "Only recombinant Ebola glycoprotein", "Live poliovirus and HPV capsids", "Pertussis adhesin and formalin-inactivated tetanus/diphtheria toxoids"], "correct": 3, "why": "The lecture describes an adhesin for B. pertussis and toxoids from C. tetani and C. diphtheriae.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 46, "q": "Why does the lecture say influenza vaccination requires repeated administration?", "options": ["Frequent mutation of the viral genome alters relevant antigens", "The virus has no surface antigens", "Influenza never produces an immune response", "The vaccine permanently destroys B-cell memory"], "correct": 0, "why": "Antigenic variation reduces the match between existing immunity and circulating influenza strains.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 47, "q": "What makes recombinant HPV L1 capsids noninfectious?", "options": ["They contain a complete replicating HPV genome", "They assemble as empty capsids without viral genomes", "They lack all viral proteins", "They require living HPV in the vial"], "correct": 1, "why": "L1 forms immunogenic virus-like particles, but without a genome they cannot initiate HPV infection.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 48, "q": "Which HPV types does the lecture associate most strongly with genital warts?", "options": ["Types 6 and 11", "Types 20 and 21", "Types 16 and 18", "Types 1 and 2"], "correct": 0, "why": "The slides contrast wart-associated HPV 6/11 with cervical-cancer-associated HPV 16/18.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 49, "q": "Which HPV types does the lecture associate most strongly with cervical cancer?", "options": ["Types 1 and 4", "Types 20 and 21", "Types 16 and 18", "Types 6 and 11"], "correct": 2, "why": "The lecture distinguishes HPV 16/18 as major cancer-associated types.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 50, "q": "How was the original Gardasil formulation described in the slides?", "options": ["Four recombinant L1 capsids representing HPV 6, 11, 16, and 18", "Purified IgG against only HPV 16", "A formalin-killed whole HPV organism", "A live attenuated mixture of all HPV serotypes"], "correct": 0, "why": "The original formulation combined L1 virus-like particles from four HPV types, rather than live virus.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 51, "q": "Why can an HPV L1 virus-like particle stimulate immunity without causing infection?", "options": ["It must replicate inside host cells to expose L1", "It cannot be recognized by B-cell receptors", "It destroys every antigen-presenting cell", "Its capsid presents antigenic structure but contains no viral genome"], "correct": 3, "why": "The particle resembles the viral capsid antigenically without containing the genetic material for infection.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 52, "q": "Which process generates the mRNA used in the lecture's COVID-19 vaccine production scheme?", "options": ["Fusion of B cells with myeloma cells", "Antibody precipitation in agar", "Direct purification of intact infectious coronavirus", "In vitro transcription from a DNA template"], "correct": 3, "why": "The slides describe cDNA/PCR cloning followed by in vitro transcription to generate vaccine RNA.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 53, "q": "What substitution is made during in vitro transcription in the lecture's mRNA vaccine manufacturing scheme?", "options": ["It is an antibody linked to peroxidase", "It serves as a live viral carrier", "It encodes the viral envelope protein by itself", "It replaces uracil during production of modified mRNA"], "correct": 3, "why": "The slide explicitly identifies uracil replacement with N1-methyl-pseudouridine during in vitro transcription.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 54, "q": "Which part of the COVID-19 vaccine described is the antigenic target?", "options": ["The HAT salvage enzyme", "The antibody Fc region", "The CD45RA receptor", "The spike protein region encoded by the transcript"], "correct": 3, "why": "The lecture's vaccine design amplifies a region of the spike gene so cells can produce an immunogenic spike-derived protein.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 55, "q": "Which virus provides the recombinant vector for the Ebola vaccine in the lecture?", "options": ["Influenza A virus", "Vesicular stomatitis virus", "Poliovirus", "Human papillomavirus"], "correct": 1, "why": "The vaccine replaces VSV glycoprotein with Ebola glycoprotein in a recombinant VSV backbone.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 56, "q": "What gene replacement is central to the lecture's Ebola vaccine design?", "options": ["IgG replaced by IgE", "Ebola GP replaced by HPV L1", "VSV-GP replaced by Ebola GP", "TCR α replaced by TCR β"], "correct": 2, "why": "Replacing the VSV glycoprotein with Ebola surface glycoprotein changes the vector's surface antigen and reduces VSV virulence in the lecture's account.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 57, "q": "What protective antibody response is emphasized for recombinant VSV–Ebola vaccination?", "options": ["IgE against host mast cells", "Only IgD against B-cell receptors", "Antibody against HAT medium", "IgG against Ebola surface glycoprotein"], "correct": 3, "why": "The recombinant vector presents Ebola glycoprotein, stimulating an IgG response directed against that surface antigen.", "section": 6, "sectionName": "Recombinant vaccines (18 questions)"}, {"n": 58, "q": "What is the major advantage of non-culture molecular or immunological diagnosis?", "options": ["It can identify organisms without waiting days to weeks for cultivation", "It relies on visible colonies alone", "It requires every organism to grow in vitro", "It always eliminates the need for patient specimens"], "correct": 0, "why": "The lecture motivates diagnostic alternatives by the expense, delay, and impossibility of culturing some organisms.", "section": 7, "sectionName": "Diagnostics foundation (3 questions)"}, {"n": 59, "q": "What molecular property enabled the first immunological identification tests?", "options": ["Random DNA recombination in agar", "Nonspecific binding of all antibodies to every organism", "Specific binding of antibodies to target antigens", "Proteasomal cleavage of the test substrate"], "correct": 2, "why": "Antibody specificity permits detection of proteins associated with a particular organism.", "section": 7, "sectionName": "Diagnostics foundation (3 questions)"}, {"n": 60, "q": "Why were early diagnostic antibodies generated by injecting microbial proteins into animals?", "options": ["The animals' red cells converted into microbes", "Injected proteins immediately became monoclonal antibodies", "The proteins directly produced color without reagents", "Foreign proteins elicited antibodies that could later recognize those proteins"], "correct": 3, "why": "Immunization generates antibodies against the introduced antigen, which can then be harvested for assays.", "section": 7, "sectionName": "Diagnostics foundation (3 questions)"}, {"n": 61, "q": "What is a polyclonal antibody response?", "options": ["One immortal B-cell clone makes a homogeneous antibody", "A myeloma cell produces no antibody ever", "Multiple B-cell clones produce antibodies against multiple epitopes", "One antibody recognizes every possible antigen"], "correct": 2, "why": "Multiple epitopes recruit different B-cell clones, creating a mixture of antibodies with varied specificities.", "section": 8, "sectionName": "Monoclonal antibodies (9 questions)"}, {"n": 62, "q": "Why are monoclonal antibodies valuable in research and diagnostics?", "options": ["They bind every epitope on every antigen equally", "They require no antigen during production", "They are always mixtures of unrelated immunoglobulins", "They provide homogeneous antibody specificity for a single epitope"], "correct": 3, "why": "A single B-cell clone produces one defined specificity, improving consistency of targeted detection.", "section": 8, "sectionName": "Monoclonal antibodies (9 questions)"}, {"n": 63, "q": "What two cell types are fused to produce hybridomas?", "options": ["T cells and epithelial cells", "Neutrophils and erythrocytes", "Dendritic cells and platelets", "Antibody-producing B cells and myeloma cells"], "correct": 3, "why": "The B cell supplies desired antibody production while the myeloma contributes immortality.", "section": 8, "sectionName": "Monoclonal antibodies (9 questions)"}, {"n": 64, "q": "What reagent is used to promote cell fusion in the lecture's hybridoma protocol?", "options": ["HLA-DM", "Fluorescein", "Polyethylene glycol", "Horseradish peroxidase"], "correct": 2, "why": "The slide specifies 35% polyethylene glycol to facilitate B-cell/myeloma fusion.", "section": 8, "sectionName": "Monoclonal antibodies (9 questions)"}, {"n": 65, "q": "After fusion, why must individual hybridoma clones be screened?", "options": ["HAT medium identifies antigen affinity directly", "Every clone automatically recognizes the same epitope", "Screening replaces the need for immortal cells", "Only some surviving clones produce antibody with the desired specificity"], "correct": 3, "why": "HAT selects viable hybrids, but a separate specificity screen finds the clone producing the desire function reset(){const ids=BANK.map((_,i)=>i);order=( $('mode').value==='shuffled'?shuffle(ids):ids).map(makeEntry);index=0;missed=new Set();roundWrong=new Set();attempted=new Set();answers=new Map();reviewMode=false;show()}
function show(){if(index>=order.length){finish();return} $('study').classList.remove('hidden');$('end').classList.add('hidden');let e=order[index],q=BANK[e.id],answer=answers.get(e.id);$('counter').textContent=`${reviewMode?'Missed review · ':'Question '}${index+1} / ${order.length}`;$('question').textContent=q.q;const root=$('answers');root.replaceChildren();e.perm.forEach((original,pos)=>{const b=document.createElement('button');b.className='choice';const bold=document.createElement('b');bold.textContent='ABCD'[pos]+'.';b.append(bold,document.createTextNode(' '+q.options[original]));b.onclick=()=>choose(pos);if(answer!==undefined){b.disabled=true;if(original===q.correct)b.classList.add('correct');else if(pos===answer)b.classList.add('wrong')}root.append(b)});$('feedback').classList.toggle('hidden',answer===undefined);if(answer!==undefined){$('feedback').textContent=(e.perm[answer]===q.correct?'Correct. ':'Not quite. ')+q.why}else $('feedback').textContent='';$('next').disabled=answer===undefined;$('next').textContent=index===order.length-1?'Finish round ↓':'Next ↓';$('back').disabled=index===0;$('status').textContent=`${attempted.size} answered · ${missed.size} missed`; $('bar').style.width=(100*(index+1)/order.length)+'%'}
function choose(pos){let e=order[index];if(answers.has(e.id))return;answers.set(e.id,pos);attempted.add(e.id);if(e.perm[pos]!==BANK[e.id].correct){missed.add(e.id);roundWrong.add(e.id)}else missed.delete(e.id);show()}
function next(){if(index>=order.length)return;if(!answers.has(order[index].id))return;index++;show()}
function prev(){if(index>0){index--;show()}}
function finish(){ $('study').classList.add('hidden');$('end').classList.remove('hidden');$('endtitle').textContent=missed.size?'Round complete':'All questions mastered!';$('summary').textContent=`${attempted.size} answered in this round; ${missed.size} question(s) still need review.`;$('review').classList.toggle('hidden',missed.size===0);$('status').textContent=missed.size?`${missed.size} to review`:'Mastered';$('bar').style.width='100%'}
function review(){if(!missed.size)return;order=shuffle([...missed]).map(makeEntry);index=0;attempted=new Set();roundWrong=new Set();answers=new Map();reviewMode=true;show()}
$('restart').onclick=reset;$('again').onclick=reset;$('review').onclick=review;$('next').onclick=next;$('back').onclick=prev;$('mode').onchange=reset;
document.addEventListener('keydown',ev=>{if(ev.altKey||ev.ctrlKey||ev.metaKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(ev.key==='ArrowUp'){ev.preventDefault();prev();return}if($('study').classList.contains('hidden')){if(ev.key==='ArrowDown'&&missed.size){ev.preventDefault();review()}return}if(ev.key==='ArrowDown'){ev.preventDefault();next();return}if(/^[1-4]$/.test(ev.key)){ev.preventDefault();if(answers.has(order[index].id))next();else choose(Number(ev.key)-1)}});
reset();</script></body></html>
