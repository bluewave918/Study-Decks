            return questionsArray.map(q => {
                const options = [...q.options];
                const correctAnswer = options[q.correct];

                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }

                const newCorrect = options.indexOf(correctAnswer);

                return {
                    q: q.q,
                    options: options,
                    correct: newCorrect
                };
            });
        }

            { q: "How does ossification of the mandible proceed during development?", options: ["Slowly from anterior only", "Posteriorly to form body and ramus", "Anteriorly to posteriorly", "Throughout at equal rate"], correct: 1 },
            { q: "What happens to Meckel's cartilage during mandibular development?", options: ["It persists throughout life", "It largely disappears anteriorly", "It remains completely intact", "It transforms into bone directly"], correct: 1 },
            { q: "What are secondary/accessory cartilages and where do they form?", options: ["Separate cartilage elements", "Condylar, coronoid, and symphyseal cartilages forming from Meckel's cartilage", "Cartilage in the maxilla", "Additional cartilage models"], correct: 1 },
            { q: "When do secondary/accessory cartilages form?", options: ["Week 2-3", "During weeks 10-14 of development", "After birth", "Week 6-7"], correct: 1 },
            { q: "What is the functional importance of condylar cartilage?", options: ["Only provides articulation at TMJ", "Expands into a cone along ramus and ossifies via endochondral ossification; critical growth center", "Disappears without function", "Remains permanent cartilage"], correct: 1 },
            { q: "Where does condylar cartilage remain in the mature mandible?", options: ["Throughout the ramus", "At the articular ends on the head of the mandible", "In the body of the mandible", "Completely disappears"], correct: 1 },
            { q: "Is the mandible formed entirely by one ossification mechanism?", options: ["Yes, only intramembranous", "No, it is both membranous and endochondral in nature", "Only endochondral", "Only from cartilage models"], correct: 1 },
            { q: "Does the mandible undergo endochondral development directly from Meckel's cartilage?", options: ["Yes, directly", "No, it endochondrally develops through condylar cartilage which is a derivative of Meckel's cartilage", "Meckel's cartilage does not contribute", "Only the ramus is endochondral"], correct: 1 },
            { q: "Describe the fate of coronoid cartilage.", options: ["Persists throughout life", "Disappears pre-birth", "Transforms into bone at birth", "Remains as cartilage at coronoid process"], correct: 1 },
            { q: "Describe the fate of symphyseal cartilages.", options: ["Persist indefinitely", "Disappear in the first year of birth", "Disappear pre-birth", "Fuse but remain as cartilage"], correct: 1 },
            { q: "What role does condyle cartilage play in mandibular growth?", options: ["Provides articulation only", "Is an important growth center for ramus, driving intramembranous ossification, then ossifies itself via endochondral ossification", "Has no growth function", "Only provides structural support"], correct: 1 },
            { q: "Condyle cartilage serves dual functions in the mandible - what are they?", options: ["Only growth and ossification", "Articulation at TMJ and growth of the mandible", "Only sensory and motor", "Growth alone without articulation"], correct: 1 }
        ];

        let questionsOrdered = shuffleQuestions(questionsBase);
        let questionsShuffled = shuffleQuestions(shuffleArray(questionsBase));
        let questions = [...questionsOrdered];
        let currentMode = 'ordered';

        let currentQ = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let answered = new Array(questions.length).fill(false);
        let userAnswers = new Array(questions.length).fill(-1);
        let originalQuestionsLength = questions.length;
        let retryQueue = [];

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnOrdered').classList.toggle('active', mode === 'ordered');
            document.getElementById('btnShuffled').classList.toggle('active', mode === 'shuffled');

            if (mode === 'ordered') {
                document.getElementById('modeInfo').innerHTML = '📖 LEARNING MODE: Questions in original order (content builds logically)';
                questions = [...questionsOrdered];
            } else {
                document.getElementById('modeInfo').innerHTML = '🔀 TESTING MODE: Questions randomized (check understanding independently)';
                questions = [...questionsShuffled];
            }

            resetQuiz();
        }

        function displayQuestion() {
            const q = questions[currentQ];
            const isRetry = currentQ >= originalQuestionsLength;

            document.getElementById('qNumber').textContent = `Question ${currentQ + 1}${isRetry ? ' 🔄' : ''}`;
            document.getElementById('questionText').textContent = q.q;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
                div.onclick = () => selectAnswer(index);
                container.appendChild(div);
            });

            document.getElementById('progressText').textContent = `Question ${currentQ + 1} of ${questions.length}`;
            const progress = ((currentQ + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            updateButtons();
            updateStats();

            if (answered[currentQ]) {
                showAnswer();
            } else {
                document.getElementById('feedback').classList.remove('show');
            }
        }

        function selectAnswer(index) {
            if (answered[currentQ]) return;

            userAnswers[currentQ] = index;
            answered[currentQ] = true;

            const q = questions[currentQ];
            const options = document.querySelectorAll('.option');

            if (index === q.correct) {
                correctCount++;
                options[index].classList.add('correct');
                showFeedback(true, "✓ Correct!");
            } else {
                incorrectCount++;
                options[index].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                showFeedback(false, `✗ Incorrect`);
                retryQueue.push(currentQ);
            }

            options.forEach(opt => opt.classList.add('disabled'));
            updateButtons();
            updateStats();
        }

        function showFeedback(isCorrect, message) {
            const fb = document.getElementById('feedback');
            fb.classList.add('show');
            fb.classList.toggle('correct', isCorrect);
            fb.classList.toggle('incorrect', !isCorrect);
            fb.innerHTML = `<div>${message}</div>`;
        }

        function showAnswer() {
            const q = questions[currentQ];
            const userAns = userAnswers[currentQ];
            const options = document.querySelectorAll('.option');

            options.forEach(opt => opt.classList.add('disabled'));

            if (userAns === q.correct) {
                options[userAns].classList.add('correct');
                showFeedback(true, "✓ Correct!");
            } else {
                options[userAns].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                showFeedback(false, `✗ Incorrect`);
            }
        }

        function nextQuestion() {
            if (currentQ < questions.length - 1) {
                currentQ++;
                displayQuestion();
            } else if (retryQueue.length > 0) {
                const nextRetryIndex = retryQueue.shift();
                questions.push(questions[nextRetryIndex]);
                answered.push(false);
                userAnswers.push(-1);
                currentQ++;
                displayQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQ > 0) {
                currentQ--;
                displayQuestion();
            }
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentQ === 0;
            document.getElementById('nextBtn').disabled = !answered[currentQ];
            document.getElementById('nextBtn').textContent = (currentQ === questions.length - 1 && answered[currentQ]) ? 'Results →' : 'Next →';
        }

        function updateStats() {
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('incorrect').textContent = incorrectCount;
            const perc = (correctCount + incorrectCount) > 0 ? Math.round((correctCount / (correctCount + incorrectCount)) * 100) : 0;
            document.getElementById('percentage').textContent = perc;
        }

        function showResults() {
            const percentage = Math.round((correctCount / questions.length) * 100);
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('resultScreen').classList.add('show');
            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalIncorrect').textContent = incorrectCount;

            let message = '';
            if (percentage === 100) message = '🌟 Perfect!';
            else if (percentage >= 90) message = '🎉 Excellent!';
            else if (percentage >= 80) message = '👍 Great!';
            else if (percentage >= 70) message = '📚 Good effort';
            else if (percentage >= 60) message = '💪 Keep studying';
            else message = '📖 Review more';

            document.getElementById('resultMessage').textContent = message;
        }

        function resetQuiz() {
            currentQ = 0;
            correctCount = 0;
            incorrectCount = 0;
            retryQueue = [];
            answered = new Array(originalQuestionsLength).fill(false);
            userAnswers = new Array(originalQuestionsLength).fill(-1);

            // Reset questions array based on current mode
            if (currentMode === 'ordered') {
                questions = [...questionsOrdered];
            } else {
                questions = [...questionsShuffled];
            }

            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('resultScreen').classList.remove('show');
            displayQuestion();
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (document.getElementById('resultScreen').classList.contains('show')) {
                if (/[0-9]/.test(key)) resetQuiz();
                return;
            }

            if (answered[currentQ]) {
                if (/[0-9]/.test(key)) nextQuestion();
                return;
            }

            if (key === '1' || key === '2' || key === '3' || key === '4') {
                selectAnswer(parseInt(key) - 1);
            }
        });

        displayQuestion();
    </script>
</body>
</html>
